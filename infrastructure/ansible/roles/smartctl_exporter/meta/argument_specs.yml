---
argument_specs:
  main:
    short_description: Install and configure smartctl_exporter for node disk health monitoring.
    options:
      smartctl_exporter:
        type: dict
        required: true
        options:
          packages:
            type: list
            elements: str
            required: true
          service_name:
            type: str
            required: true
          binary_path:
            type: str
            required: true
          listen_address:
            type: str
            required: true
          telemetry_path:
            type: str
            required: true
          interval:
            type: str
            required: true
          rescan:
            type: str
            required: true
          device_include:
            type: str
            required: true
          powermode_check:
            type: str
            required: true
          log_level:
            type: str
            required: true
