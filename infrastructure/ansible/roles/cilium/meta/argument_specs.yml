---
argument_specs:
  main:
    short_description: Install and validate Cilium plus bundled Traefik exposure on the bootstrap K3s server.
    options:
      k3s:
        type: dict
        required: true
        options:
          version:
            type: str
            required: true
          token:
            type: str
            required: true
            no_log: true
          registration_vip:
            type: str
            required: true
            description:
              - Stable virtual IP used for K3s API access and server registration.
          tls_sans:
            type: list
            elements: str
            required: true
      k3s_node:
        type: dict
        required: true
        options:
          cluster_init:
            type: bool
            required: true
            description:
              - Whether the target node is the initial K3s control-plane node.
      cilium:
        type: dict
        required: true
        options:
          version:
            type: str
            required: true
            description:
              - Exact Cilium dataplane version to install.
          cli_version:
            type: str
            required: true
            description:
              - Exact Cilium CLI version to install for bootstrap and validation.
          agent_capabilities:
            type: list
            required: true
            elements: str
            description:
              - Capabilities granted to the cilium-agent container.
          operator_replicas:
            type: int
            required: true
            description:
              - Number of Cilium operator replicas to run.
          cluster_pool_ipv4_pod_cidr_list:
            type: str
            required: true
            description:
              - Cluster pool CIDR that Cilium should allocate pod IPs from.
          k8s_service_port:
            type: int
            required: true
            description:
              - API port Cilium should use when talking to the K3s control-plane VIP.
          service_topology:
            type: bool
            required: true
            description:
              - Whether Cilium should honor Kubernetes Service trafficDistribution topology hints.
          resources:
            type: dict
            required: true
            description:
              - Resource envelopes for the Cilium agent, init containers, Envoy, and operator.
          hubble:
            type: dict
            required: true
            options:
              enabled:
                type: bool
                required: true
                description:
                  - Whether Hubble flow visibility should be enabled.
              relay:
                type: dict
                required: true
                options:
                  enabled:
                    type: bool
                    required: true
                    description:
                      - Whether Hubble Relay should be enabled.
              ui:
                type: dict
                required: true
                options:
                  enabled:
                    type: bool
                    required: true
                    description:
                      - Whether Hubble UI should be enabled.
                  replicas:
                    type: int
                    required: true
                    description:
                      - Number of Hubble UI replicas to run.
                  ingress:
                    type: dict
                    required: true
                    options:
                      enabled:
                        type: bool
                        required: true
                        description:
                          - Whether to create an ingress for Hubble UI.
                      class_name:
                        type: str
                        required: true
                        description:
                          - IngressClass name for Hubble UI.
                      hosts:
                        type: list
                        elements: str
                        required: true
                        description:
                          - Hostnames for the Hubble UI ingress.
                      tls:
                        type: list
                        elements: dict
                        required: true
                        description:
                          - TLS entries for the Hubble UI ingress.
      traefik:
        type: dict
        required: true
        options:
          namespace:
            type: str
            required: true
            description:
              - Namespace used by the bundled K3s Traefik packaged component.
          ingress_class_name:
            type: str
            required: true
            description:
              - IngressClass name apps should target.
          service_name:
            type: str
            required: true
            description:
              - Service name created by the bundled Traefik deployment.
          replicas:
            type: int
            required: true
            description:
              - Number of Traefik replicas to run.
          priority_class_name:
            type: str
            required: true
            description:
              - Priority class Traefik should use.
          resources:
            type: dict
            required: true
            description:
              - CPU and memory requests and limits for the Traefik container.
          service:
            type: dict
            required: true
            options:
              load_balancer_ip:
                type: str
                required: true
                description:
                  - Fixed IP that the configured load balancer should allocate to Traefik.
              load_balancer_class:
                type: str
                required: true
                description:
                  - Optional LoadBalancerClass Traefik should request; empty selects the cluster default.
              address_pool_name:
                type: str
                required: true
                description:
                  - MetalLB IPAddressPool Traefik should request.
              external_traffic_policy:
                type: str
                required: true
                choices:
                  - Cluster
                  - Local
                description:
                  - externalTrafficPolicy Traefik should use for the LAN LoadBalancer service.
