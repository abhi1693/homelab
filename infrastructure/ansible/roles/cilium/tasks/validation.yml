---
- name: Assert Cilium validation is running on the bootstrap server
  ansible.builtin.assert:
    that:
      - k3s_node.cluster_init | bool
    fail_msg: cilium validation must run on the initial K3s server where k3s_node.cluster_init=true.
    success_msg: "Validating Cilium from the bootstrap K3s server"

- name: Check Cilium and bundled Traefik manifest files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/cilium
    - /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
  register: cilium_core_file_stats

- name: Assert Cilium CLI and bundled Traefik manifest files exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Expected {{ item.stat.path }} to exist"
    success_msg: "{{ item.stat.path }} exists"
  loop: "{{ cilium_core_file_stats.results }}"

- name: Read installed Cilium CLI version
  ansible.builtin.command: /usr/local/bin/cilium version --client
  register: cilium_cli_version_output
  changed_when: false

- name: Assert installed Cilium CLI version matches inventory
  ansible.builtin.assert:
    that:
      - cilium.cli_version in cilium_cli_version_output.stdout
    fail_msg: "Expected installed Cilium CLI version {{ cilium.cli_version }}"
    success_msg: "Installed Cilium CLI version matches {{ cilium.cli_version }}"

- name: Wait for Cilium to report healthy status
  ansible.builtin.command:
    argv:
      - /usr/local/bin/cilium
      - status
      - --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_status
  changed_when: false

- name: Wait for Cilium DaemonSet rollout
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - rollout
      - status
      - daemonset/cilium
      - --timeout=300s
  register: cilium_daemonset_rollout
  changed_when: false

- name: Wait for Cilium operator rollout
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - rollout
      - status
      - deployment/cilium-operator
      - --timeout=300s
  register: cilium_operator_rollout
  changed_when: false

- name: Read deployed Cilium kube-proxy replacement setting
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - get
      - configmap
      - cilium-config
      - -o
      - jsonpath={.data.kube-proxy-replacement}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_kube_proxy_replacement
  changed_when: false

- name: Assert Cilium replaces kube-proxy
  ansible.builtin.assert:
    that:
      - cilium_kube_proxy_replacement.stdout | trim == 'true'
    fail_msg: Expected Cilium kube-proxy replacement to be enabled.
    success_msg: Cilium kube-proxy replacement is enabled.

- name: Read deployed Cilium service topology setting
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - get
      - configmap
      - cilium-config
      - -o
      - jsonpath={.data.enable-service-topology}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_service_topology
  changed_when: false

- name: Assert Cilium service topology matches inventory
  ansible.builtin.assert:
    that:
      - (cilium_service_topology.stdout | trim | bool) == (cilium.service_topology | bool)
    fail_msg: Expected Cilium service topology to match inventory.
    success_msg: Cilium service topology matches inventory.

- name: Read deployed Cilium local redirect policy setting
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - get
      - configmap
      - cilium-config
      - -o
      - jsonpath={.data.enable-local-redirect-policy}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_local_redirect_policies
  changed_when: false

- name: Assert Cilium local redirect policies stay disabled
  ansible.builtin.assert:
    that:
      - (cilium_local_redirect_policies.stdout | trim | default('false', true)) == 'false'
    fail_msg: Expected Cilium local redirect policies to remain disabled.
    success_msg: Cilium local redirect policies remain disabled.

- name: Wait for Hubble Relay rollout
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - rollout
      - status
      - deployment/hubble-relay
      - --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when:
    - cilium.hubble.enabled | bool
    - cilium.hubble.relay.enabled | bool
  changed_when: false

- name: Wait for Hubble UI rollout
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - rollout
      - status
      - deployment/hubble-ui
      - --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when:
    - cilium.hubble.enabled | bool
    - cilium.hubble.ui.enabled | bool
  changed_when: false

- name: Read Hubble UI ingress class
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - get
      - ingress
      - hubble-ui
      - -o
      - jsonpath={.spec.ingressClassName}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: hubble_ui_ingress_class
  changed_when: false
  when:
    - cilium.hubble.enabled | bool
    - cilium.hubble.ui.enabled | bool
    - cilium.hubble.ui.ingress.enabled | bool

- name: Assert Hubble UI ingress class matches inventory
  ansible.builtin.assert:
    that:
      - hubble_ui_ingress_class.stdout | trim == cilium.hubble.ui.ingress.class_name
    fail_msg: "Expected Hubble UI ingressClassName {{ cilium.hubble.ui.ingress.class_name }}"
    success_msg: "Hubble UI ingressClassName matches {{ cilium.hubble.ui.ingress.class_name }}"
  when:
    - cilium.hubble.enabled | bool
    - cilium.hubble.ui.enabled | bool
    - cilium.hubble.ui.ingress.enabled | bool

- name: Read Hubble UI ingress hosts
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - get
      - ingress
      - hubble-ui
      - -o
      - jsonpath={.spec.rules[*].host}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: hubble_ui_ingress_hosts
  changed_when: false
  when:
    - cilium.hubble.enabled | bool
    - cilium.hubble.ui.enabled | bool
    - cilium.hubble.ui.ingress.enabled | bool

- name: Assert Hubble UI ingress hosts match inventory
  ansible.builtin.assert:
    that:
      - cilium.hubble.ui.ingress.hosts | difference(hubble_ui_ingress_hosts.stdout.split()) | length == 0
    fail_msg: "Expected Hubble UI ingress hosts {{ cilium.hubble.ui.ingress.hosts | join(', ') }}"
    success_msg: "Hubble UI ingress hosts match inventory"
  when:
    - cilium.hubble.enabled | bool
    - cilium.hubble.ui.enabled | bool
    - cilium.hubble.ui.ingress.enabled | bool

- name: Count unique nodes hosting Cilium operator pods
  ansible.builtin.shell: >
    /usr/local/bin/k3s kubectl -n kube-system get pods -l io.cilium/app=operator
    -o custom-columns=NODE:.spec.nodeName --no-headers | awk 'NF' | sort -u | wc -l
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_operator_unique_nodes
  changed_when: false
  when: cilium.operator_replicas | int > 1

- name: Assert Cilium operator pods are spread across multiple nodes
  ansible.builtin.assert:
    that:
      - cilium_operator_unique_nodes.stdout | int >= 2
    fail_msg: Expected Cilium operator pods to be scheduled across at least two nodes.
    success_msg: "Cilium operator pods are spread across multiple nodes"
  when: cilium.operator_replicas | int > 1

- name: Check bundled Traefik HelmChartConfig
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - get
      - helmchartconfig
      - traefik
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for bundled Traefik deployment rollout
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ traefik.namespace }}"
      - rollout
      - status
      - "deployment/{{ traefik.service_name }}"
      - --timeout=30s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_traefik_rollout
  changed_when: false
  failed_when: false
  until: cilium_traefik_rollout.rc == 0
  retries: 30
  delay: 10

- name: Read bundled Traefik deployment replica count
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ traefik.namespace }}"
      - get
      - deployment
      - "{{ traefik.service_name }}"
      - -o
      - jsonpath={.spec.replicas}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_replica_count
  changed_when: false

- name: Assert bundled Traefik replica count matches inventory
  ansible.builtin.assert:
    that:
      - traefik_replica_count.stdout | int == traefik.replicas | int
    fail_msg: "Expected Traefik to run {{ traefik.replicas }} replicas"
    success_msg: "Traefik replica count matches {{ traefik.replicas }}"

- name: Read bundled Traefik deployment priority class
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ traefik.namespace }}"
      - get
      - deployment
      - "{{ traefik.service_name }}"
      - -o
      - jsonpath={.spec.template.spec.priorityClassName}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_priority_class
  changed_when: false

- name: Assert bundled Traefik uses the configured priority class
  ansible.builtin.assert:
    that:
      - traefik_priority_class.stdout | trim == traefik.priority_class_name
    fail_msg: "Expected Traefik to use priority class {{ traefik.priority_class_name }}"
    success_msg: "Traefik uses priority class {{ traefik.priority_class_name }}"

- name: Count unique nodes hosting bundled Traefik pods
  ansible.builtin.shell: >
    /usr/local/bin/k3s kubectl -n {{ traefik.namespace }}
    get pods -l app.kubernetes.io/name=traefik
    -o custom-columns=NODE:.spec.nodeName --no-headers | awk 'NF' | sort -u | wc -l
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_unique_nodes
  changed_when: false

- name: Assert bundled Traefik pods are spread across multiple nodes
  ansible.builtin.assert:
    that:
      - traefik_unique_nodes.stdout | int >= 2
    fail_msg: Expected Traefik pods to be scheduled across at least two nodes.
    success_msg: "Traefik pods are spread across multiple nodes"

- name: Check Traefik IngressClass
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - ingressclass
      - "{{ traefik.ingress_class_name }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Read bundled Traefik service type
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ traefik.namespace }}"
      - get
      - "service/{{ traefik.service_name }}"
      - -o
      - jsonpath={.spec.type}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_service_type
  changed_when: false

- name: Assert bundled Traefik service type is LoadBalancer
  ansible.builtin.assert:
    that:
      - traefik_service_type.stdout | trim == 'LoadBalancer'
    fail_msg: Expected Traefik service type LoadBalancer.
    success_msg: "Traefik service type is LoadBalancer"

- name: Read bundled Traefik service load balancer class
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ traefik.namespace }}"
      - get
      - "service/{{ traefik.service_name }}"
      - -o
      - jsonpath={.spec.loadBalancerClass}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_load_balancer_class
  changed_when: false

- name: Assert bundled Traefik service uses the configured load balancer class
  ansible.builtin.assert:
    that:
      - traefik_load_balancer_class.stdout | trim == traefik.service.load_balancer_class
    fail_msg: "Expected Traefik service to use loadBalancerClass {{ traefik.service.load_balancer_class }}"
    success_msg: "Traefik service uses loadBalancerClass {{ traefik.service.load_balancer_class }}"

- name: Read bundled Traefik MetalLB address pool annotation
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ traefik.namespace }}"
      - get
      - "service/{{ traefik.service_name }}"
      - -o
      - jsonpath={.metadata.annotations.metallb\.io/address-pool}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_metallb_address_pool
  changed_when: false

- name: Assert bundled Traefik requests the configured MetalLB address pool
  ansible.builtin.assert:
    that:
      - traefik_metallb_address_pool.stdout | trim == traefik.service.address_pool_name
    fail_msg: "Expected Traefik to request MetalLB pool {{ traefik.service.address_pool_name }}"
    success_msg: "Traefik requests MetalLB pool {{ traefik.service.address_pool_name }}"

- name: Read bundled Traefik service external traffic policy
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ traefik.namespace }}"
      - get
      - "service/{{ traefik.service_name }}"
      - -o
      - jsonpath={.spec.externalTrafficPolicy}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_external_traffic_policy
  changed_when: false

- name: Assert bundled Traefik external traffic policy matches inventory
  ansible.builtin.assert:
    that:
      - traefik_external_traffic_policy.stdout | trim == traefik.service.external_traffic_policy
    fail_msg: "Expected Traefik externalTrafficPolicy {{ traefik.service.external_traffic_policy }}"
    success_msg: "Traefik externalTrafficPolicy matches {{ traefik.service.external_traffic_policy }}"

- name: Check MetalLB Layer 2 workloads
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - metallb-system
      - rollout
      - status
      - "{{ item }}"
      - --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  loop:
    - deployment/metallb-controller
    - daemonset/metallb-speaker

- name: Check MetalLB Layer 2 exposure resources
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - metallb-system
      - get
      - "{{ item.kind }}"
      - "{{ item.name }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
  loop:
    - kind: IPAddressPool
      name: "{{ traefik.service.address_pool_name }}"
    - kind: L2Advertisement
      name: lan

- name: Read bundled Traefik service external IP
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - "{{ traefik.namespace }}"
      - get
      - "service/{{ traefik.service_name }}"
      - -o
      - jsonpath={.status.loadBalancer.ingress[0].ip}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_traefik_lb_ip
  changed_when: false

- name: Assert bundled Traefik service received the configured external IP
  ansible.builtin.assert:
    that:
      - cilium_traefik_lb_ip.stdout | trim == traefik.service.load_balancer_ip
    fail_msg: "Expected Traefik service external IP {{ traefik.service.load_balancer_ip }}"
    success_msg: "Traefik service external IP matches {{ traefik.service.load_balancer_ip }}"

- name: Wait for kube-system addon pods to become ready after Cilium install
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - wait
      - --for=condition=Ready
      - pod
      - --selector={{ item.selector }}
      - --timeout=300s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop:
    - name: coredns
      selector: k8s-app=kube-dns
    - name: metrics-server
      selector: k8s-app=metrics-server
  loop_control:
    label: "{{ item.name }}"
  register: cilium_core_pod_readiness
  changed_when: false

- name: Check K3s API readiness through the kube-vip endpoint after Cilium install
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig
      - /etc/rancher/k3s/k3s.yaml
      - --server=https://{{ k3s.registration_vip }}:{{ cilium.k8s_service_port }}
      - get
      - --raw=/readyz
  register: cilium_vip_readyz
  changed_when: false

- name: Assert K3s API stays reachable through kube-vip after Cilium install
  ansible.builtin.assert:
    that:
      - cilium_vip_readyz.stdout | trim == 'ok'
    fail_msg: >-
      Expected K3s API /readyz endpoint to return ok through
      https://{{ k3s.registration_vip }}:{{ cilium.k8s_service_port }}
    success_msg: "K3s API is reachable through kube-vip after Cilium installation"

- name: Read Cilium component resource requirements
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - -n
      - kube-system
      - get
      - "{{ item.kind }}"
      - "{{ item.resource_name | default(item.name) }}"
      - -o
      - "jsonpath={{ item.jsonpath }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop:
    - name: cilium-agent
      kind: daemonset
      resource_name: cilium
      jsonpath: '{.spec.template.spec.containers[?(@.name=="cilium-agent")].resources.requests.cpu}{" "}{.spec.template.spec.containers[?(@.name=="cilium-agent")].resources.requests.memory}{" "}{.spec.template.spec.containers[?(@.name=="cilium-agent")].resources.limits.memory}'
      expected:
        - "{{ cilium.resources.agent.requests.cpu }}"
        - "{{ cilium.resources.agent.requests.memory }}"
        - "{{ cilium.resources.agent.limits.memory }}"
    - name: cilium-envoy
      kind: daemonset
      jsonpath: '{.spec.template.spec.containers[?(@.name=="cilium-envoy")].resources.requests.cpu}{" "}{.spec.template.spec.containers[?(@.name=="cilium-envoy")].resources.requests.memory}{" "}{.spec.template.spec.containers[?(@.name=="cilium-envoy")].resources.limits.memory}'
      expected:
        - "{{ cilium.resources.envoy.requests.cpu }}"
        - "{{ cilium.resources.envoy.requests.memory }}"
        - "{{ cilium.resources.envoy.limits.memory }}"
    - name: cilium-operator
      kind: deployment
      jsonpath: '{.spec.template.spec.containers[0].resources.requests.cpu}{" "}{.spec.template.spec.containers[0].resources.requests.memory}{" "}{.spec.template.spec.containers[0].resources.limits.cpu}{" "}{.spec.template.spec.containers[0].resources.limits.memory}'
      expected:
        - "{{ cilium.resources.operator.requests.cpu }}"
        - "{{ cilium.resources.operator.requests.memory }}"
        - "{{ cilium.resources.operator.limits.cpu }}"
        - "{{ cilium.resources.operator.limits.memory }}"
    - name: traefik
      kind: deployment
      jsonpath: '{.spec.template.spec.containers[0].resources.requests.cpu}{" "}{.spec.template.spec.containers[0].resources.requests.memory}{" "}{.spec.template.spec.containers[0].resources.limits.cpu}{" "}{.spec.template.spec.containers[0].resources.limits.memory}'
      expected:
        - "{{ traefik.resources.requests.cpu }}"
        - "{{ traefik.resources.requests.memory }}"
        - "{{ traefik.resources.limits.cpu }}"
        - "{{ traefik.resources.limits.memory }}"
  loop_control:
    label: "{{ item.name }}"
  register: cilium_component_resource_requirements
  changed_when: false

- name: Assert Cilium component resource requirements match inventory
  ansible.builtin.assert:
    that:
      - item.stdout.split() == item.item.expected
    fail_msg: "Expected {{ item.item.name }} resource requirements to match inventory."
    success_msg: "{{ item.item.name }} resource requirements match inventory"
  loop: "{{ cilium_component_resource_requirements.results }}"
  loop_control:
    label: "{{ item.item.name }}"
