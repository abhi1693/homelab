---
argument_specs:
  main:
    short_description: Prepare base operating system settings.
    options:
      os_prep:
        type: dict
        required: true
        options:
          manage_passwordless_sudo:
            type: bool
            required: false
            default: false
            description:
              - Manage and validate the inventory automation account sudo rule.
          timezone:
            type: str
            required: true
            description:
              - System timezone to enforce on the host.
          logging:
            type: dict
            required: true
            description:
              - Persistent journal and bounded local OpenTelemetry payload policy.
            options:
              journal_system_max_use: {type: str, required: true}
              journal_system_keep_free: {type: str, required: true}
              journal_runtime_max_use: {type: str, required: true}
              journal_max_retention: {type: str, required: true}
              journal_sync_interval: {type: str, required: true}
              journal_rate_limit_interval: {type: str, required: true}
              journal_rate_limit_burst: {type: int, required: true}
              queue_directory: {type: path, required: true}
              queue_image: {type: path, required: true}
              queue_size_mib: {type: int, required: true}
              queue_reserve_mib: {type: int, required: true}
          macb_tx_workaround:
            type: bool
            required: false
            default: false
          common_packages:
            type: list
            elements: str
            required: false
            default: []
            description:
              - Common operating system packages to install.
          minimum_packages:
            type: dict
            required: false
            description:
              - Installed package names and minimum acceptable package versions.
          distrusted_ca_sha256:
            type: list
            elements: str
            required: false
            description:
              - SHA-256 fingerprints that must be absent from the host TLS trust store.
          maintenance_recovery_timeout:
            type: int
            required: false
            default: 1800
            description:
              - Maximum seconds to wait for OS recovery and standalone maintenance validation.
              - Must be at least 600 seconds; preflight retains its 600-second timeout.
          package_replacements:
            type: dict
            required: false
            description:
              - Package removals allowed only when the named replacement is installed in the same transaction.
          ubuntu_archive_uri:
            type: str
            required: true
          ubuntu_suites:
            type: list
            elements: str
            required: true
          required_nfs_exports:
            type: list
            elements: dict
            required: false
            default: []
            options:
              server:
                type: str
                required: true
              share:
                type: str
                required: true
          apt_https_sources:
            type: list
            elements: dict
            required: false
            description:
              - Source files and exact URI replacements that enforce HTTPS transport.
            options:
              path:
                type: path
                required: true
              regexp:
                type: str
                required: true
              replace:
                type: str
                required: true
      node_identity:
        type: dict
        required: false
        options:
          hostname:
            type: str
            required: false
            description:
              - Desired hostname for the host when a host-specific override is defined.
