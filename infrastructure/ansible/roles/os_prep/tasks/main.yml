---
- name: Select the Ubuntu host policy
  ansible.builtin.include_tasks: profile.yml

- name: Manage the automation account sudo rule
  ansible.builtin.include_tasks: sudo.yml
  when: os_prep.manage_passwordless_sudo | default(false) | bool

- name: Enforce persistent NTP before package and cluster preparation
  ansible.builtin.include_tasks: time.yml

- name: Enforce bounded persistent host logging
  ansible.builtin.include_tasks: logging.yml

- name: Prepare Ubuntu stable sources and supervised maintenance policy
  ansible.builtin.include_tasks: ubuntu.yml

- name: Converge the inventory-managed APT source transport policy
  ansible.builtin.include_tasks: apt_sources.yml
  when: ansible_facts.pkg_mgr == 'apt'

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.pkg_mgr == "apt"

- name: Upgrade installed apt packages
  ansible.builtin.apt:
    upgrade: dist
  when: ansible_facts.pkg_mgr == "apt"
  notify: Reboot host

- name: Install common OS packages
  ansible.builtin.package:
    name: "{{ os_prep.common_packages }}"
    state: present
  when: os_prep.common_packages | length > 0

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ node_identity.hostname }}"
  when: node_identity.hostname is defined
