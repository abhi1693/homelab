---
- name: Select the Ubuntu host policy
  ansible.builtin.include_tasks: profile.yml

- name: Validate persistent network time synchronization
  ansible.builtin.include_tasks: time_validation.yml

- name: Validate bounded persistent host logging
  ansible.builtin.include_tasks: logging_validation.yml

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  when: os_prep.common_packages | length > 0

- name: Read current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: os_prep_validation_timezone
  changed_when: false

- name: Check if reboot is still required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: os_prep_reboot_required

- name: Assert configured hostname is applied
  ansible.builtin.assert:
    that:
      - ansible_facts.nodename == node_identity.hostname
    fail_msg: "Expected hostname {{ node_identity.hostname }}, got {{ ansible_facts.nodename }}"
    success_msg: "Hostname matches expected value {{ node_identity.hostname }}"
  when: node_identity.hostname is defined

- name: Assert configured timezone is applied
  ansible.builtin.assert:
    that:
      - os_prep_validation_timezone.stdout == os_prep.timezone
    fail_msg: "Expected timezone {{ os_prep.timezone }}, got {{ os_prep_validation_timezone.stdout }}"
    success_msg: "Timezone matches expected value {{ os_prep.timezone }}"

- name: Assert common OS packages are installed
  ansible.builtin.assert:
    that:
      - item in ansible_facts.packages
    fail_msg: "Expected package {{ item }} to be installed"
    success_msg: "Package {{ item }} is installed"
  loop: "{{ os_prep.common_packages }}"
  when: os_prep.common_packages | length > 0

- name: Assert no reboot is pending
  ansible.builtin.assert:
    that:
      - not os_prep_reboot_required.stat.exists
    fail_msg: "Host still reports a pending reboot"
    success_msg: "No pending reboot detected"

- name: Validate the inventory-managed host security baseline
  ansible.builtin.include_tasks: security_validation.yml

- name: Validate the inventory-managed APT source transport policy
  ansible.builtin.include_tasks: apt_sources_validation.yml
  when: ansible_facts.pkg_mgr == 'apt'

- name: Validate Ubuntu stable update sources and maintenance policy
  ansible.builtin.include_tasks: ubuntu_validation.yml

- name: Verify passwordless sudo as the unprivileged automation account
  ansible.builtin.command: sudo -n true
  become: false
  changed_when: false
  when: os_prep.manage_passwordless_sudo | default(false) | bool

- name: Verify configured NFS exports with disposable read-only mounts
  ansible.builtin.include_tasks: nfs_probe.yml
  loop: "{{ os_prep.required_nfs_exports | default([]) }}"
  loop_control:
    loop_var: os_prep_nfs_export
