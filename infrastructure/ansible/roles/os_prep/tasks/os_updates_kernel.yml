---
- name: Inspect Ubuntu installed kernel and selected vendor boot assets
  ansible.builtin.command:
    argv: [python3, '-', --allow-pending-boot]
    stdin: "{{ lookup('ansible.builtin.file', role_path + '/../rpi_prep/files/check_vendor_kernel.py') }}"
  register: os_prep_os_kernel_state
  changed_when: false
  check_mode: false
