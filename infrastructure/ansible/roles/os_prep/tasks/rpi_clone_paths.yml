---
- name: Discover local user home directories without following symlinks
  ansible.builtin.find:
    paths: /home
    file_type: directory
    recurse: false
    follow: false
    hidden: true
  register: os_prep_rpi_clone_homes

- name: Define prohibited Raspberry Pi cloning tool paths
  ansible.builtin.set_fact:
    os_prep_rpi_clone_paths: >-
      {{ ['/usr/local/sbin/rpi-clone', '/usr/local/sbin/rpi-clone-setup',
          '/usr/local/bin/rpi-clone', '/usr/local/bin/rpi-clone-setup',
          '/root/rpi-clone'] +
         (os_prep_rpi_clone_homes.files | map(attribute='path') |
          map('regex_replace', '$', '/rpi-clone') | list) }}
