---
apiVersion: home-lab.io/v1alpha1
kind: WorkloadCatalog
metadata:
  name: cilium
spec:
  displayName: Cilium
  purpose: Provide cluster networking, kube-proxy replacement, network policy enforcement, and Envoy-based service handling.
  owner: home-lab
  project: system
  cluster: home-k3s
  lifecycle: active
  criticality: critical
  dataClassification: restricted
  repository: https://github.com/abhi1693/home-lab
  gitPath: infrastructure/ansible/roles/cilium
  runbook: docs/runbooks/k3s-netbox-drift-reconciliation.md
  workloads:
    - {key: home-k3s/kube-system/apps/deployment/cilium-operator, namespace: kube-system, apiGroup: apps, kind: Deployment, name: cilium-operator, desiredReplicas: 2, sourcePath: infrastructure/ansible/roles/cilium/templates/values.yaml.j2}
    - {key: home-k3s/kube-system/apps/daemonset/cilium, namespace: kube-system, apiGroup: apps, kind: DaemonSet, name: cilium, sourcePath: infrastructure/ansible/roles/cilium/templates/values.yaml.j2}
    - {key: home-k3s/kube-system/apps/daemonset/cilium-envoy, namespace: kube-system, apiGroup: apps, kind: DaemonSet, name: cilium-envoy, sourcePath: infrastructure/ansible/roles/cilium/templates/values.yaml.j2}
