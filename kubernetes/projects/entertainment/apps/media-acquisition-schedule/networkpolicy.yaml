---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-acquisition-schedule
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: media-acquisition-schedule
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: jellyseerr
              app.kubernetes.io/name: seerr-chart
      ports:
        - {protocol: TCP, port: 5055}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-acquisition-schedule-apiserver
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: media-acquisition-schedule
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
