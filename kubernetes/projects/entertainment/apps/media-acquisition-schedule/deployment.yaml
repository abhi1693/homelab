---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-acquisition-schedule
  namespace: media
  labels:
    app.kubernetes.io/name: media-acquisition-schedule
    app.kubernetes.io/part-of: media-stack
    home-lab.io/project-slug: entertainment
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-acquisition-schedule
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-acquisition-schedule
        app.kubernetes.io/part-of: media-stack
        home-lab.io/project-slug: entertainment
    spec:
      serviceAccountName: media-acquisition-schedule
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: harbor-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # renovate: datasource=docker depName=python
          image: registry.home/docker.io/library/python:3.15.0-alpine3.23@sha256:de62099c4b9118cc85e553055fcc9f84764c165803d8d4cb0fb85c6c83b236cc
          imagePullPolicy: IfNotPresent
          command: [python, -B, /policy/controller.py, --config, /policy/config.json]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: JELLYSEERR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-episeerr
                  key: JELLYSEERR_API_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: &controller-health
                - sh
                - /policy/health.sh
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            exec:
              command: *controller-health
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: *controller-health
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 4
            initialDelaySeconds: 60
      volumes:
        - name: policy
          configMap:
            name: media-acquisition-schedule-code
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
