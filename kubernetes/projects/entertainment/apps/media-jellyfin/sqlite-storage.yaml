---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-sqlite-config
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-workers
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-sqlite-data
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-workers
  resources:
    requests:
      storage: 8Gi
