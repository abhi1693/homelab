---
TZ: Asia/Kolkata
chartContext:
  appUrl: http://watch.media.home
image:
  repository: registry.home/ghcr.io/abhi1693/home-lab-jellyfin
  # renovate: datasource=docker depName=ghcr.io/abhi1693/home-lab-jellyfin
  tag: 12.4-sqlite-1@sha256:a49d52d6b1e4bfe6463c1b9e2aa8297bffce08fdd3131ea62b04ef733dac8991
  pullPolicy: IfNotPresent
imagePullSecret:
  harbor-registry:
    enabled: true
    existingSecret: harbor-registry
global:
  fallbackDefaults:
    storageClass: longhorn
    pvcRetain: true
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
        - 0
        - 1000
      annotations:
        home-lab.io/config-seed-revision: '20260831'
      labels:
        home-lab.io/topology-group: heavy-media
      initContainers:
        jellyfin-enhanced-config:
          enabled: true
          type: init
          imageSelector: image
          resources:
            limits:
              cpu: 2500m
          command:
          - /bin/bash
          - -ec
          - "source_dir=/opt/jellyfin/plugin-secrets\ntarget_dir=/opt/jellyfin/plugin-overrides\n\
            \nmkdir -p \"$target_dir\"\npatched=0\n\nshopt -s nullglob\nfor source_file\
            \ in \\\n  \"$source_dir\"/Jellyfin.Plugin.JellyfinEnhanced.xml \\\n \
            \ \"$source_dir\"/*JellyfinEnhanced*.xml \\\n  \"$source_dir\"/*Enhanced*.xml;\
            \ do\n  target_file=\"$target_dir/$(basename \"$source_file\")\"\n  cp\
            \ \"$source_file\" \"$target_file\"\n\n  if [ \"$(xmlstarlet select -t\
            \ -v 'count(//*[local-name()=\"AutoSkipOutro\"])' \"$target_file\" 2>/dev/null\
            \ || echo 0)\" != \"0\" ]; then\n    xmlstarlet edit \\\n      --inplace\
            \ \\\n      -u '//*[local-name()=\"AutoSkipOutro\"]' \\\n      -v false\
            \ \\\n      \"$target_file\"\n    patched=1\n    echo \"Jellyfin Enhanced:\
            \ set AutoSkipOutro=false in $target_file\"\n  fi\ndone\n\nif [ \"$patched\"\
            \ -eq 0 ]; then\n  echo \"Jellyfin Enhanced: AutoSkipOutro was not found\
            \ in mounted plugin config\"\nfi\n"
        backup-before-upgrade:
          enabled: true
          type: init
          imageSelector: sqliteMigratorImage
          command:
          - python
          - /opt/upgrade/backup-before-upgrade.py
          env:
            PYTHONPATH: /app
            POD_NAME:
              fieldRef:
                fieldPath: metadata.name
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      containers:
        main:
          command:
          - /entrypoint.sh
          env:
            JELLYFIN_SERVER_ID: 6f2af3a6478c417ebf645566121042a1
            JELLYFIN_CONFIG_SOURCE_DIRS: /opt/jellyfin/config-secrets
            JELLYFIN_PLUGIN_CONFIG_SOURCE_DIRS: /opt/jellyfin/plugin-config:/opt/jellyfin/plugin-episeerr:/opt/jellyfin/plugin-secrets:/opt/jellyfin/plugin-overrides
            JELLYFIN_ENHANCED_AUTO_SKIP_OUTRO: 'false'
            JELLYFIN_SHARED_DATA_DIR: /shared-data
            JELLYFIN_SHARED_DATA_PATHS: metadata:data/collections:data/subtitles:data/livetv:data/playlists:data/imdb-ratings-cache:data/trickplay:root:Shokofin
            JELLYFIN_DISABLE_TRICKPLAY_AND_CHAPTER_IMAGES: 'true'
            JELLYFIN_REQUIRE_MIGRATION_RECEIPT: 'true'
          probes:
            liveness:
              enabled: true
              type: exec
              command:
              - /entrypoint.sh
              - healthcheck
              - liveness
              spec:
                initialDelaySeconds: 12
                periodSeconds: 15
                successThreshold: 1
                timeoutSeconds: 5
                failureThreshold: 5
            readiness:
              enabled: true
              type: exec
              command:
              - /bin/bash
              - -ec
              - curl -fsS --max-time 3 http://127.0.0.1:8096/System/Info/Public |
                jq -e '.StartupWizardCompleted == true' >/dev/null
              spec:
                initialDelaySeconds: 10
                periodSeconds: 12
                successThreshold: 2
                timeoutSeconds: 5
                failureThreshold: 4
            startup:
              enabled: true
              type: exec
              command:
              - /bin/bash
              - -ec
              - curl -fsS --max-time 3 http://127.0.0.1:8096/System/Info/Public |
                jq -e '.StartupWizardCompleted == true' >/dev/null
              spec:
                initialDelaySeconds: 5
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 3
                failureThreshold: 60
      serviceAccountName: jellyfin-sqlite-migrator
podOptions:
  defaultSpread: false
  defaultAffinity: false
  nodeSelector:
    kubernetes.io/arch: arm64
resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    cpu: 0
    memory: 4Gi
ingress:
  main:
    enabled: true
    ingressClassName: traefik
    hosts:
    - host: watch.media.home
      paths:
      - path: /
        pathType: Prefix
    tls: []
service:
  main:
    selectorLabels:
      pod.name: main
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/instance: jellyfin
  autodiscovery:
    selectorLabels:
      pod.name: main
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/instance: jellyfin
persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: jellyfin-sqlite-config
    mountPath: /config
    targetSelector:
      main:
        main:
          mountPath: /config
        backup-before-upgrade:
          mountPath: /config
          readOnly: true
  data:
    enabled: true
    type: pvc
    existingClaim: jellyfin-sqlite-data
    mountPath: /data
    targetSelector:
      main:
        main:
          mountPath: /data
        backup-before-upgrade:
          mountPath: /data
  config-seed:
    enabled: true
    type: secret
    objectName: media-jellyfin-config-seed
    expandObjectName: false
    mountPath: /opt/jellyfin/config-secrets
    readOnly: true
    items:
    - key: aspnet-data-protection-key.xml
      path: .aspnet/DataProtection-Keys/aspnet-data-protection-key.xml
    - key: encoding.xml
      path: encoding.xml
    - key: livetv.xml
      path: livetv.xml
    - key: logging.default.json
      path: logging.default.json
    - key: metadata.xml
      path: metadata.xml
    - key: network.xml
      path: network.xml
    - key: system.xml
      path: system.xml
  plugin-config-seed:
    enabled: true
    type: secret
    objectName: media-jellyfin-plugin-config-seed
    expandObjectName: false
    mountPath: /opt/jellyfin/plugin-secrets
    readOnly: true
    targetSelector:
      main:
        main:
          mountPath: /opt/jellyfin/plugin-secrets
          readOnly: true
        jellyfin-enhanced-config:
          mountPath: /opt/jellyfin/plugin-secrets
          readOnly: true
  plugin-config-overrides:
    enabled: true
    type: emptyDir
    mountPath: /opt/jellyfin/plugin-overrides
    targetSelector:
      main:
        main:
          mountPath: /opt/jellyfin/plugin-overrides
        jellyfin-enhanced-config:
          mountPath: /opt/jellyfin/plugin-overrides
  plugin-config-episeerr:
    enabled: true
    type: configmap
    objectName: media-jellyfin-episeerr-webhook
    expandObjectName: false
    mountPath: /opt/jellyfin/plugin-episeerr
    readOnly: true
  shared-data:
    enabled: true
    type: pvc
    existingClaim: jellyfin-shared-data-nfs
    mountPath: /shared-data
    targetSelector:
      main:
        main:
          mountPath: /shared-data
        backup-before-upgrade:
          mountPath: /shared-data
          readOnly: true
  media:
    enabled: true
    type: pvc
    existingClaim: media-library-unas
    mountPath: /media
  transcode:
    enabled: false
  upgrade-backup-script:
    enabled: true
    type: configmap
    objectName: jellyfin-upgrade-backup
    expandObjectName: false
    mountPath: /opt/upgrade
    readOnly: true
    targetSelector:
      main:
        backup-before-upgrade:
          mountPath: /opt/upgrade
          readOnly: true
podDisruptionBudget:
  main:
    enabled: true
    targetSelector: main
    minAvailable: 1
autodiscovery:
  enabled: false
networkPolicy:
  ingress:
    enabled: true
    policyType: ingress
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
      - podSelector:
          matchLabels:
            app.kubernetes.io/instance: jellyseerr
            app.kubernetes.io/name: seerr-chart
      - podSelector:
          matchLabels:
            app.kubernetes.io/instance: sonarr
            app.kubernetes.io/name: sonarr
      - podSelector:
          matchLabels:
            app.kubernetes.io/instance: radarr
            app.kubernetes.io/name: radarr
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: ryokan
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: media
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: qbittorrent-smart-queues
            app.kubernetes.io/name: qbittorrent-smart-queues
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: episeerr
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: home-assistant
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: home-assistant
            app.kubernetes.io/name: home-assistant
      ports:
      - protocol: TCP
        port: 8096
  egress:
    enabled: true
    policyType: egress
    egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    - to:
      - ipBlock:
          cidr: 10.43.0.1/32
      ports:
      - protocol: TCP
        port: 443
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: shoko
      ports:
      - protocol: TCP
        port: 8111
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/instance: jellyseerr
            app.kubernetes.io/name: seerr-chart
      ports:
      - protocol: TCP
        port: 5055
      - protocol: TCP
        port: 10241
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/instance: radarr
            app.kubernetes.io/name: radarr
      ports:
      - protocol: TCP
        port: 7878
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/instance: sonarr
            app.kubernetes.io/name: sonarr
      ports:
      - protocol: TCP
        port: 8989
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: episeerr
      ports:
      - protocol: TCP
        port: 5002
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
          - 10.42.0.0/16
          - 10.43.0.0/16
sqliteMigratorImage:
  repository: registry.home/ghcr.io/abhi1693/home-lab-jellyfin-sqlite-migrator
  # renovate: datasource=docker depName=ghcr.io/abhi1693/home-lab-jellyfin-sqlite-migrator
  tag: 10.11.8-1@sha256:d218716f8cf0d27d6c9e31b98aea9ff7f6ca7cef516c2771f9bd39e49ecfb0b8
  pullPolicy: IfNotPresent
