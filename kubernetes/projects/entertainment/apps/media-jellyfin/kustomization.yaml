---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: jellyfin-values
  files:
  - values.yaml
- name: jellyfin-sqlite-entrypoint
  files:
  - sqlite-entrypoint.sh
  namespace: media
- name: jellyfin-sqlite-entrypoint
  namespace: fleet-local
  files:
  - sqlite-entrypoint.sh
- name: jellyfin-upgrade-backup
  namespace: media
  files:
  - backup-before-upgrade.py
  options:
    disableNameSuffixHash: true
- name: jellyfin-sqlite-backup
  namespace: media
  files:
  - backup-sqlite.py
  options:
    disableNameSuffixHash: true
generatorOptions:
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: media-stack
    home-lab.io/project-slug: entertainment
configurations:
- kustomizeconfig.yaml
resources:
- secrets.sops.yaml
- apiserver-egress-cnp.yaml
- episeerr-webhook-config.yaml
- helmop.yaml
- shared-pvc.yaml
- migration-snapshot.sops.yaml
- sqlite-storage.yaml
- sqlite-validation.yaml
- sqlite-backups.yaml
