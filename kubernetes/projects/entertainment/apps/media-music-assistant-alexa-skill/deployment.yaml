---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant-alexa-skill
  namespace: media
  labels:
    app.kubernetes.io/name: music-assistant-alexa-skill
    app.kubernetes.io/component: alexa-bridge
    app.kubernetes.io/part-of: media-stack
    home-lab.io/project-slug: entertainment
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: music-assistant-alexa-skill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-assistant-alexa-skill
        app.kubernetes.io/component: alexa-bridge
        app.kubernetes.io/part-of: media-stack
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alexa-skill
          # renovate: datasource=docker depName=ghcr.io/abhi1693/music-assistant-skill
          image: registry.home/ghcr.io/abhi1693/music-assistant-skill:0.0.46-beta@sha256:fc9a24d28368acc7d308fb9feae973cd04d0deb95a8f4f5fd60b8cd7cf052170
          imagePullPolicy: IfNotPresent
          env:
            - name: SKILL_HOSTNAME
              value: alexa.abhimanyu-saharan.com
            - name: MA_HOSTNAME
              value: music-stream.abhimanyu-saharan.com
            - name: PORT
              value: "5000"
            - name: LOCALE
              value: en-IN
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: TZ
              value: Asia/Kolkata
            - name: ASK_CREDENTIALS_DIR
              value: /data/.ask
            - name: HOME
              value: /data
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: APP_USERNAME
              value: /run/secrets/APP_USERNAME
            - name: APP_PASSWORD
              value: /run/secrets/APP_PASSWORD
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: build
              mountPath: /app/build
            - name: app-tmp
              mountPath: /app/tmp
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-alexa-skill-data
        - name: build
          emptyDir:
            sizeLimit: 64Mi
        - name: app-tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: secrets
          secret:
            secretName: music-assistant-alexa-skill-secrets
