---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: episeerr
  namespace: media
  labels:
    app.kubernetes.io/name: episeerr
    app.kubernetes.io/part-of: media-stack
spec:
  ingressClassName: traefik
  rules:
    - host: episodes.media.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: episeerr
                port:
                  name: http
