apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoko
  namespace: media
  labels:
    app.kubernetes.io/name: shoko
    app.kubernetes.io/part-of: media-stack
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shoko
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shoko
        app.kubernetes.io/part-of: media-stack
        home-lab.io/topology-group: heavy-media
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              home-lab.io/topology-group: heavy-media
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure-import-exclusions
          # renovate: datasource=docker depName=docker.io/library/python
          image: registry.home/docker.io/library/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import json
              import os
              from pathlib import Path

              settings_path = Path(
                  "/config/Shoko.CLI/settings-server.json"
              )
              exclusion = r"[\\/]\.recycle[\\/]"

              settings_path.parent.mkdir(parents=True, exist_ok=True)
              if settings_path.exists():
                  with settings_path.open(encoding="utf-8") as settings_file:
                      settings = json.load(settings_file)
              else:
                  settings = {}

              import_settings = settings.setdefault("Import", {})
              exclusions = import_settings.setdefault("Exclude", [])
              if not isinstance(exclusions, list):
                  raise TypeError("Import.Exclude must be a list")

              if exclusion in exclusions:
                  print("Shoko import exclusion is already configured")
                  raise SystemExit(0)

              exclusions.append(exclusion)
              temporary_path = settings_path.with_suffix(".json.tmp")
              with temporary_path.open("w", encoding="utf-8") as settings_file:
                  json.dump(settings, settings_file, indent=2)
                  settings_file.write("\n")
              os.replace(temporary_path, settings_path)
              print("Configured Shoko import exclusion")
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 100
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: shoko
          # renovate: datasource=github-releases depName=ShokoAnime/ShokoServer
          image: registry.home/ghcr.io/shokoanime/server:v5.3.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: shoko
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shoko-github
                  key: GITHUB_TOKEN
          ports:
            - name: http
              containerPort: 8111
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 768Mi
            limits:
              memory: 3Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /home/shoko/.shoko
            - name: anime
              mountPath: /mnt/anime
              subPath: anime
              readOnly: true
            - name: anime
              mountPath: /media/anime
              subPath: anime
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shoko-config
        - name: anime
          persistentVolumeClaim:
            claimName: media-library-unas
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: tmp
          emptyDir: {}
