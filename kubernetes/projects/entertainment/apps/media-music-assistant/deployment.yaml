---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  namespace: media
  labels:
    app.kubernetes.io/name: music-assistant
    app.kubernetes.io/part-of: media-stack
    home-lab.io/project-slug: entertainment
spec:
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: music-assistant
  template:
    metadata:
      annotations:
        home-lab.io/ytmusic-catalog-revision: "2026-07-28-1"
        home-lab.io/hf-token-revision: "2026-07-25-2"
        home-lab.io/ytmusic-cookie-revision: "2026-07-25-1"
      labels:
        app.kubernetes.io/name: music-assistant
        app.kubernetes.io/part-of: media-stack
        home-lab.io/topology-group: heavy-media
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: k8s-rpi4
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        supplementalGroups:
          - 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-provider-runtime
          # renovate: datasource=docker depName=ghcr.io/music-assistant/server
          image: registry.home/ghcr.io/music-assistant/server:2.10.0b7@sha256:11c4c2a66f4108bda0584ecafbbd64a6fa4a8ac566d24b571930ec3f035248d3
          imagePullPolicy: IfNotPresent
          env:
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: UV_LINK_MODE
              value: copy
            - name: YTMUSIC_COOKIE
              valueFrom:
                secretKeyRef:
                  name: music-assistant-secrets
                  key: YTMUSIC_COOKIE
            - name: YTMUSIC_CATALOG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: music-assistant-postgresql
                  key: username
            - name: YTMUSIC_CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-assistant-postgresql
                  key: password
            - name: ALEXA_API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: music-assistant-alexa-skill-secrets
                  key: APP_USERNAME
            - name: ALEXA_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-assistant-alexa-skill-secrets
                  key: APP_PASSWORD
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              runtime=/data/provider-venv
              source_python=$(
                /app/venv/bin/python -c \
                  'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")'
              )
              source_version=$(
                /app/venv/bin/python -c \
                  'from importlib.metadata import version; print(version("music-assistant"))'
              )
              managed_runtime_revision=3
              source_runtime="$source_python:$source_version:$managed_runtime_revision"
              runtime_fingerprint=$(
                cat "$runtime/.base-runtime" 2>/dev/null || true
              )

              if [ "$runtime_fingerprint" != "$source_runtime" ]; then
                /app/venv/bin/uv venv \
                  --clear \
                  --force \
                  --python /app/venv/bin/python \
                  "$runtime"
                printf '%s\n' "$source_runtime" > "$runtime/.base-runtime"
              fi

              if ! "$runtime/bin/python" -c \
                'from importlib.metadata import version; import asyncpg, yt_dlp, ytmusicapi; assert version("asyncpg") == "0.31.0"; assert version("yt-dlp") == "2026.7.4"; assert version("ytmusicapi") == "1.12.1"' \
                2>/dev/null
              then
                VIRTUAL_ENV="$runtime" /app/venv/bin/uv pip install \
                  --python "$runtime/bin/python" \
                  --no-cache \
                  --find-links https://wheels.home-assistant.io/musllinux/ \
                  "asyncpg==0.31.0" \
                  "yt-dlp[default]==2026.7.4" \
                  "ytmusicapi==1.12.1"
              fi

              YTMUSIC_PROVIDER_DIR="/data/custom-providers/ytmusic" \
                /app/venv/bin/python - <<'PY'
              import hashlib
              import os
              import shutil
              import urllib.request
              from pathlib import Path

              revision = "fcd8f6aae01d66fe5e8671f2ea50f1d58eb3ab77"
              expected_hashes = {
                  "__init__.py": (
                      "7c234bc3879191d43c8d3396ed6d2f13905f592bb5ebd93890ec7630d0d88646"
                  ),
                  "catalog.py": (
                      "2b9982e1faae6668841d8da7a7122eecb9ac702493d5aff208d8e63e47a84929"
                  ),
                  "manifest.json": (
                      "92f43eb07ea0bec8c5c05a4f0b3ccf3acbd56bc6503ba84cfc3aa99793fb2ef4"
                  ),
              }
              provider_dir = Path(os.environ["YTMUSIC_PROVIDER_DIR"])
              renamed_provider_dir = (
                  Path("/data/provider-patches")
                  / ("ytmusic" + "_" + "free")
              )

              def digest(value: bytes) -> str:
                  return hashlib.sha256(value).hexdigest()

              def installed_provider_is_current() -> bool:
                  for filename, expected_hash in expected_hashes.items():
                      path = provider_dir / filename
                      if not path.is_file() or digest(path.read_bytes()) != expected_hash:
                          return False
                  return True

              if installed_provider_is_current():
                  if renamed_provider_dir.exists():
                      shutil.rmtree(renamed_provider_dir)
                  raise SystemExit

              base_url = (
                  "https://raw.githubusercontent.com/"
                  f"abhi1693/music-assistant-yt-music/{revision}/ytmusic"
              )
              provider_files: dict[str, bytes] = {}
              for filename, expected_hash in expected_hashes.items():
                  request = urllib.request.Request(
                      f"{base_url}/{filename}",
                      headers={"User-Agent": "home-lab-music-assistant-bootstrap/1"},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read()
                  actual_hash = digest(content)
                  if actual_hash != expected_hash:
                      raise RuntimeError(
                          f"Hash mismatch for upstream {filename}: {actual_hash}"
                      )
                  provider_files[filename] = content

              provider_dir.mkdir(parents=True, exist_ok=True)
              for filename, content in provider_files.items():
                  destination = provider_dir / filename
                  temporary_path = destination.with_suffix(
                      destination.suffix + ".tmp"
                  )
                  temporary_path.write_bytes(content)
                  temporary_path.chmod(0o444)
                  temporary_path.replace(destination)
              if renamed_provider_dir.exists():
                  shutil.rmtree(renamed_provider_dir)
              PY

              "$runtime/bin/python" - <<'PY'
              import asyncio
              import json
              import os
              from pathlib import Path

              import asyncpg

              settings_path = Path(
                  os.environ.get("MASS_SETTINGS_PATH", "/data/settings.json")
              )
              legacy_domain = "ytmusic" + "_" + "free"
              legacy_instance_id = f"{legacy_domain}--home"
              instance_id = "ytmusic--home"
              catalog_tables = (
                  "ytmusic_cache_entries",
                  "ytmusic_cache_attempts",
                  "ytmusic_account_objects",
                  "ytmusic_account_relations",
                  "ytmusic_account_sync_runs",
                  "ytmusic_cache_controls",
              )

              if not settings_path.exists():
                  raise SystemExit
              settings = json.loads(settings_path.read_text(encoding="utf-8"))
              if legacy_instance_id not in settings.get("providers", {}):
                  raise SystemExit

              async def migrate_catalog_identity() -> None:
                  connection = await asyncpg.connect(
                      host="postgresql-rw.postgresql.svc.cluster.local",
                      port=5432,
                      database="music_assistant",
                      user=os.environ["YTMUSIC_CATALOG_USERNAME"],
                      password=os.environ["YTMUSIC_CATALOG_PASSWORD"],
                      command_timeout=15,
                      server_settings={
                          "application_name": "music-assistant-ytmusic-rename"
                      },
                  )
                  try:
                      async with connection.transaction():
                          for table in catalog_tables:
                              exists = await connection.fetchval(
                                  "SELECT to_regclass($1)",
                                  f"public.{table}",
                              )
                              if exists is None:
                                  continue
                              counts = await connection.fetchrow(
                                  f"""
                                  SELECT
                                      count(*) FILTER (
                                          WHERE provider_instance_id = $1
                                      ) AS legacy_count,
                                      count(*) FILTER (
                                          WHERE provider_instance_id = $2
                                      ) AS current_count
                                  FROM {table}
                                  """,
                                  legacy_instance_id,
                                  instance_id,
                              )
                              legacy_count = int(counts["legacy_count"])
                              current_count = int(counts["current_count"])
                              if legacy_count and current_count:
                                  raise RuntimeError(
                                      "YouTube Music catalog contains both renamed "
                                      f"identities in {table}; refusing to merge"
                                  )
                              if legacy_count:
                                  await connection.execute(
                                      f"""
                                      UPDATE {table}
                                      SET provider_instance_id = $1
                                      WHERE provider_instance_id = $2
                                      """,
                                      instance_id,
                                      legacy_instance_id,
                                  )
                  finally:
                      await connection.close()

              asyncio.run(migrate_catalog_identity())
              PY

              ALEXA_PROVIDER_SOURCE="/app/venv/lib/python${source_python}/site-packages/music_assistant/providers/alexa/__init__.py" \
              ALEXA_PROVIDER_PATCH="/data/provider-patches/alexa/__init__.py" \
                /app/venv/bin/python - <<'PY'
              import os
              from pathlib import Path

              source_path = Path(os.environ["ALEXA_PROVIDER_SOURCE"])
              patch_path = Path(os.environ["ALEXA_PROVIDER_PATCH"])
              source = source_path.read_text(encoding="utf-8")
              replacements = {
                  """    "play_audio_en-CA": "ask music assistant to play audio",
                  "play_audio_en-US": "ask music assistant to play audio",""": (
                      """    "play_audio_en-CA": "ask music assistant to play audio",
                  "play_audio_en-IN": "ask music assistant to play audio",
                  "play_audio_en-US": "ask music assistant to play audio","""
                  ),
                  """                ConfigValueOption("en-US"),
                              ConfigValueOption("en-CA"),""": (
                      """                ConfigValueOption("en-US"),
                              ConfigValueOption("en-CA"),
                              ConfigValueOption("en-IN"),"""
                  ),
                  '            post_path = "/alexa/auth/proxy/ap/signin/*"': (
                      '            auth_path = "/alexa/auth/proxy/ap/*"'
                  ),
                  """            # Register GET for the base proxy path
                          mass.webserver.register_dynamic_route(proxy_path, proxy_handler, "GET")
                          # Register POST for the specific signin helper path
                          mass.webserver.register_dynamic_route(post_path, proxy_handler, "POST")""": (
                      """            # Register the base page and Amazon auth sub-flow routes
                          mass.webserver.register_dynamic_route(proxy_path, proxy_handler, "GET")
                          mass.webserver.register_dynamic_route(auth_path, proxy_handler, "GET")
                          mass.webserver.register_dynamic_route(auth_path, proxy_handler, "POST")"""
                  ),
                  """                mass.webserver.unregister_dynamic_route(proxy_path, "GET")
                              mass.webserver.unregister_dynamic_route(post_path, "POST")""": (
                      """                mass.webserver.unregister_dynamic_route(proxy_path, "GET")
                              mass.webserver.unregister_dynamic_route(auth_path, "GET")
                              mass.webserver.unregister_dynamic_route(auth_path, "POST")"""
                  ),
                  """                    # Notify the callback URL
                                  async with aiohttp.ClientSession() as session:
                                      await session.get(auth_helper.callback_url)
                                      _LOGGER.info("Alexa Callback URL: %s", auth_helper.callback_url)""": (
                      """                    # Notify the helper through the plaintext loopback listener.
                                  # The browser-facing callback stays on the configured HTTPS origin,
                                  # whose private CA is intentionally not trusted inside this container.
                                  callback_url = auth_helper.callback_url
                                  callback_path = callback_url.removeprefix(base_url)
                                  local_callback_url = (
                                      f"http://127.0.0.1:{mass.webserver.publish_port}"
                                      f"{callback_path}"
                                  )
                                  async with aiohttp.ClientSession() as session:
                                      callback_response = await session.get(local_callback_url)
                                      callback_response.raise_for_status()
                                      _LOGGER.info("Alexa Callback URL: %s", callback_url)"""
                  ),
              }

              for original, replacement in replacements.items():
                  if source.count(original) != 1:
                      raise RuntimeError(
                          "Alexa provider auth routes changed; review the overlay"
                      )
                  source = source.replace(original, replacement)

              liveness_replacements = {
                  """from alexapy import AlexaAPI, AlexaLogin, AlexaProxy
              """: """from alexapy import AlexaAPI, AlexaLogin, AlexaProxy
              from alexapy.helpers import get_json_value
              """,
                  """    PlaybackState,
                  PlayerFeature,
                  ProviderFeature,
              """: """    PlaybackState,
                  PlayerFeature,
                  ProviderFeature,
              """,
                  """class AlexaDevice:
                  \"\"\"Representation of an Alexa Device.\"\"\"

                  _device_type: str
                  device_serial_number: str
                  _device_family: str
                  _cluster_members: str
                  _locale: str
              """: """class AlexaDevice:
                  \"\"\"Representation of an Alexa Device.\"\"\"

                  _device_type: str
                  device_serial_number: str
                  _device_family: str
                  _cluster_members: str
                  _locale: str
                  _name: str
                  _online: bool
                  _volume_level: int | None
              """,
                  """        self._attr_supported_features = {
                          PlayerFeature.PLAY_MEDIA,
                          PlayerFeature.VOLUME_SET,
                          PlayerFeature.PAUSE,
                      }
                      self._attr_name = player_id
                      self._attr_device_info = DeviceInfo()
              """: """        self._attr_supported_features = {
                          PlayerFeature.PLAY_MEDIA,
                          PlayerFeature.VOLUME_SET,
                          PlayerFeature.PAUSE,
                      }
                      self._attr_name = device._name
                      self._attr_device_info = DeviceInfo()
              """,
                  """        self._attr_device_info = DeviceInfo()
                      self._attr_powered = False
                      self._attr_available = True
              """: """        self._attr_device_info = DeviceInfo()
                      self._attr_powered = False
                      self._attr_available = device._online
                      self._attr_needs_poll = True
                      self._attr_poll_interval = 15
                      if device._volume_level is not None:
                          self._attr_volume_level = device._volume_level
              """,
                  """    @property
                  def api(self) -> AlexaAPI:
                      \"\"\"Get the AlexaAPI instance for this player.\"\"\"
                      provider = cast("AlexaProvider", self.provider)
                      return AlexaAPI(self.device, provider.login)

                  async def stop(self) -> None:
              """: """    @property
                  def api(self) -> AlexaAPI:
                      \"\"\"Get the AlexaAPI instance for this player.\"\"\"
                      provider = cast("AlexaProvider", self.provider)
                      return AlexaAPI(self.device, provider.login)

                  def set_available(self, available: bool) -> bool:
                      \"\"\"Apply Amazon's current device availability.\"\"\"
                      self.device._online = available
                      if self._attr_available == available:
                          return False
                      self._attr_available = available
                      if not available:
                          self._attr_powered = False
                          self._attr_playback_state = PlaybackState.IDLE
                          self._attr_current_media = None
                          self._attr_elapsed_time = 0
                          self._attr_elapsed_time_last_updated = None
                          self._last_stream_url = None
                          self._last_command_id = None
                          self._last_meta_checksum = None
                      self.update_state()
                      return True

                  def set_volume_level(self, volume_level: int | None) -> bool:
                      \"\"\"Apply Amazon's current device volume when reported.\"\"\"
                      if volume_level is None or not 0 <= volume_level <= 100:
                          return False
                      if self._attr_volume_level == volume_level:
                          return False
                      self._attr_volume_level = volume_level
                      self.update_state()
                      return True

                  async def poll(self) -> None:
                      \"\"\"Refresh Alexa device availability and volume from Amazon.\"\"\"
                      provider = cast("AlexaProvider", self.provider)
                      await provider.refresh_device_availability()

                  async def stop(self) -> None:
              """,
                  """        self.devices = {}
                      self._intents: list[dict[str, Any]] | None = None
                      self._invocation_name: str | None = None
              """: """        self.devices = {}
                      self._intents: list[dict[str, Any]] | None = None
                      self._invocation_name: str | None = None
                      self._availability_lock = asyncio.Lock()
                      self._playback_command_lock = asyncio.Lock()
                      self._availability_last_refresh = 0.0
              """,
                  """        if devices is None:
                          return

                      alexa_locale = str(self.config.get_value(CONF_ALEXA_LANGUAGE, "en-US"))
              """: """        if devices is None:
                          return
                      volumes = await self._get_device_volumes()
                      self._availability_last_refresh = self.mass.loop.time()
                      online_by_serial = {
                          str(device["serialNumber"]): bool(
                              device.get("online", False)
                          )
                          for device in devices
                          if device.get("serialNumber")
                      }

                      alexa_locale = str(self.config.get_value(CONF_ALEXA_LANGUAGE, "en-US"))
              """,
                  """                dev_name = device["accountName"]
                              player_id = dev_name
              """: """                dev_name = str(device["accountName"])
                              player_id = str(device["serialNumber"])
              """,
                  """                device_object._device_family = device["deviceOwnerCustomerId"]
              """: """                device_object._device_family = str(
                                  device.get("deviceFamily", "")
                              )
              """,
                  """                device_object._cluster_members = device["clusterMembers"]
                              device_object._locale = alexa_locale
                              self.devices[player_id] = device_object
              """: """                if device_object._device_family == "WHA":
                                  continue
                              device_object._cluster_members = device["clusterMembers"]
                              device_object._locale = alexa_locale
                              device_object._name = dev_name
                              device_object._online = online_by_serial.get(
                                  player_id,
                                  False,
                              )
                              device_object._volume_level = volumes.get(player_id)
                              self.devices[player_id] = device_object
              """,
                  """        await self._load_intents()

                  @lock
                  async def _load_intents(self) -> None:
              """: """        await self._load_intents()

                  async def _get_device_volumes(self) -> dict[str, int]:
                      \"\"\"Return Amazon's current volume for every reported device.\"\"\"
                      response = await AlexaAPI._static_request(
                          "get",
                          self.login,
                          "/api/devices/deviceType/dsn/audio/v1/allDeviceVolumes",
                      )
                      volume_items, valid = await get_json_value(
                          response,
                          "volumes",
                          list,
                      )
                      if not valid:
                          return {}
                      volumes: dict[str, int] = {}
                      for item in volume_items:
                          if not isinstance(item, dict):
                              continue
                          serial = item.get("dsn")
                          volume_level = item.get("speakerVolume")
                          if (
                              isinstance(serial, str)
                              and isinstance(volume_level, int)
                              and not isinstance(volume_level, bool)
                              and 0 <= volume_level <= 100
                          ):
                              volumes[serial] = volume_level
                      return volumes

                  async def refresh_device_availability(self) -> None:
                      \"\"\"Refresh all Alexa players from coalesced account calls.\"\"\"
                      now = self.mass.loop.time()
                      if now - self._availability_last_refresh < 12:
                          return
                      async with self._availability_lock:
                          now = self.mass.loop.time()
                          if now - self._availability_last_refresh < 12:
                              return
                          self._availability_last_refresh = now
                          devices = await AlexaAPI.get_devices(self.login)
                          if devices is None:
                              return
                          volumes = await self._get_device_volumes()
                          online_by_serial = {
                              str(device["serialNumber"]): bool(
                                  device.get("online", False)
                              )
                              for device in devices
                              if device.get("serialNumber")
                          }
                          for player_id, device in self.devices.items():
                              if device._device_family == "WHA":
                                  continue
                              is_online = online_by_serial.get(
                                  device.device_serial_number,
                                  False,
                              )
                              volume_level = volumes.get(
                                  device.device_serial_number
                              )
                              device._online = is_online
                              player = self.mass.players.get_player(player_id)
                              if not isinstance(player, AlexaPlayer):
                                  continue
                              if player.set_available(is_online):
                                  self.logger.info(
                                      "Alexa device %s is now %s",
                                      player_id,
                                      "online" if is_online else "offline",
                                  )
                              player.set_volume_level(volume_level)

                  @lock
                  async def _load_intents(self) -> None:
              """,
              }

              for original, replacement in liveness_replacements.items():
                  if source.count(original) != 1:
                      raise RuntimeError(
                          "Alexa provider liveness hooks changed; review the overlay"
                      )
                  source = source.replace(original, replacement)

              playback_replacements = {
                  """    async def play(self) -> None:
                      \"\"\"Handle PLAY command on the player.\"\"\"
                      provider = cast("AlexaProvider", self.provider)

                      utter = await provider.get_intent_utterance("AMAZON.ResumeIntent", "resume")
                      await self.api.run_custom(utter)

                      self._attr_playback_state = PlaybackState.PLAYING
                      self.update_state()
              """: """    async def play(self) -> None:
                      \"\"\"Resume only a correlated Alexa stream.\"\"\"
                      provider = cast("AlexaProvider", self.provider)
                      if (
                          self._last_stream_url is None
                          or self._last_command_id is None
                      ):
                          self._attr_playback_state = PlaybackState.IDLE
                          self._attr_current_media = None
                          self.update_state()
                          raise ActionUnavailable(
                              "Alexa has no active stream to resume"
                          )

                      command_id = self._last_command_id
                      try:
                          await api_request(
                              self.provider,
                              "/ma/playback-event",
                              method="POST",
                              json_data={
                                  "commandId": command_id,
                                  "eventType": (
                                      "MusicAssistant.ResumeRequested"
                                  ),
                              },
                              timeout=5,
                          )
                      except ActionUnavailable as err:
                          if "Status code: 404" in str(err):
                              self._last_stream_url = None
                              self._last_command_id = None
                              self._last_meta_checksum = None
                              self._attr_playback_state = PlaybackState.IDLE
                              self._attr_current_media = None
                              self.update_state()
                          raise

                      utter = await provider.get_intent_utterance(
                          "AMAZON.ResumeIntent",
                          "resume",
                      )
                      try:
                          await self.api.run_custom(utter)
                          await self._wait_for_playback_started(command_id)
                      except ActionUnavailable as err:
                          try:
                              await api_request(
                                  self.provider,
                                  "/ma/playback-event",
                                  method="POST",
                                  json_data={
                                      "commandId": command_id,
                                      "eventType": (
                                          "MusicAssistant.ResumeFailed"
                                      ),
                                      "error": str(err),
                                  },
                                  timeout=5,
                              )
                          except Exception as callback_error:
                              _LOGGER.warning(
                                  "Could not mark Alexa resume %s failed: %s",
                                  command_id,
                                  callback_error,
                              )
                          self._attr_playback_state = PlaybackState.PAUSED
                          self.update_state()
                          raise

                      self._attr_playback_state = PlaybackState.PLAYING
                      self.update_state()
              """,
                  """    async def play_media(self, media: PlayerMedia) -> None:
                      \"\"\"Handle PLAY MEDIA on the player.\"\"\"
                      stream_url = await self.provider.mass.streams.resolve_stream_url(self.player_id, media)
              """: """    async def play_media(self, media: PlayerMedia) -> None:
                      \"\"\"Handle PLAY MEDIA on the player without cross-device claims.\"\"\"
                      provider = cast("AlexaProvider", self.provider)
                      async with provider._playback_command_lock:
                          await self._play_media_locked(media)

                  async def _play_media_locked(self, media: PlayerMedia) -> None:
                      \"\"\"Push and invoke one serialized Alexa playback command.\"\"\"
                      stream_url = await self.provider.mass.streams.resolve_stream_url(self.player_id, media)
              """,
                  """        # Keep last stream url pushed (set in play_media)
                      self._last_stream_url: str | None = None
              """: """        # Keep the active bridge command for metadata and callbacks.
                      self._last_stream_url: str | None = None
                      self._last_command_id: str | None = None
