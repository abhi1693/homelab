---
apiVersion: home-lab.io/v1alpha1
kind: WorkloadCatalog
metadata:
  name: music-assistant
spec:
  displayName: Music Assistant
  purpose: Provide household music discovery, playback, authenticated account mirroring, radio, and persistent media caching.
  owner: home-lab
  project: entertainment
  cluster: home-k3s
  lifecycle: active
  criticality: high
  dataClassification: restricted
  repository: https://github.com/abhi1693/home-lab
  gitPath: kubernetes/projects/entertainment/apps/media-music-assistant
  workloads:
    - {key: home-k3s/media/apps/deployment/music-assistant, namespace: media, apiGroup: apps, kind: Deployment, name: music-assistant, desiredReplicas: 1, sourcePath: kubernetes/projects/entertainment/apps/media-music-assistant/deployment.yaml}
