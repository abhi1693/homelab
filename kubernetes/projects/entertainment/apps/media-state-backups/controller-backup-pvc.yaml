---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-smart-queues-backup-nfs
  namespace: media
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: qbittorrent-smart-queues-backup-nfs
    app.kubernetes.io/part-of: media-stack
    home-lab.io/project-slug: entertainment
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-shared-retain
  resources:
    requests:
      storage: 1Gi
