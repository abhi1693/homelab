---
apiVersion: batch/v1
kind: Job
metadata:
  name: media-state-backups-storage-validation
  namespace: media
  labels:
    app.kubernetes.io/name: media-state-backups-validation
    app.kubernetes.io/part-of: media-stack
    home-lab.io/project-slug: entertainment
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '10'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-state-backups-validation
        app.kubernetes.io/part-of: media-stack
        home-lab.io/project-slug: entertainment
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validate-controller
          # renovate: datasource=docker depName=cgr.dev/chainguard/python
          image: cgr.dev/chainguard/python:latest@sha256:93c92d4ee2d0a4e540ec4de4e708267b45c2551a3c836fdf3e174a05017a76de
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/python
            - -B
            - /backup-helper/backup_state.py
          args:
            - --validate-destination
            - --app
            - controller
            - --destination
            - /backups
            - --pod-uid
            - $(POD_UID)
            - --timeout
            - '120'
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: helper
              mountPath: /backup-helper
              readOnly: true
            - name: controller-destination
              mountPath: /backups
          terminationMessagePolicy: File
        - name: validate-ryokan
          # renovate: datasource=docker depName=cgr.dev/chainguard/python
          image: cgr.dev/chainguard/python:latest@sha256:93c92d4ee2d0a4e540ec4de4e708267b45c2551a3c836fdf3e174a05017a76de
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/python
            - -B
            - /backup-helper/backup_state.py
          args:
            - --validate-destination
            - --app
            - ryokan
            - --destination
            - /backups
            - --pod-uid
            - $(POD_UID)
            - --timeout
            - '120'
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: helper
              mountPath: /backup-helper
              readOnly: true
            - name: ryokan-destination
              mountPath: /backups
          terminationMessagePolicy: File
      volumes:
        - name: helper
          configMap:
            name: media-prestart-backup-c24c14a3317c
            defaultMode: 292
        - name: controller-destination
          persistentVolumeClaim:
            claimName: qbittorrent-smart-queues-backup-nfs
        - name: ryokan-destination
          persistentVolumeClaim:
            claimName: ryokan-prestart-backup-nfs
