apiVersion: apps/v1
kind: Deployment
metadata:
  name: ryokan
  namespace: media
  labels:
    app.kubernetes.io/name: ryokan
    app.kubernetes.io/part-of: media-stack
    home-lab.io/project-slug: entertainment
spec:
  progressDeadlineSeconds: 2400
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ryokan
  template:
    metadata:
      annotations:
        home-lab.io/qbittorrent-credential-revision: "2026-08-11T00:30:00Z"
        home-lab.io/ryokan-indexer-revision: "2026-08-31T00:00:22+05:30"
      labels:
        app.kubernetes.io/name: ryokan
        app.kubernetes.io/part-of: media-stack
        home-lab.io/topology-group: heavy-media
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              home-lab.io/topology-group: heavy-media
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: backup-state-before-start
          # renovate: datasource=docker depName=cgr.dev/chainguard/python
          image: cgr.dev/chainguard/python:latest@sha256:93c92d4ee2d0a4e540ec4de4e708267b45c2551a3c836fdf3e174a05017a76de
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/python
            - /backup-helper/backup_state.py
          args:
            - --app
            - ryokan
            - --source
            - /source
            - --destination
            - /backups
            - --work
            - /work
            - --pod-uid
            - $(POD_UID)
            - --cohort
            - qbit-0.2.13-ryokan-1.9.13
            - --source-pvc
            - ryokan-data
            - --source-pvc-uid
            - 3592d0d7-92fe-47f9-abe6-01fa52c2b71b
            - --timeout
            - '1800'
            - --retention
            - '3'
            - --scratch-reserve-bytes
            - '536870912'
            - --max-source-bytes
            - '8589934592'
            - --max-work-bytes
            - '25769803776'
            - --max-archive-bytes
            - '10737418240'
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: TMPDIR
              value: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 24Gi
            limits:
              cpu: 1000m
              memory: 512Mi
              ephemeral-storage: 24Gi
          volumeMounts:
            - name: data
              mountPath: /source
              readOnly: true
            - name: prestart-backup-helper
              mountPath: /backup-helper
              readOnly: true
            - name: prestart-backup-work
              mountPath: /work
            - name: prestart-backup-destination
              mountPath: /backups
          terminationMessagePolicy: File
        - name: sync-qbittorrent-credentials
          # Reviewed with media-state-backups/public-helper-image.json.
          # renovate: datasource=docker depName=cgr.dev/chainguard/python
          image: cgr.dev/chainguard/python:latest@sha256:93c92d4ee2d0a4e540ec4de4e708267b45c2551a3c836fdf3e174a05017a76de
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/python
            - -c
            - |
              import os
              import sqlite3
              import time
              from pathlib import Path

              db_path = Path("/data/ryokan.db")
              username = os.environ["QBT_USER"]
              password = os.environ["QBT_PASSWORD"]
              prowlarr_api_key = os.environ["PROWLARR_API_KEY"]

              if not db_path.exists():
                  print("Ryokan database does not exist yet; skipping qBittorrent credential sync")
                  raise SystemExit(0)

              connection = sqlite3.connect(db_path, timeout=30)
              try:
                  connection.execute("PRAGMA busy_timeout = 30000")
                  connection.execute("BEGIN IMMEDIATE")
                  config_updates = connection.execute(
                      """
                      UPDATE config
                      SET qbit_user = ?,
                          qbit_pass = ?,
                          post_processing_mode = 'copy',
                          recycle_bin_path = '/media/anime/.recycle',
                          recycle_bin_age_days = 14
                      WHERE id = 1
                      """,
                      (username, password),
                  ).rowcount
                  client_updates = connection.execute(
                      """
                      UPDATE download_clients
                      SET username = ?, password = ?, updated_at = ?
                      WHERE kind = 'qbittorrent'
                      """,
                      (username, password, int(time.time())),
                  ).rowcount

                  indexer_columns = {
                      row[1]
                      for row in connection.execute("PRAGMA table_info(indexers)")
                  }
                  if "category_ids" not in indexer_columns:
                      connection.execute(
                          "ALTER TABLE indexers ADD COLUMN category_ids "
                          "TEXT NOT NULL DEFAULT '5070'"
                      )

                  prowlarr_key_updates = connection.execute(
                      """
                      UPDATE indexers
                      SET api_key = ?, updated_at = ?
                      WHERE url LIKE 'http://prowlarr.media.svc.cluster.local:9696/%/api'
                      """,
                      (prowlarr_api_key, int(time.time())),
                  ).rowcount
                  configured_indexer_updates = 0
                  redacted_error_rows = connection.execute(
                      """
                      UPDATE indexers
                      SET rss_last_poll_error = ''
                      WHERE rss_last_poll_error LIKE '%apikey=%'
                      """
                  ).rowcount
                  indexer_url = (
                      "http://prowlarr.media.svc.cluster.local:9696/31/api"
                  )
                  qbit_row = connection.execute(
                      """
                      SELECT id
                      FROM download_clients
                      WHERE kind = 'qbittorrent' AND enabled = 1
                      ORDER BY is_default DESC, id
                      LIMIT 1
                      """
                  ).fetchone()
                  existing_row = connection.execute(
                      "SELECT id FROM indexers WHERE url = ? LIMIT 1",
                      (indexer_url,),
                  ).fetchone()
                  if existing_row:
                      configured_indexer_updates = connection.execute(
                          """
                          UPDATE indexers
                          SET name = 'Sukebei Nyaa Anime',
                              kind = 'torznab',
                              api_key = ?,
                              category_ids = '6000',
                              priority = 16,
                              enabled = 1,
                              is_private_tracker = 0,
                              min_seeders = 1,
                              download_client_id = ?,
                              rss_enabled = 1,
                              updated_at = ?
                          WHERE id = ?
                          """,
                          (
                              prowlarr_api_key,
                              qbit_row[0] if qbit_row else None,
                              int(time.time()),
                              existing_row[0],
                          ),
                      ).rowcount
                  else:
                      configured_indexer_updates = connection.execute(
                          """
                          INSERT INTO indexers (
                              name, kind, url, api_key, category_ids,
                              priority, enabled, is_private_tracker,
                              min_seeders, download_client_id, rss_enabled
                          ) VALUES (
                              'Sukebei Nyaa Anime', 'torznab', ?, ?, '6000',
                              16, 1, 0, 1, ?, 1
                          )
                          """,
                          (
                              indexer_url,
                              prowlarr_api_key,
                              qbit_row[0] if qbit_row else None,
                          ),
                      ).rowcount
                  connection.commit()
              except Exception:
                  connection.rollback()
                  raise
              finally:
                  connection.close()

              print(
                  "Synced qBittorrent credentials and enforced source-retaining copy mode "
                  "in Ryokan database: "
                  f"config_rows={config_updates} download_client_rows={client_updates} "
                  f"prowlarr_key_rows={prowlarr_key_updates} "
                  f"configured_indexer_rows={configured_indexer_updates} "
                  f"redacted_error_rows={redacted_error_rows}"
              )
          env:
            - name: QBT_USER
              valueFrom:
                secretKeyRef:
                  name: media-qbittorrent-cleanup
                  key: QBT_USER
            - name: QBT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-qbittorrent-cleanup
                  key: QBT_PASSWORD
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-jellyfin-arr-api-keys
                  key: PROWLARR_API_KEY
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: ryokan
          # renovate: datasource=docker depName=ghcr.io/abhi1693/ryokan
          image: registry.home/ghcr.io/abhi1693/ryokan:1.9.13@sha256:15e43bf5e84cde3abd955263c493764828ff8e400b788708b5719fdbb0242782
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ryokan
          ports:
            - name: http
              containerPort: 8978
              protocol: TCP
          resources:
            requests:
              cpu: 75m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /data
            - name: downloads
              mountPath: /downloads
            - name: anime-library
              mountPath: /media/anime
              subPath: anime
            - name: tmp
              mountPath: /tmp
        - name: import-reconciler
          # renovate: datasource=docker depName=ghcr.io/abhi1693/qbittorrent-smart-queues
          image: registry.home/ghcr.io/abhi1693/qbittorrent-smart-queues:0.2.13@sha256:cd54a54c19a2ef40e450b1e53759a10c206eea3247263f6a15d5b67fa793db18
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - qbittorrent_smart_queues.ryokan_reconciler
          env:
            - name: RYOKAN_RECONCILER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: media-jellyfin-arr-api-keys
                  key: SONARR_ANIME_API_KEY
            - name: RYOKAN_RECONCILER_DB_PATH
              value: /data/ryokan.db
            - name: RYOKAN_RECONCILER_MEDIA_ROOT
              value: /media/anime
          ports:
            - name: reconcile
              containerPort: 8979
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: reconcile
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: reconcile
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: reconcile
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: anime-library
              mountPath: /media/anime
              subPath: anime
              readOnly: true
      volumes:
        - name: prestart-backup-helper
          configMap:
            name: media-prestart-backup-c24c14a3317c
            defaultMode: 292
        - name: prestart-backup-work
          emptyDir:
            sizeLimit: 24Gi
        - name: prestart-backup-destination
          persistentVolumeClaim:
            claimName: ryokan-prestart-backup-nfs
        - name: data
          persistentVolumeClaim:
            claimName: ryokan-data
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads-unas
        - name: anime-library
          persistentVolumeClaim:
            claimName: media-library-unas
        - name: tmp
          emptyDir: {}
