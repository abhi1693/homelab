---
apiVersion: home-lab.io/v1alpha1
kind: WorkloadCatalog
metadata:
  name: ryokan
spec:
  displayName: Ryokan
  purpose: Coordinate anime request, batch cleanup, and import workflows with receipt verification.
  owner: home-lab
  project: entertainment
  cluster: home-k3s
  lifecycle: active
  criticality: medium
  dataClassification: sensitive
  repository: https://github.com/abhi1693/home-lab
  gitPath: kubernetes/projects/entertainment/apps/media-ryokan
  workloads:
    - {key: home-k3s/media/apps/deployment/ryokan, namespace: media, apiGroup: apps, kind: Deployment, name: ryokan, desiredReplicas: 1, sourcePath: kubernetes/projects/entertainment/apps/media-ryokan/deployment.yaml}
  persistentStores:
    - key: home-k3s/media/pvc/ryokan-prestart-backup-nfs
      namespace: media
      type: pvc
      name: ryokan-prestart-backup-nfs
      storageClass: nfs-shared-retain
      capacity: 64Gi
      accessModes: [ReadWriteMany]
      retention: retain
      backup: Verified database and key archives before each app writer starts; three completed points are retained. NAS dataset protection remains external.
      dataClassification: restricted
      sourcePath: kubernetes/projects/entertainment/apps/media-state-backups/ryokan-backup-pvc.yaml
