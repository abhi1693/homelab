---
name: qbittorrent-helmop
defaultNamespace: fleet-local
labels:
  app.kubernetes.io/name: qbittorrent
  app.kubernetes.io/part-of: media-stack
  home-lab.io/project-slug: entertainment
  home-lab.io/lockfile-cleanup: enabled
dependsOn:
  - name: media-state-backups
  - name: metallb-config
  - name: rancher-project-entertainment
  - name: media-storage
diff:
  comparePatches:
    - apiVersion: apps/v1
      kind: Deployment
      name: qbittorrent-smart-queues
      namespace: media
      jsonPointers:
        - /spec/replicas
    - apiVersion: batch/v1
      kind: CronJob
      name: qbittorrent-downloads-layout
      namespace: media
      jsonPointers:
        - /spec/suspend
    - apiVersion: batch/v1
      kind: CronJob
      name: qbittorrent-state-backup
      namespace: media
      jsonPointers:
        - /spec/suspend
    - apiVersion: batch/v1
      kind: CronJob
      name: qbittorrent-tracker-refresh
      namespace: media
      jsonPointers:
        - /spec/suspend
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: qbittorrent-smart-queues-state-nfs
      namespace: media
      jsonPointers:
        - /spec/volumeName
helm:
  timeoutSeconds: 2400
  takeOwnership: true
