---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse-data
    app.kubernetes.io/part-of: clickhouse
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-workers
  resources:
    requests:
      storage: 50Gi
  volumeName: pvc-a0f8703b-2333-4eaf-a91e-9e1111b7793b
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-backups
  namespace: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse-backups
    app.kubernetes.io/part-of: clickhouse
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs-shared-retain
  resources:
    requests:
      storage: 100Gi
  volumeName: pvc-8ea948cc-dc0e-4e6a-b5b8-2e05327d4412
