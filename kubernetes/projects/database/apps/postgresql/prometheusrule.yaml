---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql-pgbouncer
  namespace: postgresql
  labels:
    app.kubernetes.io/name: postgresql-pgbouncer
    app.kubernetes.io/component: alerts
    app.kubernetes.io/part-of: postgresql
    home-lab.io/project-slug: database
spec:
  groups:
    - name: postgresql.cnpg-collector
      rules:
        - alert: CNPGCollectorQueryErrors
          expr: max by (namespace, pod) (cnpg_last_error{namespace="postgresql", pod=~"postgresql-([1-9][0-9]*)$"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: CloudNativePG SQL metric collection is failing
            description: CloudNativePG collector queries on {{ $labels.pod }} have failed for more than 5 minutes.
        - alert: CNPGCollectorMetricsCoverageLow
          expr: |
            (
              count(count by (pod) (
                cnpg_pg_stat_database_xact_commit{
                  namespace="postgresql",
                  pod=~"postgresql-([1-9][0-9]*)$"
                }
              )) or vector(0)
            )
            <
            (
              count(
                kube_pod_container_status_ready{
                  namespace="postgresql",
                  pod=~"postgresql-([1-9][0-9]*)$",
                  container="postgres"
                } == 1
              ) or vector(0)
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: CloudNativePG SQL metric coverage is incomplete
            description: Fewer PostgreSQL instances expose SQL-derived CNPG metrics than are ready.
    - name: postgresql.pgbouncer
      rules:
        - alert: PgBouncerClientQueueing
          expr: max by (pod, database, user) (max_over_time(cnpg_pgbouncer_pools_cl_waiting{namespace="postgresql"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: PgBouncer pool has queued clients
            description: PgBouncer pool {{ $labels.database }}/{{ $labels.user }} on {{ $labels.pod }} has had queued clients for more than 5 minutes.
        - alert: PgBouncerClientWaitHigh
          expr: max by (pod, database, user) (cnpg_pgbouncer_pools_maxwait{namespace="postgresql"}) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: PgBouncer client wait time is high
            description: PgBouncer pool {{ $labels.database }}/{{ $labels.user }} on {{ $labels.pod }} has max client wait above 30 seconds for more than 5 minutes.
        - alert: PgBouncerClientWaitCritical
          expr: max by (pod, database, user) (cnpg_pgbouncer_pools_maxwait{namespace="postgresql"}) > 60
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: PgBouncer client wait time is critical
            description: PgBouncer pool {{ $labels.database }}/{{ $labels.user }} on {{ $labels.pod }} has max client wait above 60 seconds for more than 5 minutes.
    - name: postgresql.autovacuum
      rules:
        - alert: PostgreSQLDeadTupleRatioHigh
          expr: |
            max by (datname, schemaname, relname) (
              cnpg_pg_stat_user_tables_autovacuum_dead_tuple_ratio{namespace="postgresql"}
              * on (namespace, pod) group_left()
                (1 - cnpg_pg_replication_in_recovery{namespace="postgresql"})
            ) > 0.08
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: PostgreSQL table is nearing its autovacuum threshold
            description: '{{ $labels.datname }}.{{ $labels.schemaname }}.{{ $labels.relname }} has an estimated dead-tuple ratio above 8% for 15 minutes.'
        - alert: PostgreSQLDeadTupleRatioCritical
          expr: |
            max by (datname, schemaname, relname) (
              cnpg_pg_stat_user_tables_autovacuum_dead_tuple_ratio{namespace="postgresql"}
              * on (namespace, pod) group_left()
                (1 - cnpg_pg_replication_in_recovery{namespace="postgresql"})
            ) > 0.15
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: PostgreSQL table has excessive dead tuples
            description: '{{ $labels.datname }}.{{ $labels.schemaname }}.{{ $labels.relname }} has an estimated dead-tuple ratio above 15% for 30 minutes; inspect autovacuum progress and table churn.'
