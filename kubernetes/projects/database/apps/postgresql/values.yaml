fullnameOverride: postgresql
type: postgresql
version:
  postgresql: "17"
mode: standalone
cluster:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: registry.home/ghcr.io/cloudnative-pg/postgresql:17.10
  imagePullSecrets:
    - name: harbor-registry
  initdb:
    # Keep the bootstrap owner aligned with CNPG's existing postgresql-app secret.
    # The managed role/database below also repair an already-bootstrapped cluster.
    database: app
    owner: app
  annotations:
    home-lab.io/firefly-role-reconcile: "20260614T085757Z"
    home-lab.io/harbor-postgresql-secret: external
    home-lab.io/postgresql-pvc-resize: "20260814T000000Z"
    home-lab.io/zitadel-role-reconcile: "20260706T004400Z"
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  # Bound voluntary shutdown and eviction replacement to five minutes. CNPG's
  # default 180-second smart shutdown leaves two minutes for fast shutdown and
  # WAL/archive completion before the kubelet's termination deadline.
  stopDelay: 300
  storage:
    storageClass: longhorn
    size: 20Gi
  walStorage:
    enabled: true
    storageClass: longhorn
    size: 4Gi
  resources:
    requests:
      cpu: 250m
      memory: 3Gi
    limits:
      memory: 3Gi
  affinity:
    nodeSelector:
      kubernetes.io/arch: arm64
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  enablePDB: true
  enableSuperuserAccess: false
  services:
    disabledDefaultServices:
      - r
      - ro
  monitoring:
    enabled: true
    podMonitor:
      enabled: true
    instrumentation:
      logicalReplication: false
    customQueries:
      - name: pg_stat_statements_top
        target_databases:
          - postgres
        predicate_query: SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pg_stat_statements')
        query: |
          WITH query_settings AS MATERIALIZED (
            SELECT set_config('work_mem', '16MB', true) AS work_mem
          ),
          top_statements AS MATERIALIZED (
            SELECT
              d.datname,
              s.userid,
              s.queryid,
              s.calls,
              s.total_exec_time,
              s.mean_exec_time,
              s.max_exec_time,
              s.rows,
              s.shared_blks_read,
              s.shared_blks_hit,
              s.shared_blks_dirtied,
              s.temp_blks_read,
              s.temp_blks_written,
              s.shared_blk_read_time,
              s.shared_blk_write_time
            FROM query_settings
            CROSS JOIN pg_stat_statements(false) s
            JOIN pg_database d ON d.oid = s.dbid
            WHERE d.datname NOT IN ('template0', 'template1')
            ORDER BY s.total_exec_time DESC
            LIMIT 25
          )
          SELECT
            s.datname,
            r.rolname,
            s.queryid::text AS queryid,
            row_number() OVER (ORDER BY s.total_exec_time DESC)::double precision AS total_rank,
            s.calls::double precision AS calls,
            (s.total_exec_time / 1000.0)::double precision AS total_exec_time_seconds,
            (s.mean_exec_time / 1000.0)::double precision AS mean_exec_time_seconds,
            (s.max_exec_time / 1000.0)::double precision AS max_exec_time_seconds,
            s.rows::double precision AS rows,
            s.shared_blks_read::double precision AS shared_blks_read,
            s.shared_blks_hit::double precision AS shared_blks_hit,
            s.shared_blks_dirtied::double precision AS shared_blks_dirtied,
            s.temp_blks_read::double precision AS temp_blks_read,
            s.temp_blks_written::double precision AS temp_blks_written,
            (s.shared_blk_read_time / 1000.0)::double precision AS shared_blk_read_time_seconds,
            (s.shared_blk_write_time / 1000.0)::double precision AS shared_blk_write_time_seconds
          FROM top_statements s
          JOIN pg_roles r ON r.oid = s.userid
          ORDER BY s.total_exec_time DESC
        metrics:
          - datname:
              usage: LABEL
              description: Database name
          - rolname:
              usage: LABEL
              description: Role name
          - queryid:
              usage: LABEL
              description: pg_stat_statements query identifier
          - total_rank:
              usage: GAUGE
              description: Rank by cumulative execution time
          - calls:
              usage: COUNTER
              description: Number of times the statement was executed
          - total_exec_time_seconds:
              usage: COUNTER
              description: Total time spent executing the statement
          - mean_exec_time_seconds:
              usage: GAUGE
              description: Mean execution time for the statement
          - max_exec_time_seconds:
              usage: GAUGE
              description: Maximum execution time for the statement
          - rows:
              usage: COUNTER
              description: Total rows retrieved or affected by the statement
          - shared_blks_read:
              usage: COUNTER
              description: Shared blocks read by the statement
          - shared_blks_hit:
              usage: COUNTER
              description: Shared block cache hits by the statement
          - shared_blks_dirtied:
              usage: COUNTER
              description: Shared blocks dirtied by the statement
          - temp_blks_read:
              usage: COUNTER
              description: Temporary blocks read by the statement
          - temp_blks_written:
              usage: COUNTER
              description: Temporary blocks written by the statement
          - shared_blk_read_time_seconds:
              usage: COUNTER
              description: Time spent reading shared data file blocks by the statement
          - shared_blk_write_time_seconds:
              usage: COUNTER
              description: Time spent writing shared data file blocks by the statement
      - name: pg_stat_user_tables_autovacuum
        target_databases:
          - devfeed
          - harbor
        query: |
          SELECT
            current_database() AS datname,
            schemaname,
            s.relname,
            n_live_tup::double precision AS live_tuples,
            n_dead_tup::double precision AS dead_tuples,
            CASE
              WHEN n_live_tup > 0 THEN n_dead_tup::double precision / n_live_tup
              ELSE 0
            END AS dead_tuple_ratio,
            n_mod_since_analyze::double precision AS modifications_since_analyze,
            COALESCE(options.vacuum_threshold,
              current_setting('autovacuum_vacuum_threshold')::double precision)
              + COALESCE(options.vacuum_scale_factor,
                  current_setting('autovacuum_vacuum_scale_factor')::double precision)
                * GREATEST(c.reltuples, 0) AS vacuum_trigger_tuples
          FROM pg_stat_user_tables s
          JOIN pg_class c ON c.oid = s.relid
          LEFT JOIN LATERAL (
            SELECT
              MAX(option_value::double precision) FILTER (
                WHERE option_name = 'autovacuum_vacuum_threshold'
              ) AS vacuum_threshold,
              MAX(option_value::double precision) FILTER (
                WHERE option_name = 'autovacuum_vacuum_scale_factor'
              ) AS vacuum_scale_factor
            FROM pg_options_to_table(c.reloptions)
            WHERE option_name IN (
              'autovacuum_vacuum_threshold', 'autovacuum_vacuum_scale_factor'
            )
          ) options ON true
          WHERE s.relname IN (
            'articles',
            'article_analysis_jobs',
            'research_verification_jobs',
            'topic_analysis_jobs',
            'topic_relation_proposals',
            'artifact',
            'artifact_blob',
            'artifact_reference',
            'blob',
            'tag',
            'task'
          )
        metrics:
          - datname:
              usage: LABEL
              description: Database name
          - schemaname:
              usage: LABEL
              description: Schema name
          - relname:
              usage: LABEL
              description: Table name
          - live_tuples:
              usage: GAUGE
              description: Estimated live tuples
          - dead_tuples:
              usage: GAUGE
              description: Estimated dead tuples
          - dead_tuple_ratio:
              usage: GAUGE
              description: Estimated dead tuples divided by live tuples
          - modifications_since_analyze:
              usage: GAUGE
              description: Estimated row modifications since the last analyze
          - vacuum_trigger_tuples:
              usage: GAUGE
              description: Effective dead-tuple autovacuum threshold using table overrides and analyzed row estimate
  postgresql:
    parameters:
      autovacuum_analyze_scale_factor: "0.02"
      autovacuum_vacuum_scale_factor: "0.1"
      checkpoint_timeout: "15min"
      effective_cache_size: "768MB"
      idle_in_transaction_session_timeout: "5min"
      log_lock_waits: "on"
      max_connections: "160"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "all"
      shared_buffers: "256MB"
      track_io_timing: "on"
      wal_buffers: "16MB"
      wal_level: "replica"
      work_mem: "4MB"
