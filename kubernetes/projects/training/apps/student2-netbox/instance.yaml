---
studentPlugins: true
# Allow time for first-boot PostgreSQL migrations.
chart:
  timeoutSeconds: 1200
values:
  replicaCount: 0
  fullnameOverride: student2-netbox
  existingSecret: student2-netbox
  superuser:
    name: admin
    email: student2@home.invalid
    existingSecret: student2-netbox-admin
  allowedHosts:
  - netbox-lab2.practicelab.dev
  csrf:
    trustedOrigins:
    - https://netbox-lab2.practicelab.dev
  ingress:
    enabled: false
    className: cloudflare-tunnel
    hosts:
    - host: netbox-lab2.practicelab.dev
      paths:
      - /
  externalDatabase:
    database: netbox_student2
    username: netbox_student2
    existingSecretName: student2-netbox
  tasksDatabase:
    database: 16
  cachingDatabase:
    database: 17
  podAnnotations:
    home-lab.io/bootstrap-revision: training-v1
  worker:
    replicaCount: 0
    podAnnotations:
      home-lab.io/bootstrap-revision: training-v1
