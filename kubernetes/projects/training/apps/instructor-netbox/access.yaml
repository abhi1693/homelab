---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: instructor-netbox-access
  namespace: postgresql
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgresql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: instructor
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: instructor-netbox
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: instructor-netbox-access
  namespace: valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: valkey
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: instructor
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: instructor-netbox
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 26379
