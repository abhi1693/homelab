---
apiVersion: home-lab.io/v1alpha1
kind: WorkloadCatalog
metadata:
  name: student3-netbox
spec:
  displayName: Student 3 NetBox
  purpose: Student 3 NetBox lab for classroom practice.
  owner: home-lab
  project: training
  cluster: home-k3s
  lifecycle: active
  criticality: low
  dataClassification: sensitive
  repository: https://github.com/abhi1693/home-lab
  gitPath: kubernetes/projects/training/apps/student3-netbox
  runbook: kubernetes/projects/training/apps/student3-netbox/README.md
  knownLimitations:
  - Lab is paused with ingress disabled.
  workloads:
  - key: home-k3s/student3/apps/deployment/student3-netbox
    namespace: student3
    apiGroup: apps
    kind: Deployment
    name: student3-netbox
    desiredReplicas: 0
    sourcePath: kubernetes/projects/training/apps/student3-netbox/values.yaml
    images:
    - ghcr.io/abhi1693/home-lab-netbox-training
  - key: home-k3s/student3/apps/deployment/student3-netbox-worker
    namespace: student3
    apiGroup: apps
    kind: Deployment
    name: student3-netbox-worker
    desiredReplicas: 0
    sourcePath: kubernetes/projects/training/apps/student3-netbox/values.yaml
    images:
    - ghcr.io/abhi1693/home-lab-netbox-training
  persistentStores: []
  endpoints: []
  dependencies: []
