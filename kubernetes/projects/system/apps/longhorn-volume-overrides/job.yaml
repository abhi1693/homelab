---
apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-database-replica-count-20260722
  namespace: longhorn-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: longhorn-volume-overrides
    app.kubernetes.io/component: replica-count
    app.kubernetes.io/part-of: longhorn
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn-volume-overrides
        app.kubernetes.io/component: replica-count
        app.kubernetes.io/part-of: longhorn
    spec:
      serviceAccountName: longhorn-volume-overrides
      restartPolicy: Never
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: reduce-database-storage-replicas
          image: rancher/kuberlr-kubectl:v7.0.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              for target in \
                pvc-3420f46c-91af-4eaf-b3e4-45df768f173f:postgresql:postgresql-1 \
                pvc-2b8f8ac9-f0f3-49a9-889d-bb4f3706a6aa:postgresql:postgresql-1-wal \
                pvc-6b556801-b87b-4b61-9d7f-d9db8b641494:postgresql:postgresql-2 \
                pvc-9969edb4-002f-48c6-b8d2-0aaedef14fe0:postgresql:postgresql-2-wal \
                pvc-98113d72-ab80-43b0-a9a9-58c91ac78919:valkey:valkey-data-valkey-node-0 \
                pvc-2fcf21b6-ab48-475a-bd36-5359dda76806:valkey:valkey-data-valkey-node-1 \
                pvc-d73d3f41-1725-40f8-978e-55ae183b365f:valkey:valkey-data-valkey-node-2 \
                pvc-85319383-750d-4dec-ac15-298f3ab14972:postgresql:postgresql-4 \
                pvc-a98ab27b-4b2c-4e63-84f2-e494d368a3f4:postgresql:postgresql-4-wal
              do
                volume="${target%%:*}"
                claim="${target#*:}"
                expected_namespace="${claim%%:*}"
                expected_pvc="${claim#*:}"
                actual_namespace="$(
                  kubectl -n longhorn-system get volumes.longhorn.io "$volume" \
                    -o jsonpath='{.status.kubernetesStatus.namespace}'
                )"
                actual_pvc="$(
                  kubectl -n longhorn-system get volumes.longhorn.io "$volume" \
                    -o jsonpath='{.status.kubernetesStatus.pvcName}'
                )"

                if [ "$actual_namespace" != "$expected_namespace" ] || \
                   [ "$actual_pvc" != "$expected_pvc" ]; then
                  echo "refusing to patch $volume: expected $expected_namespace/$expected_pvc, got $actual_namespace/$actual_pvc" >&2
                  exit 1
                fi

                current="$(
                  kubectl -n longhorn-system get volumes.longhorn.io "$volume" \
                    -o jsonpath='{.spec.numberOfReplicas}'
                )"
                if [ "$current" = "1" ]; then
                  echo "$volume already has numberOfReplicas=1"
                  continue
                fi

                kubectl -n longhorn-system patch volumes.longhorn.io "$volume" \
                  --type=merge \
                  -p '{"spec":{"numberOfReplicas":1}}'
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
