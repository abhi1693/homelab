---
deploymentMode: SingleBinary

loki:
  image:
    # renovate: datasource=docker depName=docker.io/grafana/loki
    tag: 3.6.17
    digest: sha256:cd5471d6ae439eb0a7a9055b9b2fb3fd3c5485934dd576473a6289d3936b8b27
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  ingester:
    # Filesystem mode otherwise substitutes its ~2h41m store-query lookback,
    # overriding the querier window and hiding older unflushed replay. Remove
    # this filesystem-only setting as part of any object-storage migration.
    query_store_max_look_back_period: 336h
    wal:
      enabled: true
      dir: /var/loki/wal
      # Flush in-memory chunks during a graceful Fleet replacement as well as
      # retaining the WAL for replay. Never remove WAL files to recover ESTALE.
      flush_on_shutdown: true
      # Leave headroom within the 2Gi monolithic process limit during recovery.
      replay_memory_ceiling: 1GB
  querier:
    # Retained host evidence replayed after an outage must be queryable before
    # its ingester chunks flush to storage.
    query_ingesters_within: 336h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # Permit short replay bursts while retaining an explicit tenant budget.
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    retention_period: 336h
    max_query_lookback: 336h
    volume_enabled: true
    reject_old_samples: true
    reject_old_samples_max_age: 336h
    allow_structured_metadata: true
    # Preserve the existing LogQL selectors while canonical OTel resource
    # attributes and high-cardinality identity remain structured metadata.
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - cluster
              - node
              - source
              - unit
              - job
              - namespace
              - pod
              - container
              - app
              - part_of
              - component
              - service
              - severity
    # A recovering queue may deliver old records alongside current traffic.
    # Separate old time buckets instead of increasing ingester chunk lifetime.
    shard_streams:
      time_sharding_enabled: true

singleBinary:
  replicas: 1
  terminationGracePeriodSeconds: 300
  podAnnotations:
    # Reopen the stale NFS WAL handle through one Fleet-managed replacement.
    home-lab.io/wal-recovery: "20261019-issue-138"
  persistence:
    enabled: true
    storageClass: nfs-shared-retain
    size: 20Gi
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 2560Mi
  nodeSelector:
    kubernetes.io/arch: arm64
  # Keep replay and NAS-backed WAL traffic away from embedded-etcd hosts.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  tolerations: []

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: true
  replicas: 2
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
  verboseLogging: false
  nginxConfig:
    # Loki uses a stable ClusterIP. Resolve it when NGINX starts instead of
    # resolving every request; intermittent runtime DNS timeouts caused 502s
    # and permanent Alloy batch drops despite a healthy Loki backend.
    file: |
      {{ include "loki.nginxFile" . | replace "$request_uri" "" }}
    serverSnippet: |
      proxy_connect_timeout 5s;
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 96Mi

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

sidecar:
  resources:
    requests:
      cpu: 5m
      memory: 96Mi
    limits:
      memory: 128Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 60s
    labels:
      app.kubernetes.io/part-of: rancher-monitoring
  dashboards:
    enabled: false
    namespace: cattle-dashboards
    labels:
      grafana_dashboard: "1"
      app.kubernetes.io/part-of: rancher-monitoring
  rules:
    # The bundled rules use one-minute rate windows and require the chart's
    # 15-second scrape default. No live dashboard consumes their recording
    # series, so disable them when using the cluster-wide 60-second interval.
    enabled: false
    alerting: false
    labels:
      app.kubernetes.io/part-of: rancher-monitoring
