---
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
    volume_enabled: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: nfs-shared-retain
    size: 20Gi
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      cpu: 25m
      memory: 448Mi
    limits:
      memory: 1Gi
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: true
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
  verboseLogging: false
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 96Mi

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

sidecar:
  resources:
    requests:
      cpu: 5m
      memory: 96Mi
    limits:
      memory: 128Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 60s
    labels:
      app.kubernetes.io/part-of: rancher-monitoring
  dashboards:
    enabled: false
    namespace: cattle-dashboards
    labels:
      grafana_dashboard: "1"
      app.kubernetes.io/part-of: rancher-monitoring
  rules:
    # The bundled rules use one-minute rate windows and require the chart's
    # 15-second scrape default. No live dashboard consumes their recording
    # series, so disable them when using the cluster-wide 60-second interval.
    enabled: false
    alerting: false
    labels:
      app.kubernetes.io/part-of: rancher-monitoring
