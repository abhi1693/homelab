---
crds:
  create: false

controller:
  type: deployment
  replicas: 2
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: alloy-logs
          topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute

alloy:
  enableReporting: false
  clustering:
    enabled: true
    name: alloy-logs
  configMap:
    content: |-
      loki.source.kubernetes_events "cluster" {
        job_name   = "kubernetes-events"
        log_format = "json"
        forward_to = [loki.process.events.receiver]
        clustering {
          enabled = true
        }
      }

      loki.process "events" {
        forward_to = [loki.write.local.receiver]
        stage.static_labels {
          values = { cluster = "local" }
        }
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.cattle-monitoring-system.svc.cluster.local/loki/api/v1/push"
          retry_on_http_429    = true
          min_backoff_period  = "1s"
          max_backoff_period  = "1m"
          max_backoff_retries = 20
        }
      }
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 256Mi

configReloader:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 64Mi

serviceMonitor:
  enabled: true
  interval: 60s
  additionalLabels:
    app.kubernetes.io/part-of: rancher-monitoring
