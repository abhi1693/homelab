---
name: pi-recovery
defaultNamespace: cattle-monitoring-system
labels:
  app.kubernetes.io/name: pi-recovery
  app.kubernetes.io/part-of: node-recovery
  home-lab.io/project-slug: system
# Monitoring CRDs are a bootstrap prerequisite, not a live health dependency:
# its DaemonSets become NotReady precisely when this recovery app is needed.
helm:
  chart: .
diff:
  comparePatches:
    - apiVersion: coordination.k8s.io/v1
      kind: Lease
      name: pi-recovery-lock
      namespace: cattle-monitoring-system
      jsonPointers:
        - /spec
        - /metadata/annotations/home-lab.io~1recovery-state
