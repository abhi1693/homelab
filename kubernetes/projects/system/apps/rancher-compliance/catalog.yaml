---
apiVersion: home-lab.io/v1alpha1
kind: WorkloadCatalog
metadata:
  name: rancher-compliance
spec:
  displayName: Rancher Compliance
  purpose: Reconcile K3s CIS scan definitions, scheduled scans, and compliance results.
  owner: home-lab
  project: system
  cluster: home-k3s
  lifecycle: active
  criticality: high
  dataClassification: sensitive
  repository: https://github.com/abhi1693/home-lab
  gitPath: kubernetes/projects/system/apps/rancher-compliance
  workloads:
    - {key: home-k3s/compliance-operator-system/apps/deployment/compliance-operator, namespace: compliance-operator-system, apiGroup: apps, kind: Deployment, name: compliance-operator, desiredReplicas: 1, sourcePath: kubernetes/projects/system/apps/rancher-compliance/values.yaml}
