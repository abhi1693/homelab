---
global:
  cattle:
    clusterName: local
    systemDefaultRegistry: ""
  kubectl:
    repository: rancher/kubectl
    tag: v1.35.2
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
nodeSelector:
  kubernetes.io/arch: arm64
  node-role.kubernetes.io/control-plane: "true"
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoExecute
securityScanJob:
  # Scanner jobs may inspect every node, including tainted control-plane nodes.
  overrideTolerations: true
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
alerts:
  enabled: false
  severity: warning
  metricsPort: 8080
