---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-processor-headless
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: opentelemetry-processor
    app.kubernetes.io/component: telemetry-processor
    app.kubernetes.io/part-of: rancher-monitoring
    home-lab.io/project-slug: system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opentelemetry-processor
    app.kubernetes.io/component: telemetry-processor
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: metrics
      port: 8888
      targetPort: metrics
      protocol: TCP
