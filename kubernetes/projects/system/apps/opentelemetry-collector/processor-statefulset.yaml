---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opentelemetry-processor
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: opentelemetry-processor
    app.kubernetes.io/component: telemetry-processor
    app.kubernetes.io/part-of: rancher-monitoring
    home-lab.io/project-slug: system
spec:
  replicas: 2
  serviceName: opentelemetry-processor-headless
  podManagementPolicy: Parallel
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-processor
      app.kubernetes.io/component: telemetry-processor
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        home-lab.io/collector-config-revision: "2026-08-28-processor-ha-v2"
      labels:
        app.kubernetes.io/name: opentelemetry-processor
        app.kubernetes.io/component: telemetry-processor
        app.kubernetes.io/part-of: rancher-monitoring
        home-lab.io/project-slug: system
    spec:
      serviceAccountName: opentelemetry-collector
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoExecute
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: opentelemetry-processor
                  app.kubernetes.io/component: telemetry-processor
              topologyKey: kubernetes.io/hostname
      containers:
        - name: collector
          # renovate: datasource=docker depName=docker.io/otel/opentelemetry-collector-contrib
          image: docker.io/otel/opentelemetry-collector-contrib:0.155.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/collector.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 112Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: opentelemetry-processor
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opentelemetry-processor
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: opentelemetry-processor
    app.kubernetes.io/component: telemetry-processor
    app.kubernetes.io/part-of: rancher-monitoring
    home-lab.io/project-slug: system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-processor
      app.kubernetes.io/component: telemetry-processor
