---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-metrics
  namespace: cattle-monitoring-system
spec:
  secretName: etcd-metrics-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - etcd-metrics.cattle-monitoring-system.svc
    - etcd-metrics.cattle-monitoring-system.svc.cluster.local
  issuerRef:
    name: home-local-ca
    kind: ClusterIssuer
    group: cert-manager.io
