---
crds:
  create: false

controller:
  type: deployment
  replicas: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: alloy-faro
              app.kubernetes.io/name: alloy
          topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  volumes:
    extra:
      - name: sourcemap-resolver
        configMap:
          name: alloy-faro-sourcemap-resolver
  extraContainers:
    - name: sourcemap-resolver
      # renovate: datasource=docker depName=docker.io/library/python
      image: registry.home/docker.io/python:3.14.7-alpine3.23
      command: [python3, /opt/resolver/sourcemap-resolver.py]
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 192Mi
      volumeMounts:
        - name: sourcemap-resolver
          mountPath: /opt/resolver
          readOnly: true
      readinessProbe:
        exec:
          command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:12348/healthz', timeout=2)"]
        periodSeconds: 30
        timeoutSeconds: 5
  podAnnotations:
    home-lab.io/sourcemap-resolver-revision: "2026-09-18-v1"
    home-lab.io/faro-secret-revision: "2026-07-01-browser-key"
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute

alloy:
  enableReporting: false
  envFrom:
    - secretRef:
        name: alloy-faro
  extraPorts:
    - name: faro
      port: 12347
      targetPort: 12347
      protocol: TCP
  configMap:
    content: |-
      faro.receiver "public_apps" {
        extra_log_labels = {
          cluster = "local",
          source  = "faro",
        }
        log_format = "logfmt"

        server {
          listen_address           = "0.0.0.0"
          listen_port              = 12347
          api_key                  = sys.env("FARO_API_KEY")
          cors_allowed_origins     = [
            "https://abhimanyu-saharan.com",
            "https://www.abhimanyu-saharan.com",
            "https://blog.abhimanyu-saharan.com",
            "https://shipyardhq.dev",
            "https://www.shipyardhq.dev",
            "https://hub.wardnai.dev",
            "https://devfeed.tech",
            "https://admin.devfeed.home",
          ]
          include_metadata         = true
          max_allowed_payload_size = "2MiB"

          rate_limiting {
            enabled    = true
            strategy   = "per_app"
            rate       = 20
            burst_size = 40
          }
        }

        sourcemaps {
          download = false
          download_timeout = "10s"

          location {
            minified_path_prefix = "https://abhimanyu-saharan.com/_next/static/"
            path                 = "http://127.0.0.1:12348/portfolio/_next/static/"
          }

          location {
            minified_path_prefix = "https://www.abhimanyu-saharan.com/_next/static/"
            path                 = "http://127.0.0.1:12348/portfolio/_next/static/"
          }

          location {
            minified_path_prefix = "https://blog.abhimanyu-saharan.com/_next/static/"
            path                 = "http://127.0.0.1:12348/personal-blog/_next/static/"
          }

          location {
            minified_path_prefix = "https://shipyardhq.dev/_next/static/"
            path                 = "http://127.0.0.1:12348/shipyardhq/_next/static/"
          }

          location {
            minified_path_prefix = "https://www.shipyardhq.dev/_next/static/"
            path                 = "http://127.0.0.1:12348/shipyardhq/_next/static/"
          }

          location {
            minified_path_prefix = "https://hub.wardnai.dev/_next/static/"
            path                 = "http://127.0.0.1:12348/wardn-hub/_next/static/"
          }

          location {
            minified_path_prefix = "https://devfeed.tech/_next/static/"
            path                 = "http://devfeed-web-telemetry.devfeed.svc.cluster.local:9100/sourcemaps/"
          }

          location {
            minified_path_prefix = "https://admin.devfeed.home/_next/static/"
            path                 = "http://devfeed-admin-telemetry.devfeed.svc.cluster.local:9100/sourcemaps/"
          }

          cache {
            cleanup_check_interval = "5m"
            error_cleanup_interval = "30m"
            ttl                    = "24h"
          }
        }

        output {
          logs   = [loki.process.faro_labels.receiver]
          traces = [otelcol.exporter.otlphttp.tempo.input]
        }
      }

      loki.process "faro_labels" {
        forward_to = [loki.write.local.receiver]

        stage.logfmt {
          mapping = {
            app_name        = "",
            app_environment = "",
            kind            = "",
          }
        }

        stage.labels {
          values = {
            app_name        = "",
            app_environment = "",
            kind            = "",
          }
        }
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.cattle-monitoring-system.svc.cluster.local/loki/api/v1/push"
          retry_on_http_429    = true
          min_backoff_period  = "1s"
          max_backoff_period  = "1m"
          max_backoff_retries = 20
        }
      }

      otelcol.exporter.otlphttp "tempo" {
        client {
          endpoint    = "http://tempo.cattle-monitoring-system.svc.cluster.local:4318"
          compression = "gzip"
          timeout     = "10s"
        }
      }
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi

configReloader:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 64Mi

serviceMonitor:
  enabled: true
  additionalLabels:
    app.kubernetes.io/part-of: rancher-monitoring
