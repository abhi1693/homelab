---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmop.yaml
configMapGenerator:
  - name: metallb-values
    files:
      - values.yaml
generatorOptions:
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/part-of: cluster-networking
    home-lab.io/project-slug: system
configurations:
  - kustomizeconfig.yaml
patches:
  - target:
      kind: ConfigMap
      labelSelector: app.kubernetes.io/part-of=cluster-networking
    patch: |-
      - op: add
        path: /metadata/namespace
        value: fleet-local
