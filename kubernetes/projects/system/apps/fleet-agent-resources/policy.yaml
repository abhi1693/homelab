---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-agent-resources
  namespace: fleet-local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-agent-resources
  namespace: fleet-local
rules:
  - apiGroups: [provisioning.cattle.io, fleet.cattle.io]
    resources: [clusters]
    resourceNames: [local]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-agent-resources
  namespace: fleet-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-agent-resources
subjects:
  - kind: ServiceAccount
    name: fleet-agent-resources
    namespace: fleet-local
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-agent-resources
  namespace: fleet-local
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fleet-agent-resources
        spec:
          serviceAccountName: fleet-agent-resources
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: arm64
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: CriticalAddonsOnly
              operator: Equal
              value: "true"
              effect: NoExecute
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: policy
              # renovate: datasource=docker depName=python
              image: registry.home/docker.io/library/python:3.15.0-alpine3.23@sha256:de62099c4b9118cc85e553055fcc9f84764c165803d8d4cb0fb85c6c83b236cc
              command: [python, -B, /policy/policy.py]
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: code
                  mountPath: /policy
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: fleet-agent-resource-code
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-agent-resources
  namespace: fleet-local
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-agent-resources
    spec:
      serviceAccountName: fleet-agent-resources
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
        node-role.kubernetes.io/control-plane: 'true'
      tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: 'true'
        effect: NoExecute
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: policy
        # renovate: datasource=docker depName=python
        image: registry.home/docker.io/library/python:3.15.0-alpine3.23@sha256:de62099c4b9118cc85e553055fcc9f84764c165803d8d4cb0fb85c6c83b236cc
        command:
        - python
        - -B
        - /policy/policy.py
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: code
          mountPath: /policy
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: fleet-agent-resource-code
