---
apiVersion: home-lab.io/v1alpha1
kind: WorkloadCatalog
metadata:
  name: tempo
spec:
  displayName: Tempo
  purpose: Store and query distributed traces received through OpenTelemetry.
  owner: home-lab
  project: system
  cluster: home-k3s
  lifecycle: active
  criticality: high
  dataClassification: sensitive
  repository: https://github.com/abhi1693/home-lab
  gitPath: kubernetes/projects/system/apps/tempo
  workloads:
    - {key: home-k3s/cattle-monitoring-system/apps/deployment/tempo, namespace: cattle-monitoring-system, apiGroup: apps, kind: Deployment, name: tempo, desiredReplicas: 1, sourcePath: kubernetes/projects/system/apps/tempo/deployment.yaml}
  persistentStores:
    - key: home-k3s/cattle-monitoring-system/persistentvolumeclaim/tempo-data
      namespace: cattle-monitoring-system
      type: PersistentVolumeClaim
      name: tempo-data
      storageClass: longhorn
      capacity: 2Gi
      accessModes:
        - ReadWriteOnce
      retention: retain
      backup: No independent backup; Longhorn replication protects against a single replica failure.
      dataClassification: sensitive
      sourcePath: kubernetes/projects/system/apps/tempo/pvc.yaml
