---
global:
  cattle:
    clusterId: local
    clusterName: local
    rkePathPrefix: ""
    rkeWindowsPathPrefix: ""
    systemDefaultRegistry: ""
    systemProjectId: p-zl69x
    url: https://rancher.home
    windows:
      enabled: false
  systemDefaultRegistry: ""
nameOverride: rancher-monitoring
namespaceOverride: cattle-monitoring-system
crds:
  enabled: false
rancherMonitoring:
  enabled: true
k3sServer:
  enabled: true
  serviceMonitor:
    endpoints:
      # The dedicated apiserver ServiceMonitor retains apiserver metrics,
      # including the SLI histogram used by Rancher's API availability rules.
      # Drop the duplicate copies exposed through the K3s server endpoint.
      - port: metrics
        honorLabels: true
        relabelings:
          - sourceLabels:
              - __metrics_path__
            targetLabel: metrics_path
          # Rancher's PushProx subchart replaces custom metricRelabelings when
          # cluster labels are enabled. Disable this unfiltered target and use
          # prometheus.additionalServiceMonitors below for the filtered scrape.
          - sourceLabels:
              - __metrics_path__
            regex: /metrics
            action: drop
      - port: metrics
        path: /metrics/cadvisor
        honorLabels: true
        relabelings:
          - sourceLabels:
              - __metrics_path__
            targetLabel: metrics_path
      - port: metrics
        path: /metrics/probes
        honorLabels: true
        relabelings:
          - sourceLabels:
              - __metrics_path__
            targetLabel: metrics_path
  clients:
    resources:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        memory: 48Mi
  proxy:
    nodeSelector:
      kubernetes.io/arch: arm64
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoExecute
    resources:
      requests:
        cpu: 5m
        memory: 24Mi
      limits:
        memory: 48Mi
windowsMonitoring:
  enabled: false
windowsExporter:
  enabled: false
prometheus-adapter:
  prometheus:
    url: http://thanos-query.cattle-monitoring-system.svc
    port: 9090
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
  logLevel: 1
  metricsRelistInterval: 10m
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
  rules:
    default: false
    custom:
      - seriesQuery: '{__name__="home_lab_disabled_prometheus_adapter_metric",namespace!="",pod!=""}'
        resources:
          overrides:
            namespace:
              resource: namespace
            pod:
              resource: pod
        name:
          matches: "^home_lab_disabled_prometheus_adapter_metric$"
          as: "home_lab_disabled_prometheus_adapter_metric"
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
    external: []
prometheusOperator:
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 144Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  admissionWebhooks:
    patch:
      nodeSelector:
        kubernetes.io/arch: arm64
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoExecute
prometheus:
  # Expose every Prometheus sidecar through a headless discovery Service so
  # both Thanos Query replicas can discover every HA source independently.
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true
  additionalServiceMonitors:
    - name: rancher-monitoring-k3s-server-filtered
      jobLabel: component
      podTargetLabels:
        - component
        - pushprox-exporter
      namespaceSelector:
        matchNames:
          - cattle-monitoring-system
      selector:
        matchLabels:
          component: k3s-server
          k8s-app: pushprox-k3s-server-client
          provider: kubernetes
          release: rancher-monitoring
      endpoints:
        - port: metrics
          honorLabels: true
          proxyUrl: http://pushprox-k3s-server-proxy.cattle-monitoring-system.svc:8080
          params:
            _scheme:
              - https
          tlsConfig:
            insecureSkipVerify: true
          relabelings:
            - sourceLabels:
                - __metrics_path__
              targetLabel: metrics_path
          metricRelabelings:
            - sourceLabels:
                - __name__
              regex: apiserver_.*
              action: drop
            - sourceLabels:
                - __address__
              targetLabel: cluster_id
              replacement: local
              action: replace
            - sourceLabels:
                - __address__
              targetLabel: cluster_name
              replacement: local
              action: replace
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  prometheusSpec:
    nodeSelector:
      kubernetes.io/arch: arm64
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoExecute
    externalUrl: http://prometheus.home
    routePrefix: /
    paused: false
    # Each scraper owns an independent retained Longhorn claim. Replica 0
    # contains the verified historical copy; replica 1 began with an empty TSDB.
    replicas: 2
    shards: 1
    retention: 30d
    retentionSize: 52GiB
    scrapeInterval: 60s
    enableOTLPReceiver: true
    podAntiAffinity: hard
    # Object storage is intentionally absent. The sidecar only exposes the
    # Prometheus StoreAPI, so Prometheus retains normal local compaction.
    thanos:
      image: docker.io/rancher/appco-thanos:0.40.1-8.1
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          memory: 1Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      # Retain both the source and destination claims across staged scaling.
      whenScaled: Retain
    ruleSelector: {}
    ruleNamespaceSelector: {}
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}
    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeConfigSelector: {}
    scrapeConfigNamespaceSelector: {}
    otlp:
      keepIdentifyingResourceAttributes: true
      promoteResourceAttributes:
        - service.instance.id
        - service.name
        - service.namespace
        - deployment.environment.name
        - service.version
        - cloud.availability_zone
        - cloud.region
        - container.name
        - deployment.environment
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
    resources:
      requests:
        cpu: 400m
        memory: 4Gi
      limits:
        memory: 5Gi
    containers: |-
      # Prometheus remains unready while its HTTP handler is blocked, but the
      # liveness budget avoids turning a transient NFS stall into another WAL
      # replay. A genuine hang is still restarted after five minutes.
      - name: prometheus
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http-web
          failureThreshold: 20
          periodSeconds: 15
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http-web
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 10
        startupProbe:
          httpGet:
            path: /-/ready
            port: http-web
          failureThreshold: 60
          periodSeconds: 15
          timeoutSeconds: 10
      - name: prometheus-proxy
        args:
          - nginx
          - -g
          - daemon off;
          - -c
          - /nginx/nginx.conf
        image: "{{ template "system_default_registry" . }}{{ .Values.prometheus.prometheusSpec.proxy.image.repository }}:{{ .Values.prometheus.prometheusSpec.proxy.image.tag }}"
        ports:
          - containerPort: 8081
            name: nginx-http
            protocol: TCP
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
        volumeMounts:
          - mountPath: /nginx
            name: prometheus-nginx
          - mountPath: /var/cache/nginx
            name: nginx-home
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: prometheus-data-longhorn
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 64Gi
alertmanager:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/arch: arm64
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: CriticalAddonsOnly
        operator: Equal
        value: "true"
        effect: NoExecute
    externalUrl: http://alertmanager.home
    routePrefix: /
    alertmanagerConfigMatcherStrategy:
      type: None
    paused: false
    replicas: 2
    retention: 120h
    podAntiAffinity: hard
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        metadata:
          name: am-data-nfs
        spec:
          storageClassName: nfs-shared-retain
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
grafana:
  # Grafana can spend several minutes replaying migrations and loading plugins
  # when the retained NFS database is slow. Keep readiness strict, but do not
  # let liveness terminate that bounded startup work.
  livenessProbe:
    initialDelaySeconds: 600
    timeoutSeconds: 30
    failureThreshold: 10
  readinessProbe:
    timeoutSeconds: 5
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: loki
              app.kubernetes.io/instance: loki
              app.kubernetes.io/component: single-binary
          topologyKey: kubernetes.io/hostname
  replicas: 1
  deploymentStrategy:
    type: Recreate
  grafana.ini:
    auth.basic:
      enabled: true
    database:
      # This is a single Grafana replica. Avoid HA coordination writes and
      # tolerate transient SQLite lock contention on the retained NFS file.
      high_availability: false
      query_retries: 10
      transaction_retries: 10
  env:
    HOME_LAB_DATASOURCE_REVISION: "2026-06-30-loki"
  envFromSecret: rancher-monitoring-grafana-llm
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /
    pathType: Prefix
    hosts:
      - grafana.home
    tls: []
  defaultDashboards:
    namespace: cattle-dashboards
    useExistingNamespace: true
    cleanupOnUninstall: false
  plugins:
    - grafana-llm-app
  extraConfigmapMounts:
    - name: grafana-llm-provisioning
      mountPath: /etc/grafana/provisioning/plugins/grafana-llm.yaml
      subPath: grafana-llm.yaml
      configMap: rancher-monitoring-grafana-llm-provisioning
      readOnly: true
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.cattle-monitoring-system.svc.cluster.local:3200
      editable: false
      jsonData:
        httpMethod: GET
        tracesToMetrics:
          datasourceUid: prometheus
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.cattle-monitoring-system.svc.cluster.local
      editable: false
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: "(?:trace_id|traceId|traceID)[=\": ]+([a-fA-F0-9]{16,32})"
            name: TraceID
            url: "$${__value.raw}"
    - name: Pyroscope
      type: grafana-pyroscope-datasource
      uid: pyroscope
      access: proxy
      url: http://pyroscope.cattle-monitoring-system.svc.cluster.local:4040
      editable: false
      jsonData:
        minStep: 15s
  persistence:
    enabled: true
    type: pvc
    existingClaim: rancher-monitoring-grafana-nfs
    storageClassName: nfs-shared-retain
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    finalizers:
      - kubernetes.io/pvc-protection
  resources:
    requests:
      cpu: 25m
      memory: 320Mi
    limits:
      memory: 416Mi
  initChownData:
    enabled: false
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  sidecar:
    datasources:
      url: http://thanos-query.cattle-monitoring-system.svc.cluster.local:9090
      # Dashboards remain useful during a transient StoreAPI error. Automation
      # clients retain Query's fail-closed default.
      customQueryParameters: partial_response=true
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        memory: 272Mi
  extraContainers: |-
    - name: grafana-proxy
      args:
        - nginx
        - -g
        - daemon off;
        - -c
        - /nginx/nginx.conf
      image: "{{ template "system_default_registry" . }}{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
      ports:
        - containerPort: 8080
          name: nginx-http
          protocol: TCP
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 32Mi
      volumeMounts:
        - mountPath: /nginx
          name: grafana-nginx
        - mountPath: /var/cache/nginx
          name: nginx-home
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
prometheus-node-exporter:
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
  resources:
    requests:
      cpu: 5m
      memory: 48Mi
    limits:
      memory: 192Mi
kube-state-metrics:
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
  metricLabelsAllowlist:
    - namespaces=[home-lab.io/project-slug,field.cattle.io/projectId,app.kubernetes.io/part-of]
  volumeMounts:
    - name: zoneinfo
      mountPath: /usr/share/zoneinfo
      readOnly: true
  volumes:
    - name: zoneinfo
      hostPath:
        path: /usr/share/zoneinfo
        type: Directory
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 384Mi
