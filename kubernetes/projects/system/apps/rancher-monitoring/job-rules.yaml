---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-job-health
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: rancher-monitoring
    app.kubernetes.io/part-of: rancher-monitoring
    home-lab.io/project-slug: system
spec:
  groups:
    - name: kubernetes-job-health
      rules:
        - alert: KubeJobFailed
          expr: |-
            (
              kube_job_failed{job="kube-state-metrics", namespace=~".*"} > 0
            )
            and on (namespace, job_name)
            (
              time() - kube_job_status_start_time{job="kube-state-metrics", namespace=~".*"} < 86400
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Job failed to complete
            description: >-
              Job {{ $labels.namespace }}/{{ $labels.job_name }} failed within
              the last 24 hours. Diagnose the exact Job and verify a newer run
              before any cleanup.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
