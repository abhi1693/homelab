---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn-manager
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: longhorn-manager
    app.kubernetes.io/component: storage-health
    app.kubernetes.io/part-of: rancher-monitoring
    home-lab.io/project-slug: system
spec:
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      path: /metrics
      interval: 60s
      scrapeTimeout: 15s
      # Internal client/queue timings have no provisioned dashboard/rule users.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: longhorn_(rest_client_(rate_limiter_latency|request_latency)|workqueue_(queue_duration|work_duration))_seconds_(bucket|sum|count)
          action: drop
