---
global:
  cattle:
    psp:
      enabled: false
    systemDefaultRegistry: ""
  imagePullSecrets: []

image:
  repository: rancher/kuberlr-kubectl
  tag: v7.0.1

nodeSelector:
  kubernetes.io/arch: arm64
  node-role.kubernetes.io/control-plane: "true"
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoExecute
