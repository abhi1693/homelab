---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: smartctl-exporter
  namespace: cattle-monitoring-system
  labels:
    app.kubernetes.io/name: smartctl-exporter
    app.kubernetes.io/component: nvme-health
    app.kubernetes.io/part-of: rancher-monitoring
    home-lab.io/project-slug: system
spec:
  jobName: smartctl-exporter
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 15s
  kubernetesSDConfigs:
    - role: Node
  relabelings:
    - action: keep
      sourceLabels:
        - __meta_kubernetes_node_name
      regex: k8s-rpi.*
    - action: replace
      sourceLabels:
        - __meta_kubernetes_node_address_InternalIP
      regex: (.+)
      replacement: $1:9633
      targetLabel: __address__
    - action: replace
      sourceLabels:
        - __meta_kubernetes_node_name
      targetLabel: node
