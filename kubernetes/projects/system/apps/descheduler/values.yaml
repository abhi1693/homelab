---
kind: CronJob
schedule: "*/15 * * * *"
timeZone: Etc/UTC
suspend: false
concurrencyPolicy: Forbid
startingDeadlineSeconds: 300
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 3
ttlSecondsAfterFinished: 600
activeDeadlineSeconds: 300
image:
  repository: registry.k8s.io/descheduler/descheduler
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
priorityClassName: system-cluster-critical
nodeSelector:
  kubernetes.io/arch: arm64
  node-role.kubernetes.io/control-plane: "true"
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoExecute
podAnnotations:
  home-lab.io/apiserver-egress-policy: cilium
cmdOptions:
  v: 4
deschedulerPolicyAPIVersion: descheduler/v1alpha2
deschedulerPolicy:
  maxNoOfPodsToEvictPerNode: 2
  maxNoOfPodsToEvictPerNamespace: 1
  maxNoOfPodsToEvictTotal: 4
  metricsProviders:
    - source: KubernetesMetrics
  profiles:
    - name: balanced-control-plane-utilization
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            minPodAge: 10m
            noEvictionPolicy: Mandatory
            priorityThreshold:
              value: 900000000
            namespaceLabelSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - cattle-capi-system
                    - cattle-monitoring-system
                    - cattle-resources-system
                    - cattle-system
                    - cattle-turtles-system
                    - cert-manager
                    - cloudflare
                    - cnpg-system
                    - compliance-operator-system
                    - kube-public
                    - kube-system
                    - metallb-system
                    - sops
                    - ups
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
              extraEnabled:
                - PodsWithPVC
              config:
                PodsWithPVC:
                  protectedStorageClasses:
                    - name: longhorn
        - name: LowNodeUtilization
          args:
            useDeviationThresholds: true
            thresholds:
              cpu: 3
              memory: 8
            targetThresholds:
              cpu: 5
              memory: 8
            evictionLimits:
              node: 2
            metricsUtilization:
              source: KubernetesMetrics
      plugins:
        balance:
          enabled:
            - LowNodeUtilization
    - name: balanced-node-utilization
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            minReplicas: 2
            minPodAge: 10m
            noEvictionPolicy: Mandatory
            priorityThreshold:
              value: 900000000
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
        - name: RemoveDuplicates
          args:
            namespaces:
              exclude:
                - cattle-fleet-local-system
                - cattle-fleet-system
                - cattle-monitoring-system
                - cattle-resources-system
                - cattle-system
                - cattle-turtles-system
                - cert-manager
                - cnpg-system
                - fleet-default
                - fleet-local
                - kube-public
                - kube-system
                - longhorn-system
                - postgresql
                - valkey
                - zitadel
        - name: RemovePodsViolatingTopologySpreadConstraint
          args:
            constraints:
              - DoNotSchedule
            namespaces:
              exclude:
                - cattle-fleet-local-system
                - cattle-fleet-system
                - cattle-monitoring-system
                - cattle-resources-system
                - cattle-system
                - cattle-turtles-system
                - cert-manager
                - cnpg-system
                - fleet-default
                - fleet-local
                - kube-public
                - kube-system
                - longhorn-system
                - postgresql
                - valkey
                - zitadel
        - name: LowNodeUtilization
          args:
            useDeviationThresholds: true
            thresholds:
              cpu: 3
              memory: 8
            targetThresholds:
              cpu: 5
              memory: 8
            evictionLimits:
              node: 2
            metricsUtilization:
              source: KubernetesMetrics
            evictableNamespaces:
              exclude:
                - cattle-fleet-local-system
                - cattle-fleet-system
                - cattle-monitoring-system
                - cattle-resources-system
                - cattle-system
                - cattle-turtles-system
                - cert-manager
                - cnpg-system
                - fleet-default
                - fleet-local
                - kube-public
                - kube-system
                - longhorn-system
                - postgresql
                - valkey
                - zitadel
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
