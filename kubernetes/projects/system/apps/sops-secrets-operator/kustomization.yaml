---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmop.yaml
configMapGenerator:
  - name: sops-secrets-operator-values
    files:
      - values.yaml
generatorOptions:
  labels:
    app.kubernetes.io/name: sops-secrets-operator
    app.kubernetes.io/part-of: sops-secrets-operator
    home-lab.io/project-slug: system
configurations:
  - kustomizeconfig.yaml
patches:
  - target:
      kind: ConfigMap
      labelSelector: app.kubernetes.io/part-of=sops-secrets-operator
    patch: |-
      - op: add
        path: /metadata/namespace
        value: fleet-local
  - target:
      group: fleet.cattle.io
      version: v1alpha1
      kind: HelmOp
      labelSelector: app.kubernetes.io/part-of=sops-secrets-operator
    patch: |-
      - op: add
        path: /metadata/namespace
        value: fleet-local
