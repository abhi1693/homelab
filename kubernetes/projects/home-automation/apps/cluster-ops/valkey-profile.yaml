---
apiVersion: k8s-recommendation-engine.io/v1alpha1
kind: ApplicationProfile
metadata:
  name: valkey
  namespace: cluster-ops
  labels:
    app.kubernetes.io/name: k8s-recommendation-engine
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/part-of: cluster-ops
    home-lab.io/project-slug: home-automation
spec:
  namespace: valkey
  git:
    provider: github
    mode: fleet
    repository: https://github.com/abhi1693/home-lab.git
    branch: master
    basePath: kubernetes/projects/database/apps/valkey
  workloads:
    - name: node
      targetRef:
        apiVersion: apps/v1
        kind: StatefulSet
        name: valkey-node
      sourceFile: values.yaml
      helmValues:
        paths:
          replicas: [replica, replicaCount]
          cpuRequest: [replica, resources, requests, cpu]
          memoryRequest: [replica, resources, requests, memory]
      metricProfileRef: statefulset-resource-only
      scaling:
        replicas: true
        cpu: true
        memory: true
      bounds:
        replicas:
          min: 3
          max: 3
        cpu:
          maxIncreasePercent: 25
          maxDecreasePercent: 10
          minChangePercent: 5
        memory:
          maxIncreasePercent: 25
          maxDecreasePercent: 10
          minChangePercent: 5
      policy:
        maxProposalsPerHour: 1
        maxProposalsPerDay: 2
        safety:
          allowAutoCommit:
            - low_risk
            - medium_risk
          maxDecreaseRisk: low_risk
          urgentBypassAllowed: false
        confidence:
          minAutoCommit: 0.85
        availabilityRecovery:
          enabled: false
      vars:
        namespace: valkey
        statefulset: valkey-node
        container: valkey
  reconcileInterval: 5m
  metricProfiles:
    statefulset-resource-only:
      description: StatefulSet-scoped Kubernetes resource metrics for the selected Valkey data container.
      signals:
        cpu_usage:
          required: true
          query: |
            sum(
              rate(container_cpu_usage_seconds_total{
                namespace="{{ .namespace }}",
                container="{{ .container }}",
                image!=""
              }[5m])
              * on(namespace, pod) group_left(workload, workload_type)
                namespace_workload_pod:kube_pod_owner:relabel{
                  namespace="{{ .namespace }}",
                  workload="{{ .statefulset }}",
                  workload_type="statefulset"
                }
            )
        memory_working_set:
          required: true
          query: |
            sum(
              container_memory_working_set_bytes{
                namespace="{{ .namespace }}",
                container="{{ .container }}",
                image!=""
              }
              * on(namespace, pod) group_left(workload, workload_type)
                namespace_workload_pod:kube_pod_owner:relabel{
                  namespace="{{ .namespace }}",
                  workload="{{ .statefulset }}",
                  workload_type="statefulset"
                }
            )
        available_replicas:
          required: true
          query: |
            max(
              kube_statefulset_status_replicas_ready{
                namespace="{{ .namespace }}",
                statefulset="{{ .statefulset }}"
              }
            )
