---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-recommendation-engine-controller-manager
  namespace: cluster-ops
  labels:
    app.kubernetes.io/name: k8s-recommendation-engine
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: cluster-ops
    home-lab.io/project-slug: home-automation
spec:
  progressDeadlineSeconds: 2400
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-recommendation-engine
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        # Force the init container to clone Git sources containing Helm mappings.
        home-lab.io/git-clone-generation: "2026-07-13-helm-profiles-1"
      labels:
        app.kubernetes.io/name: k8s-recommendation-engine
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: cluster-ops
        home-lab.io/project-slug: home-automation
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      serviceAccountName: k8s-recommendation-engine
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: backup-state-before-start
          # renovate: datasource=docker depName=cgr.dev/chainguard/python
          image: cgr.dev/chainguard/python:latest@sha256:93c92d4ee2d0a4e540ec4de4e708267b45c2551a3c836fdf3e174a05017a76de
          imagePullPolicy: IfNotPresent
          command:
            - /usr/bin/python
            - -B
            - /backup-helper/backup_state.py
          args:
            - --app
            - recommender
            - --source
            - /source
            - --destination
            - /backups
            - --work
            - /work
            - --pod-uid
            - $(POD_UID)
            - --cohort
            - recommender-0.3.6
            - --source-pvc
            - k8s-recommendation-engine-shipyard-state
            - --source-pvc-uid
            - c3df9932-c01e-4a67-a320-57a97ec455a6
            - --timeout
            - '1800'
            - --retention
            - '3'
            - --max-source-bytes
            - '1073741824'
            - --max-work-bytes
            - '4294967296'
            - --max-archive-bytes
            - '2147483648'
            - --scratch-reserve-bytes
            - '536870912'
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: TMPDIR
              value: /work
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 4Gi
            limits:
              cpu: 1000m
              memory: 512Mi
              ephemeral-storage: 4Gi
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /source
              readOnly: true
            - name: prestart-backup-helper
              mountPath: /backup-helper
              readOnly: true
            - name: prestart-backup-work
              mountPath: /work
            - name: prestart-backup-destination
              mountPath: /backups
            - name: prestart-no-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          terminationMessagePolicy: File
        - name: clone-home-lab
          # renovate: datasource=docker depName=ghcr.io/abhi1693/k8s-recommendation-engine
          image: registry.home/ghcr.io/abhi1693/k8s-recommendation-engine:0.3.6@sha256:ae571cae40681b4f4abd7375d0051151c60ab12f2b335e798aa6aeef977933c3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p "$HOME"
              umask 077
              git config --global credential.helper store
              printf 'https://%s:%s@github.com\n' "$GIT_USERNAME" "$GIT_PASSWORD" > "$HOME/.git-credentials"
              rm -rf /git/home-lab
              git clone --depth=1 --branch "$GIT_BRANCH" "$GIT_REPO_URL" /git/home-lab
              cd /git/home-lab
              git config user.name "$GIT_AUTHOR_NAME"
              git config user.email "$GIT_AUTHOR_EMAIL"
          env:
            - name: HOME
              value: /home/nonroot
            - name: GIT_REPO_URL
              value: https://github.com/abhi1693/home-lab.git
            - name: GIT_BRANCH
              value: master
            - name: GIT_AUTHOR_NAME
              value: k8s-recommendation-engine
            - name: GIT_AUTHOR_EMAIL
              value: k8s-recommendation-engine@home-lab.local
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: home-lab-apps-github
                  key: username
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-lab-apps-github
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: git-home
              mountPath: /home/nonroot
            - name: git-worktree
              mountPath: /git
            - name: tmp
              mountPath: /tmp
      containers:
        - name: manager
          # renovate: datasource=docker depName=ghcr.io/abhi1693/k8s-recommendation-engine
          image: registry.home/ghcr.io/abhi1693/k8s-recommendation-engine:0.3.6@sha256:ae571cae40681b4f4abd7375d0051151c60ab12f2b335e798aa6aeef977933c3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p "$HOME"
              umask 077
              git config --global credential.helper store
              printf 'https://%s:%s@github.com\n' "$GIT_USERNAME" "$GIT_PASSWORD" > "$HOME/.git-credentials"
              cd /git/home-lab
              git config user.name "$GIT_AUTHOR_NAME"
              git config user.email "$GIT_AUTHOR_EMAIL"
              # Keep the legacy filename until the shared state is migrated offline.
              exec /usr/local/bin/k8s-recommendation-engine controller \
                --watch-namespace "$POD_NAMESPACE" \
                --prometheus-url "$PROMETHEUS_URL" \
                --history-window "$HISTORY_WINDOW" \
                --history-step "$HISTORY_STEP" \
                --reconcile-interval "$RECONCILE_INTERVAL" \
                --reconcile-timeout "$RECONCILE_TIMEOUT" \
                --state-db /var/lib/k8s-recommendation-engine/shipyard.db \
                --state-retention "$STATE_RETENTION" \
                --git-worktree /git/home-lab \
                --mode propose \
                --proposal-kind commit \
                --proposal-branch "$GIT_BRANCH" \
                --proposal-push \
                --allow-default-branch-push \
                --availability-recovery \
                --max-concurrent-reconciles 1 \
                --metrics-bind-address :8080 \
                --health-probe-bind-address :8081
          env:
            - name: HOME
              value: /home/nonroot
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROMETHEUS_URL
              value: http://thanos-query.cattle-monitoring-system.svc.cluster.local:9090
            - name: HISTORY_WINDOW
              value: 6h
            - name: HISTORY_STEP
              value: 5m
            - name: RECONCILE_INTERVAL
              value: 1m
            - name: RECONCILE_TIMEOUT
              value: 5m
            - name: STATE_RETENTION
              value: 336h
            - name: GIT_BRANCH
              value: master
            - name: GIT_AUTHOR_NAME
              value: k8s-recommendation-engine
            - name: GIT_AUTHOR_EMAIL
              value: k8s-recommendation-engine@home-lab.local
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: home-lab-apps-github
                  key: username
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-lab-apps-github
                  key: password
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: git-home
              mountPath: /home/nonroot
            - name: git-worktree
              mountPath: /git
            - name: state
              mountPath: /var/lib/k8s-recommendation-engine
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: prestart-backup-helper
          configMap:
            name: media-prestart-backup-c24c14a3317c
            defaultMode: 292
        - name: prestart-backup-work
          emptyDir:
            sizeLimit: 4Gi
        - name: prestart-backup-destination
          persistentVolumeClaim:
            claimName: recommender-state-backup-nfs
        - name: prestart-no-api-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: state
          persistentVolumeClaim:
            # Keep the legacy bound claim name to preserve recommendation history.
            claimName: k8s-recommendation-engine-shipyard-state
        - name: git-home
          emptyDir: {}
        - name: git-worktree
          emptyDir: {}
        - name: tmp
          emptyDir: {}
