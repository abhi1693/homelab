apiVersion: k8s-recommendation-engine.io/v1alpha1
kind: ApplicationProfile
metadata:
  name: finance
  namespace: cluster-ops
  labels:
    app.kubernetes.io/name: k8s-recommendation-engine
    app.kubernetes.io/instance: finance
    app.kubernetes.io/part-of: cluster-ops
    home-lab.io/project-slug: home-automation
spec:
  namespace: finance
  git:
    provider: github
    mode: fleet
    repository: https://github.com/abhi1693/home-lab.git
    branch: master
    basePath: kubernetes/projects/applications/apps
  # Firefly is intentionally paused at zero replicas. Keep the workload entries
  # for ownership/history, but disable scaling and feed constant zero signals
  # until the app is restored.
  workloads:
    - name: firefly-iii
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: firefly-iii
      sourceFile: firefly-iii/deployment.yaml
      metricProfileRef: paused-zero-replica
      scaling:
        replicas: false
        cpu: false
        memory: false
      bounds:
        replicas:
          min: 0
          max: 0
        cpu:
          maxIncreasePercent: 25
          maxDecreasePercent: 10
          minChangePercent: 5
        memory:
          maxIncreasePercent: 25
          maxDecreasePercent: 10
          minChangePercent: 5
      policy:
        maxProposalsPerHour: 1
        maxProposalsPerDay: 2
        safety:
          allowAutoCommit:
            - low_risk
            - medium_risk
          maxDecreaseRisk: low_risk
          urgentBypassAllowed: false
        confidence:
          minAutoCommit: 0.85
        availabilityRecovery:
          enabled: false
      vars:
        namespace: finance
        deployment: firefly-iii
        container: firefly-iii
    - name: data-importer
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: firefly-iii-data-importer
      sourceFile: firefly-iii-data-importer/deployment.yaml
      metricProfileRef: paused-zero-replica
      scaling:
        replicas: false
        cpu: false
        memory: false
      bounds:
        replicas:
          min: 0
          max: 0
        cpu:
          maxIncreasePercent: 25
          maxDecreasePercent: 10
          minChangePercent: 5
        memory:
          maxIncreasePercent: 25
          maxDecreasePercent: 10
          minChangePercent: 5
      policy:
        maxProposalsPerHour: 1
        maxProposalsPerDay: 2
        safety:
          allowAutoCommit:
            - low_risk
            - medium_risk
          maxDecreaseRisk: low_risk
          urgentBypassAllowed: false
        confidence:
          minAutoCommit: 0.85
        availabilityRecovery:
          enabled: false
      vars:
        namespace: finance
        deployment: firefly-iii-data-importer
        container: data-importer
  reconcileInterval: 5m
  metricProfiles:
    paused-zero-replica:
      description: Constant zero signals for intentionally paused workloads without Pods.
      signals:
        cpu_usage:
          required: true
          query: vector(0)
        memory_working_set:
          required: true
          query: vector(0)
        available_replicas:
          required: true
          query: vector(0)
    resource-only:
      description: Workload-scoped Kubernetes resource metrics without a demand signal.
      signals:
        cpu_usage:
          required: true
          query: |
            sum(
              rate(container_cpu_usage_seconds_total{
                namespace="{{ .namespace }}",
                container="{{ .container }}",
                image!=""
              }[5m])
              * on(namespace, pod) group_left(workload, workload_type)
                namespace_workload_pod:kube_pod_owner:relabel{
                  namespace="{{ .namespace }}",
                  workload="{{ .deployment }}",
                  workload_type="deployment"
                }
            )
        memory_working_set:
          required: true
          query: |
            sum(
              container_memory_working_set_bytes{
                namespace="{{ .namespace }}",
                container="{{ .container }}",
                image!=""
              }
              * on(namespace, pod) group_left(workload, workload_type)
                namespace_workload_pod:kube_pod_owner:relabel{
                  namespace="{{ .namespace }}",
                  workload="{{ .deployment }}",
                  workload_type="deployment"
                }
            )
        available_replicas:
          required: true
          query: |
            max(
              kube_deployment_status_replicas_available{
                namespace="{{ .namespace }}",
                deployment="{{ .deployment }}"
              }
            )
