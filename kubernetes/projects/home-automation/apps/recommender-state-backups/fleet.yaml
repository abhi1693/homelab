---
name: recommender-state-backups
defaultNamespace: cluster-ops
createNamespace: true
labels:
  app.kubernetes.io/name: recommender-state-backups
  app.kubernetes.io/part-of: state-backups
  home-lab.io/project-slug: home-automation
dependsOn:
  - name: rancher-project-home-automation
  - name: media-storage
diff:
  comparePatches:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: recommender-state-backup-nfs
      namespace: cluster-ops
      jsonPointers:
        - /spec/volumeName
helm:
  takeOwnership: true
  waitForJobs: true
  timeoutSeconds: 300
