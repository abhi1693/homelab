---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: home-assistant
  namespace: kube-system
spec:
  targetNamespace: home-assistant
  createNamespace: true
  chart: home-assistant
  repo: http://pajikos.github.io/home-assistant-helm-chart/
  version: 0.3.75
  timeout: 10m0s
  valuesContent: |-
    replicaCount: 1
    deploymentStrategy: Recreate
    controller:
      type: Deployment
    image:
      repository: registry.home/ghcr.io/home-assistant/home-assistant
      pullPolicy: IfNotPresent
      # renovate: datasource=github-releases depName=home-assistant/core
      tag: "2026.8.3"
    env:
      - name: TZ
        value: Asia/Kolkata
      - name: REQUESTS_CA_BUNDLE
        value: /etc/ssl/certs/ca-certificates.crt
      - name: HOME_ASSISTANT_SOURCE_REVISION
        value: "44589ba9200c1c7bc87c8cb444bd19001194fcef"
      - name: GO2RTC_USERNAME
        valueFrom:
          secretKeyRef:
            name: home-assistant-go2rtc
            key: username
      - name: GO2RTC_PASSWORD
        valueFrom:
          secretKeyRef:
            name: home-assistant-go2rtc
            key: password
      - name: GO2RTC_CREDENTIAL_REVISION
        value: "2026-08-20-2"
      - name: HOME_ASSISTANT_RECORDER_DB_URL
        valueFrom:
          secretKeyRef:
            name: home-assistant-postgresql
            key: database-url
      - name: SEERR_API_KEY
        valueFrom:
          secretKeyRef:
            name: home-assistant-seerr-api
            key: api-key
      - name: SEERR_API_KEY_REVISION
        value: "2026-08-13-1"
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
    ingress:
      enabled: true
      external: false
      className: traefik
      hosts:
        - host: ha.home
          paths:
            - path: /
              pathType: Prefix
      tls: []
    initContainers:
      - name: wait-for-go2rtc
        # renovate: datasource=github-releases depName=home-assistant/core
        image: registry.home/ghcr.io/home-assistant/home-assistant:2026.8.3
        imagePullPolicy: IfNotPresent
        env:
          - name: GO2RTC_USERNAME
            valueFrom:
              secretKeyRef:
                name: home-assistant-go2rtc
                key: username
          - name: GO2RTC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: home-assistant-go2rtc
                key: password
        command:
          - /bin/sh
          - -c
        args:
          - |-
            exec python3 - <<'PY'
            import base64
            import os
            import time
            import urllib.request

            endpoint = "http://home-assistant-go2rtc.home-assistant.svc.cluster.local:1984/api"
            credentials = f"{os.environ['GO2RTC_USERNAME']}:{os.environ['GO2RTC_PASSWORD']}"
            authorization = "Basic " + base64.b64encode(credentials.encode()).decode()
            request = urllib.request.Request(endpoint, headers={"Authorization": authorization})

            for attempt in range(150):
                try:
                    with urllib.request.urlopen(request, timeout=2) as response:
                        if response.status == 200:
                            print("go2rtc API ready")
                            raise SystemExit(0)
                except Exception:
                    if attempt == 149:
                        raise
                    time.sleep(2)
            PY
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            cpu: 50m
            memory: 64Mi
      - name: archive-sqlite-recorder
        # renovate: datasource=github-releases depName=home-assistant/core
        image: registry.home/ghcr.io/home-assistant/home-assistant:2026.8.3
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command:
          - /bin/sh
          - -c
        args:
          - |-
            set -eu

            marker="/config/.recorder-postgresql-cutover-20260814"
            backup_dir="/config/backups/recorder-sqlite-pre-postgresql-20260814"
            if [ -f /config/home-assistant_v2.db ] && [ ! -f "${marker}" ]; then
              mkdir -p "${backup_dir}"
              for source in /config/home-assistant_v2.db /config/home-assistant_v2.db-wal /config/home-assistant_v2.db-shm; do
                if [ -f "${source}" ]; then
                  cp -p "${source}" "${backup_dir}/"
                fi
              done
              sha256sum "${backup_dir}"/* > "${backup_dir}/SHA256SUMS"
              chmod -R go-rwx "${backup_dir}"
              touch "${marker}"
            fi
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 384Mi
        volumeMounts:
          - name: home-assistant-pvc
            mountPath: /config
      - name: build-home-lab-ca-bundle
        # renovate: datasource=github-releases depName=home-assistant/core
        image: registry.home/ghcr.io/home-assistant/home-assistant:2026.8.3
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command:
          - /bin/sh
          - -c
        args:
          - |-
            set -eu

            cp /etc/ssl/certs/ca-certificates.crt /trust/ca-certificates.crt
            cat /local-ca/ca.crt >> /trust/ca-certificates.crt
            chmod 0644 /trust/ca-certificates.crt
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
          - name: home-assistant-music-media-home-tls
            mountPath: /local-ca
            readOnly: true
          - name: home-assistant-ca-bundle
            mountPath: /trust
      - name: install-home-assistant-source
        # renovate: datasource=github-releases depName=home-assistant/core
        image: registry.home/ghcr.io/home-assistant/home-assistant:2026.8.3
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        env:
          - name: KRISHNA_WORK_COORDINATES
            valueFrom:
              secretKeyRef:
                name: home-assistant-private-locations
                key: krishna-work-coordinates
          - name: MANISHA_WORK_COORDINATES
            valueFrom:
              secretKeyRef:
                name: home-assistant-private-locations
                key: manisha-work-coordinates
        command:
          - /bin/sh
          - -c
        args:
          - |-
            set -eu
            revision="44589ba9200c1c7bc87c8cb444bd19001194fcef"
            expected_sha256="bfe2143bf027dc46bf38915c3ab91ba6dff4d98c79e3cb93f0090505c8b38687"
            archive="/tmp/home-assistant-source.tar.gz"
            source_root="/tmp/home-assistant-source"

            wget -qO "${archive}" "https://codeload.github.com/abhi1693/home-assistant/tar.gz/${revision}"
            echo "${expected_sha256}  ${archive}" | sha256sum -c -
            mkdir -p "${source_root}"
            tar -xzf "${archive}" --strip-components=1 -C "${source_root}"
            python3 "${source_root}/bootstrap.py" --source "${source_root}" --config /config
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
        volumeMounts:
          - name: home-assistant-pvc
            mountPath: /config
    configuration:
      enabled: false
    additionalVolumes:
      - name: home-assistant-music-media-home-tls
        secret:
          secretName: home-assistant-music-media-home-tls
          items:
            - key: ca.crt
              path: ca.crt
      - name: home-assistant-ca-bundle
        emptyDir: {}
    additionalMounts:
      - name: home-assistant-ca-bundle
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: ca-certificates.crt
        readOnly: true
    persistence:
      enabled: true
      accessMode: ReadWriteMany
      size: 4Gi
      storageClass: longhorn
      annotations:
        helm.sh/resource-policy: keep
    resources:
      requests:
        cpu: 25m
        memory: 576Mi
      limits:
        memory: 864Mi
    startupProbe:
      failureThreshold: 60
      httpGet:
        path: /
        port: http
        scheme: HTTP
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 2
    addons:
      codeserver:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            memory: 144Mi
        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: code.ha.home
              paths:
                - path: /
                  pathType: Prefix
          tls: []
