---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-assistant-music-media-home
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: home-automation
    home-lab.io/project-slug: home-automation
spec:
  secretName: home-assistant-music-media-home-tls
  commonName: music.media.home
  dnsNames:
    - music.media.home
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
  issuerRef:
    name: home-local-ca
    kind: ClusterIssuer
    group: cert-manager.io
