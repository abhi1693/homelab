cloudflare:
  secretRef:
    name: cloudflare-tunnel-ingress-controller
    accountIDKey: cloudflare-account-id
    tunnelNameKey: cloudflare-tunnel-name
    apiTokenKey: api-token
ingressClass:
  name: cloudflare-tunnel
  controllerValue: strrl.dev/cloudflare-tunnel-ingress-controller
  isDefaultClass: false
replicaCount: 2
leaderElection:
  enabled: true
image:
  repository: registry.home/cr.strrl.dev/strrl/cloudflare-tunnel-ingress-controller
  pullPolicy: IfNotPresent
  # renovate: datasource=github-releases depName=STRRL/cloudflare-tunnel-ingress-controller
  tag: 0.1.0
imagePullSecrets:
  - name: harbor-registry
cloudflared:
  replicaCount: 2
  protocol: http2
  podAntiAffinity: true
  nodeSelector:
    kubernetes.io/arch: arm64
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoExecute
  image:
    repository: registry.home/docker.io/cloudflare/cloudflared
    pullPolicy: IfNotPresent
    # renovate: datasource=github-releases depName=cloudflare/cloudflared
    tag: 2026.8.3
  podSecurityContext:
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
  probes:
    readiness:
      httpGet:
        path: /ready
        port: 44483
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 40m
      memory: 48Mi
    limits:
      memory: 112Mi
cloudflaredServiceMonitor:
  create: true
  interval: 30s
  scrapeTimeout: 10s
nodeSelector:
  kubernetes.io/arch: arm64
  node-role.kubernetes.io/control-plane: "true"
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoExecute
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudflare-tunnel-ingress-controller
            app.kubernetes.io/instance: cloudflare-tunnel-ingress-controller
        topologyKey: kubernetes.io/hostname
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 112Mi
