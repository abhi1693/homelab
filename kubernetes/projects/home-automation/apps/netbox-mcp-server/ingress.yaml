---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netbox-mcp-server
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox-mcp-server
    app.kubernetes.io/part-of: netbox
    home-lab.io/project-slug: home-automation
spec:
  ingressClassName: traefik
  rules:
    - host: netbox.mcp.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netbox-mcp-server
                port:
                  name: http
  tls:
    - hosts:
        - netbox.mcp.home
      secretName: netbox-mcp-server-home-tls
