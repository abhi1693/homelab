---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.sops.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
patches:
  - target:
      kind: NetworkPolicy
      name: controlled-cloudflared-connector-home-assistant-mobile-webhook-egress
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: cloudflare
