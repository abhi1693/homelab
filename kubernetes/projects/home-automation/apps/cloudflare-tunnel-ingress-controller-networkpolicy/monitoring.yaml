---
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-tunnel-ingress-controller-metrics
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflare-tunnel-ingress-controller
    app.kubernetes.io/component: controller-metrics
    app.kubernetes.io/part-of: cloudflare
    home-lab.io/project-slug: home-automation
spec:
  selector:
    app.kubernetes.io/name: cloudflare-tunnel-ingress-controller
    app.kubernetes.io/instance: cloudflare-tunnel-ingress-controller
  ports:
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflare-tunnel-ingress-controller-metrics
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: cloudflare-tunnel-ingress-controller
    app.kubernetes.io/component: controller-metrics
    app.kubernetes.io/part-of: cloudflare
    home-lab.io/project-slug: home-automation
spec:
  namespaceSelector:
    matchNames:
      - cloudflare
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-tunnel-ingress-controller
      app.kubernetes.io/component: controller-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
