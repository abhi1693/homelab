---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbox-upgrade-backup
  namespace: netbox
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: upgrade-backup}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: postgresql}
          podSelector:
            matchLabels: {cnpg.io/cluster: postgresql}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
