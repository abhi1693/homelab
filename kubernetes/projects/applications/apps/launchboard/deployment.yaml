---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: launchboard
  namespace: launchboard
  labels:
    app.kubernetes.io/name: launchboard
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: launchboard
spec:
  revisionHistoryLimit: 2
  replicas: 1
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app.kubernetes.io/name: launchboard
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        launchboard.win/secret-revision: "ga-sales-v1"
      labels:
        app.kubernetes.io/name: launchboard
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: launchboard
        launchboard-psql-client: "true"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          # renovate: datasource=github-releases depName=abhi1693/launchboard.win
          image: registry.home/ghcr.io/abhi1693/launchboard.win:0.1.10
          imagePullPolicy: IfNotPresent
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: launchboard
            - secretRef:
                name: launchboard
          env:
            - name: PG_APPLICATION_NAME
              value: launchboard-migration
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
      containers:
        - name: web
          # renovate: datasource=github-releases depName=abhi1693/launchboard.win
          image: registry.home/ghcr.io/abhi1693/launchboard.win:0.1.10
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: launchboard
            - secretRef:
                name: launchboard
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=1536
            - name: PG_APPLICATION_NAME
              value: launchboard-web
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              ephemeral-storage: 1Gi
              memory: 512Mi
            limits:
              ephemeral-storage: 4Gi
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
