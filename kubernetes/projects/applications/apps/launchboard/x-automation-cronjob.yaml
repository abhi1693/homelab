apiVersion: batch/v1
kind: CronJob
metadata:
  name: launchboard-x-automation
  namespace: launchboard
  labels:
    app.kubernetes.io/name: launchboard
    app.kubernetes.io/component: x-automation
    app.kubernetes.io/part-of: launchboard
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: launchboard
            app.kubernetes.io/component: x-automation
            app.kubernetes.io/part-of: launchboard
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: arm64
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: harbor-registry
          containers:
            - name: trigger
              # renovate: datasource=github-releases depName=curl/curl-container
              image: registry.home/docker.io/curlimages/curl:8.22.0
              imagePullPolicy: IfNotPresent
              env:
                - name: X_AUTOMATION_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: launchboard
                      key: X_AUTOMATION_SECRET
              args:
                - -fsS
                - --max-time
                - "30"
                - -X
                - POST
                - -H
                - "Authorization: Bearer $(X_AUTOMATION_SECRET)"
                - http://launchboard.launchboard.svc.cluster.local:3000/api/automation/x
              resources:
                requests:
                  cpu: 2m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 101
