---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-launchboard-pooler-access
  namespace: postgresql
  labels:
    app.kubernetes.io/name: postgresql-pooler
    app.kubernetes.io/part-of: postgresql
    home-lab.io/client: launchboard
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: postgresql-pooler-launchboard-rw
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: launchboard
          podSelector:
            matchLabels:
              launchboard-psql-client: "true"
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-launchboard-direct-access
  namespace: postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: postgresql
    home-lab.io/client: launchboard
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgresql
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: launchboard
          podSelector:
            matchLabels:
              launchboard-psql-client: "true"
      ports:
        - protocol: TCP
          port: 5432
