---
apiVersion: batch/v1
kind: Job
metadata:
  name: devfeed-migrate
  namespace: devfeed
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: devfeed-migrate
    app.kubernetes.io/part-of: devfeed
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 840
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devfeed-migrate
        app.kubernetes.io/part-of: devfeed
        devfeed-database-client: 'true'
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
        - name: migrate
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.1.1@sha256:607c540414d8c218835b4ac447a5f84143acef1f97ac747867778db178583268
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - python
            - -c
            - |
              from sqlalchemy import event
              from devfeed_core.db import get_engine
              from devfeed_cli.main import run

              def migration_connection(connection, _record):
                  autocommit = connection.autocommit
                  connection.autocommit = True
                  try:
                      with connection.cursor() as cursor:
                          cursor.execute("SET statement_timeout = '600s'")
                          cursor.execute("SET lock_timeout = '30s'")
                  finally:
                      connection.autocommit = autocommit

              # Run after the application's normal 30-second connect listener.
              # Only this short-lived migration process gets the larger budget.
              event.listen(get_engine(), "connect", migration_connection)
              raise SystemExit(run(["db", "upgrade"]))
          envFrom:
            - configMapRef:
                name: devfeed
            - secretRef:
                name: devfeed-database
          env:
            - name: DEVFEED_TOPIC_KIND_MAP_PATH
              value: /etc/devfeed/topic-kind-map.json
            - name: DEVFEED_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devfeed-database
                  key: DEVFEED_DIRECT_DATABASE_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: topic-kind-map
              mountPath: /etc/devfeed
              readOnly: true
      volumes:
        - name: topic-kind-map
          configMap:
            name: devfeed-topic-kind-map
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      restartPolicy: Never
