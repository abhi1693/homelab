---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfeed-worker-low
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-worker-low
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devfeed-worker-low
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        devfeed.tech/ai-models: 2026-09-27-gpt-6-luna-astra
        devfeed.tech/feed-max-bytes: '20000000'
        devfeed.tech/quota-pacing: weekly-reserve-20
        devfeed.tech/ai-content-not-before: disabled
        devfeed.tech/topic-call-budget: '40000'
      labels:
        devfeed-telemetry: 'true'
        app.kubernetes.io/name: devfeed-worker-low
        app.kubernetes.io/part-of: devfeed
        devfeed-database-client: 'true'
        devfeed-redis-client: 'true'
        devfeed-codex-client: 'true'
        devfeed-clickhouse-client: 'true'
        devfeed.tech/cpu-worker: 'true'
        devfeed-inbox-client: 'true'
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 1560
      containers:
      - name: low-worker
        # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
        image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.1.8@sha256:1fb3087acd900c6e18cef096df53ae34d19d6226bba58531324f2dcb3786ca3e
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9100
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: devfeed-telemetry
        - configMapRef:
            name: devfeed
        - secretRef:
            name: devfeed-database
        - configMapRef:
            name: devfeed-automation
        - secretRef:
            name: devfeed-codex
        - configMapRef:
            name: devfeed-clickhouse-client
        - secretRef:
            name: devfeed-clickhouse-worker
        env:
        - name: DEVFEED_WORKER_HEALTH_PATH
          value: /tmp/devfeed-worker-health
        - name: DEVFEED_DATABASE_POOL_ENABLED
          value: 'false'
        - name: DEVFEED_WORKER_QUEUE
          value: low
        - name: DEVFEED_CODEX_APP_SERVER_URL
          value: wss://devfeed-codex.devfeed.svc.cluster.local:4501
        - name: SSL_CERT_FILE
          value: /run/ca/ca-bundle.crt
        volumeMounts:
        - name: ca-bundle
          mountPath: /run/ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: devfeed-inbox-worker
          mountPath: /run/devfeed-chimely
          readOnly: true
        - name: devfeed-inbox-scripts
          mountPath: /opt/devfeed
          readOnly: true
        readinessProbe:
          exec:
            command:
            - devfeed-worker-health
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - devfeed-worker-health
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          initialDelaySeconds: 60
        command:
        - python
        - /opt/devfeed/consumer.py
        - worker
        - sh
        - -ec
        - |
          worker_name="$HOSTNAME-$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          python -c 'import sys; from devfeed_core.runtime_files import runtime_marker, write_runtime_marker; write_runtime_marker(runtime_marker("worker-name"), sys.argv[1])' "$worker_name"
          exec devfeed-worker --queue "$DEVFEED_WORKER_QUEUE" --name "$worker_name"
        startupProbe:
          exec:
            command:
            - devfeed-worker-health
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: codex-ca
        secret:
          secretName: devfeed-codex-tls
          items:
          - key: ca.crt
            path: ca.crt
      - name: ca-bundle
        emptyDir: {}
      - name: devfeed-inbox-worker
        persistentVolumeClaim:
          claimName: devfeed-inbox-worker
      - name: devfeed-inbox-scripts
        configMap:
          name: devfeed-inbox-scripts
      initContainers:
      - name: trust-codex-ca
        # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
        image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.1.8@sha256:1fb3087acd900c6e18cef096df53ae34d19d6226bba58531324f2dcb3786ca3e
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: codex-ca
          mountPath: /run/codex-ca
          readOnly: true
        - name: ca-bundle
          mountPath: /run/ca
        command:
        - python
        - -c
        - from pathlib import Path; Path('/run/ca/ca-bundle.crt').write_bytes(Path('/etc/ssl/certs/ca-certificates.crt').read_bytes()+b'\n'+Path('/run/codex-ca/ca.crt').read_bytes())
      - name: wait-for-inbox
        # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
        image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.1.8@sha256:1fb3087acd900c6e18cef096df53ae34d19d6226bba58531324f2dcb3786ca3e
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: devfeed-inbox-worker
          mountPath: /run/devfeed-chimely
          readOnly: true
        command:
        - python
        - -c
        - |-
          import time; from pathlib import Path
          for _ in range(180):
           if Path('/run/devfeed-chimely/credentials.json').is_file(): break
           time.sleep(5)
          else: raise SystemExit('Inbox provisioning not ready')
      - name: wait-for-schema
        # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
        image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.1.8@sha256:1fb3087acd900c6e18cef096df53ae34d19d6226bba58531324f2dcb3786ca3e
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        envFrom:
        - configMapRef:
            name: devfeed
        - secretRef:
            name: devfeed-database
        env:
        - name: DEVFEED_DATABASE_POOL_ENABLED
          value: 'false'
        command:
        - python
        - -c
        - |
          import time
          from sqlalchemy import text
          from devfeed_core.db import get_engine
          from devfeed_core.version import SCHEMA_REVISION, BACKWARD_COMPATIBLE_SCHEMA_REVISIONS
          for attempt in range(180):
              try:
                  with get_engine().connect() as connection:
                      if connection.execute(text("SELECT version_num FROM alembic_version")).scalar() in {SCHEMA_REVISION, *BACKWARD_COMPATIBLE_SCHEMA_REVISIONS}:
                          print("Database schema ready", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit("Timed out waiting for release schema")
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: devfeed-worker-low
            app.kubernetes.io/part-of: devfeed
