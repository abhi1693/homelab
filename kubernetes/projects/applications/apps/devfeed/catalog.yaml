---
apiVersion: home-lab.io/v1alpha1
kind: WorkloadCatalog
metadata:
  name: devfeed
spec:
  displayName: DevFeed
  purpose: Aggregate developer news, run reviewed full automation, and serve separate reader and administration apps.
  owner: home-lab
  project: applications
  cluster: home-k3s
  lifecycle: active
  criticality: medium
  dataClassification: internal
  repository: https://github.com/abhi1693/devfeed.tech
  gitPath: kubernetes/projects/applications/apps/devfeed
  workloads:
    - key: home-k3s/devfeed/apps/deployment/devfeed-imgproxy
      namespace: devfeed
      apiGroup: apps
      kind: Deployment
      name: devfeed-imgproxy
      desiredReplicas: 1
      sourcePath: kubernetes/projects/applications/apps/devfeed/deployment-imgproxy.yaml
