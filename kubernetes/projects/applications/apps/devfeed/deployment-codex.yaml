---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfeed-codex
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-codex
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devfeed-codex
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devfeed-codex
        app.kubernetes.io/part-of: devfeed
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
        - name: codex
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/codex
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/codex:0.0.40@sha256:843e5df8b8829b997f3500c7384c134cf188b28e58e4085b107661ba973379b2
          imagePullPolicy: IfNotPresent
          args:
            - app-server
            - --listen
            - ws://127.0.0.1:4500
            - -c
            - history.persistence="none"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: devfeed-codex
          env:
            - name: CODEX_SQLITE_HOME
              value: /var/lib/codex-runtime
            - name: RUST_LOG
              value: codex_app_server=info,codex_core=warn,codex_api=warn,codex_models_manager=warn,rmcp=warn,warn
            - name: DEVFEED_CODEX_TLS_CERT
              value: /run/tls/tls.crt
            - name: DEVFEED_CODEX_TLS_KEY
              value: /run/tls/tls.key
          ports:
            - containerPort: 4501
          volumeMounts:
            - name: devfeed-codex-home
              mountPath: /var/lib/codex
            - name: codex-runtime
              mountPath: /var/lib/codex-runtime
            - name: tls
              mountPath: /run/tls
              readOnly: true
            - name: codex-socket
              mountPath: /run/codex
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - node
                - /opt/devfeed/health.cjs
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - /opt/devfeed/health.cjs
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            exec:
              command:
                - node
                - /opt/devfeed/health.cjs
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
        - name: log-retention
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/codex
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/codex:0.0.40@sha256:843e5df8b8829b997f3500c7384c134cf188b28e58e4085b107661ba973379b2
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /opt/codex-runtime/retention.cjs
            - /var/lib/codex-runtime
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: codex-runtime
              mountPath: /var/lib/codex-runtime
            - name: codex-runtime-scripts
              mountPath: /opt/codex-runtime
              readOnly: true
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "process.exit(Date.now() - Number(require('node:fs').readFileSync('/var/lib/codex-runtime/.retention-health', 'utf8')) < 90000 ? 0 : 1)"
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "process.exit(Date.now() - Number(require('node:fs').readFileSync('/var/lib/codex-runtime/.retention-health', 'utf8')) < 90000 ? 0 : 1)"
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: codex-runtime
          emptyDir:
            sizeLimit: 512Mi
        - name: codex-runtime-scripts
          configMap:
            name: devfeed-codex-runtime
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: devfeed-codex-home
          persistentVolumeClaim:
            claimName: devfeed-codex-home
        - name: tls
          secret:
            secretName: devfeed-codex-tls
            defaultMode: 288
        - name: codex-socket
          emptyDir: {}
      initContainers:
        - name: remove-legacy-logs
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/codex
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/codex:0.0.40@sha256:843e5df8b8829b997f3500c7384c134cf188b28e58e4085b107661ba973379b2
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /opt/codex-runtime/retention.cjs
            - --cleanup-legacy
            - /var/lib/codex
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: devfeed-codex-home
              mountPath: /var/lib/codex
            - name: codex-runtime-scripts
              mountPath: /opt/codex-runtime
              readOnly: true
        - name: chatgpt-login
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/codex
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/codex:0.0.40@sha256:843e5df8b8829b997f3500c7384c134cf188b28e58e4085b107661ba973379b2
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEX_SQLITE_HOME
              value: /var/lib/codex-runtime
            - name: RUST_LOG
              value: warn
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: devfeed-codex-home
              mountPath: /var/lib/codex
            - name: codex-runtime
              mountPath: /var/lib/codex-runtime
            - name: tmp
              mountPath: /tmp
          command:
            - sh
            - -ec
            - if test -s /var/lib/codex/auth.json; then exit 0; fi; exec codex login --device-auth
