---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfeed-codex
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-codex
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devfeed-codex
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devfeed-codex
        app.kubernetes.io/part-of: devfeed
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
        - name: codex
          # renovate: datasource=github-releases depName=abhi1693/devfeed.tech
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/codex:0.0.20@sha256:af5774360fe5e925c355b6d999780fcf349df377deadad6baa0da172a9dd51f3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: devfeed-codex
          env:
            - name: DEVFEED_CODEX_TLS_CERT
              value: /run/tls/tls.crt
            - name: DEVFEED_CODEX_TLS_KEY
              value: /run/tls/tls.key
          ports:
            - containerPort: 4501
          volumeMounts:
            - name: devfeed-codex-home
              mountPath: /var/lib/codex
            - name: tls
              mountPath: /run/tls
              readOnly: true
            - name: codex-socket
              mountPath: /run/codex
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - node
                - /opt/devfeed/health.cjs
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - /opt/devfeed/health.cjs
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            exec:
              command:
                - node
                - /opt/devfeed/health.cjs
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: devfeed-codex-home
          persistentVolumeClaim:
            claimName: devfeed-codex-home
        - name: tls
          secret:
            secretName: devfeed-codex-tls
            defaultMode: 288
        - name: codex-socket
          emptyDir: {}
      initContainers:
        - name: chatgpt-login
          # renovate: datasource=github-releases depName=abhi1693/devfeed.tech
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/codex:0.0.20@sha256:af5774360fe5e925c355b6d999780fcf349df377deadad6baa0da172a9dd51f3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: devfeed-codex-home
              mountPath: /var/lib/codex
            - name: tmp
              mountPath: /tmp
          command:
            - sh
            - -ec
            - if test -s /var/lib/codex/auth.json; then exit 0; fi; exec codex login --device-auth
