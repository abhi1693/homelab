---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfeed-user-api
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-user-api
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devfeed-user-api
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        devfeed.tech/oidc-providers: '2026-09-28-shared-github-google'
        devfeed.tech/feed-max-bytes: '20000000'
        devfeed.tech/ai-content-not-before: 'disabled'
      labels:
        devfeed-telemetry: 'true'
        app.kubernetes.io/name: devfeed-user-api
        app.kubernetes.io/part-of: devfeed
        devfeed-database-client: 'true'
        devfeed-redis-client: 'true'
        devfeed-inbox-client: 'true'
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: devfeed-user-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
        - name: user-api
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/user-api
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/user-api:0.0.45@sha256:120ab0f88baaaeff79b357b8e45ccca7ced1cc9d9544966090c5196491eda13c
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: devfeed-telemetry
            - configMapRef:
                name: devfeed
            - secretRef:
                name: devfeed-database
            - configMapRef:
                name: devfeed-user
            - configMapRef:
                name: devfeed-oidc-providers
          env:
            - name: DEVFEED_USER_MCP_RESOURCE_URL
              value: https://mcp.devfeed.tech/mcp
            - name: DEVFEED_USER_MCP_ISSUER_URL
              value: https://mcp.devfeed.tech
            - name: DEVFEED_USER_EXTENSION_IDS
              value: '["hliakjocndflpkmfajndigbpngfcekdm","iihaipjedchahiehignbngclgpklbddo"]'
          volumeMounts:
            - name: devfeed-inbox-user
              mountPath: /run/devfeed-chimely
              readOnly: true
            - name: devfeed-inbox-scripts
              mountPath: /opt/devfeed
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - name: metrics
              containerPort: 9100
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          command:
            - python
            - /opt/devfeed/consumer.py
            - user
            - uvicorn
            - devfeed_user_api.main:app
            - --host
            - 0.0.0.0
            - --port
            - '8002'
            - --no-proxy-headers
            - --no-access-log
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: devfeed-inbox-user
          persistentVolumeClaim:
            claimName: devfeed-inbox-user
        - name: devfeed-inbox-scripts
          configMap:
            name: devfeed-inbox-scripts
      initContainers:
        - name: wait-for-inbox
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/user-api
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/user-api:0.0.45@sha256:120ab0f88baaaeff79b357b8e45ccca7ced1cc9d9544966090c5196491eda13c
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: devfeed-inbox-user
              mountPath: /run/devfeed-chimely
              readOnly: true
          command:
            - python
            - -c
            - |-
              import time; from pathlib import Path
              for _ in range(180):
               if Path('/run/devfeed-chimely/credentials.json').is_file(): break
               time.sleep(5)
              else: raise SystemExit('Inbox provisioning not ready')
        - name: wait-for-schema
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.0.45@sha256:60e3cf4fa8368b808c1cf2fc2fbc70ef8a042f69913e7f5367fa9a476d370b1e
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: devfeed
            - secretRef:
                name: devfeed-database
          env:
            - name: DEVFEED_DATABASE_POOL_ENABLED
              value: 'false'
          command:
            - python
            - -c
            - |
              import time
              from sqlalchemy import text
              from devfeed_core.db import get_engine
              from devfeed_core.version import SCHEMA_REVISION, BACKWARD_COMPATIBLE_SCHEMA_REVISIONS
              for attempt in range(180):
                  try:
                      with get_engine().connect() as connection:
                          if connection.execute(text("SELECT version_num FROM alembic_version")).scalar() in {SCHEMA_REVISION, *BACKWARD_COMPATIBLE_SCHEMA_REVISIONS}:
                              print("Database schema ready", flush=True)
                              break
                  except Exception:
                      pass
                  time.sleep(5)
              else:
                  raise SystemExit("Timed out waiting for release schema")
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: devfeed-user-api
              app.kubernetes.io/part-of: devfeed
