---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfeed-mcp
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-mcp
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devfeed-mcp
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devfeed-mcp
        app.kubernetes.io/part-of: devfeed
        devfeed-redis-client: 'true'
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: devfeed-mcp
            topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: mcp
        # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/mcp
        image: registry.home/ghcr.io/abhi1693/devfeed.tech/mcp:0.0.45@sha256:6fbb26ac25b6cc840f812d7fb333b045d21c8551cdf5c8ffb6a2605910e136d4
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8003
        env:
        - name: DEVFEED_MCP_API_URL
          value: http://devfeed-api:8000
        - name: DEVFEED_MCP_USER_API_URL
          value: http://user-api:8002
        - name: DEVFEED_MCP_PUBLIC_URL
          value: https://mcp.devfeed.tech/mcp
        - name: DEVFEED_MCP_OAUTH_ISSUER_URL
          value: https://mcp.devfeed.tech
        - name: DEVFEED_MCP_WEB_URL
          value: https://devfeed.tech
        - name: DEVFEED_MCP_REDIS_URL
          value: redis://valkey-primary.valkey.svc.cluster.local:6379/10
        - name: DEVFEED_MCP_ALLOWED_HOSTS
          value: '["mcp.devfeed.tech"]'
        - name: DEVFEED_MCP_ALLOWED_ORIGINS
          value: '["https://devfeed.tech"]'
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: tmp
        emptyDir: {}
