---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devfeed-default-deny
  namespace: devfeed
  labels:
    app.kubernetes.io/part-of: devfeed
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devfeed-dns
  namespace: devfeed
  labels:
    app.kubernetes.io/part-of: devfeed
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
