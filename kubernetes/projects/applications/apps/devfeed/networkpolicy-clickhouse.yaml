---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devfeed-clickhouse-clients
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-clickhouse-clients
    app.kubernetes.io/part-of: devfeed
spec:
  podSelector:
    matchLabels:
      devfeed-clickhouse-client: 'true'
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: clickhouse
      podSelector:
        matchLabels:
          app.kubernetes.io/name: clickhouse
    ports:
    - protocol: TCP
      port: 8123
    - protocol: TCP
      port: 9000
