---
apiVersion: batch/v1
kind: Job
metadata:
  name: devfeed-topic-logo-backfill-0044
  namespace: devfeed
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: '10'
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app.kubernetes.io/name: devfeed-topic-logo-backfill-0044
    app.kubernetes.io/part-of: devfeed
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devfeed-topic-logo-backfill-0044
        app.kubernetes.io/part-of: devfeed
        devfeed-database-client: 'true'
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
        - name: backfill
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.0.44@sha256:1c9907b72e3b0d025262e141c32b6d4421c0061a4d1a9219461d30d9544d97f7
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - python
            - -c
            - |
              from devfeed_core.db import session_factory
              from devfeed_core.topic_logos import backfill_topic_logos
              total = 0
              while True:
                  with session_factory().begin() as session:
                      count = len(backfill_topic_logos(session, limit=500))
                  total += count
                  if not count:
                      break
              print(f"Queued {total} topic logo imports; Images workers own processing", flush=True)
          envFrom:
            - configMapRef:
                name: devfeed
            - secretRef:
                name: devfeed-database
          env:
            - name: DEVFEED_DATABASE_POOL_ENABLED
              value: 'false'
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      restartPolicy: Never
