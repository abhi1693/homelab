---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chimely
  namespace: devfeed
  labels:
    app.kubernetes.io/name: chimely
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chimely
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chimely
        app.kubernetes.io/part-of: devfeed
        devfeed-database-client: 'true'
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
        - name: chimely
          # renovate: datasource=docker depName=ghcr.io/dodopayments/chimely
          image: registry.home/ghcr.io/dodopayments/chimely:0.2.2@sha256:9a0f49ff99c3f7a587e8e2348379b0645306eb919bdb83ff54bf6cf900526a60
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: devfeed-chimely
          env:
            - name: CHIMELY_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: CHIMELY_ADMIN_TLS_TERMINATED
              value: 'false'
            - name: CHIMELY_IDEMPOTENCY_RETENTION_DAYS
              value: '30'
            - name: CHIMELY_SSE_PING_SECS
              value: '10'
            - name: CHIMELY_LOG_FORMAT
              value: json
            - name: RUST_LOG
              value: info
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
