---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devfeed-codex-home
  namespace: devfeed
  labels:
    app.kubernetes.io/part-of: devfeed
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devfeed-inbox-worker
  namespace: devfeed
  labels:
    app.kubernetes.io/part-of: devfeed
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-shared-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
