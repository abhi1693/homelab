---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfeed-worker-notification
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-worker-notification
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devfeed-worker-notification
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        devfeed.tech/ai-content-not-before: 'disabled'
      labels:
        devfeed-telemetry: 'true'
        app.kubernetes.io/name: devfeed-worker-notification
        devfeed.tech/cpu-worker: "true"
        app.kubernetes.io/part-of: devfeed
        devfeed-database-client: 'true'
        devfeed-redis-client: 'true'
        devfeed-inbox-client: 'true'
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
        - name: notification-worker
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.0.40@sha256:42b8ba3a03a95d0e5f1e7cf4a74b0a29863b87f16aade5e69d742f0a018b2111
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 400m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: devfeed-telemetry
            - configMapRef:
                name: devfeed
            - secretRef:
                name: devfeed-database
          env:
            - name: DEVFEED_WORKER_HEALTH_PATH
              value: /tmp/devfeed-worker-health.json
            - name: DEVFEED_DATABASE_POOL_ENABLED
              value: 'false'
            - name: DEVFEED_WORKER_QUEUE
              value: notifications
            - name: DEVFEED_AI_ENABLED
              value: 'false'
          volumeMounts:
            - name: devfeed-inbox-worker
              mountPath: /run/devfeed-chimely
              readOnly: true
            - name: devfeed-inbox-scripts
              mountPath: /opt/devfeed
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - devfeed_core.worker_health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - devfeed_core.worker_health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 60
          command:
            - python
            - /opt/devfeed/consumer.py
            - worker
            - sh
            - -ec
            - |-
              worker_name="$HOSTNAME-$(python -c 'import uuid; print(uuid.uuid4().hex)')"
              printf %s "$worker_name" > /tmp/devfeed-worker-notification-name
              exec devfeed worker --queue "$DEVFEED_WORKER_QUEUE" --name "$worker_name"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: devfeed-inbox-worker
          persistentVolumeClaim:
            claimName: devfeed-inbox-worker
        - name: devfeed-inbox-scripts
          configMap:
            name: devfeed-inbox-scripts
      initContainers:
        - name: wait-for-inbox
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.0.40@sha256:42b8ba3a03a95d0e5f1e7cf4a74b0a29863b87f16aade5e69d742f0a018b2111
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: devfeed-inbox-worker
              mountPath: /run/devfeed-chimely
              readOnly: true
          command:
            - python
            - -c
            - |-
              import time; from pathlib import Path
              for _ in range(180):
               if Path('/run/devfeed-chimely/credentials.json').is_file(): break
               time.sleep(5)
              else: raise SystemExit('Inbox provisioning not ready')
        - name: wait-for-schema
          # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
          image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.0.40@sha256:42b8ba3a03a95d0e5f1e7cf4a74b0a29863b87f16aade5e69d742f0a018b2111
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: devfeed
            - secretRef:
                name: devfeed-database
          env:
            - name: DEVFEED_DATABASE_POOL_ENABLED
              value: 'false'
          command:
            - python
            - -c
            - |
              import time
              from sqlalchemy import text
              from devfeed_core.db import get_engine
              from devfeed_core.version import SCHEMA_REVISION, BACKWARD_COMPATIBLE_SCHEMA_REVISIONS
              for attempt in range(180):
                  try:
                      with get_engine().connect() as connection:
                          if connection.execute(text("SELECT version_num FROM alembic_version")).scalar() in {SCHEMA_REVISION, *BACKWARD_COMPATIBLE_SCHEMA_REVISIONS}:
                              print("Database schema ready", flush=True)
                              break
                  except Exception:
                      pass
                  time.sleep(5)
              else:
                  raise SystemExit("Timed out waiting for release schema")
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                namespaces:
                  - postgresql
                labelSelector:
                  matchLabels:
                    cnpg.io/cluster: postgresql
                    cnpg.io/instanceRole: primary
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              devfeed.tech/cpu-worker: "true"
