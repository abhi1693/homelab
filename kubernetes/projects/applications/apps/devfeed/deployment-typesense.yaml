---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfeed-typesense
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-typesense
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devfeed-typesense
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devfeed-typesense
        app.kubernetes.io/part-of: devfeed
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 180
      containers:
        - name: typesense
          # renovate: datasource=docker depName=typesense/typesense
          image: registry.home/docker.io/typesense/typesense:30.2-arm64-lg-page16@sha256:1b0f300a40eecc35b974c41d0bcda408417f318034d2a48747a62f2a5a84a6e1
          imagePullPolicy: IfNotPresent
          args:
            - --data-dir=/data
          env:
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devfeed-search-admin
                  key: DEVFEED_SEARCH_ADMIN_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8108
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: devfeed-search-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
