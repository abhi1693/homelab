---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devfeed-observability-exporter
  namespace: devfeed
  labels:
    app.kubernetes.io/name: devfeed-observability-exporter
    app.kubernetes.io/part-of: devfeed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devfeed-observability-exporter
      app.kubernetes.io/part-of: devfeed
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        devfeed.tech/ai-models: "2026-09-27-gpt-6-luna-astra"
        devfeed.tech/quota-pacing: "weekly-reserve-20"
        devfeed.tech/ai-content-not-before: 'disabled'
      labels:
        devfeed-telemetry: 'true'
        app.kubernetes.io/name: devfeed-observability-exporter
        app.kubernetes.io/part-of: devfeed
        devfeed-database-client: 'true'
        devfeed-redis-client: 'true'
        devfeed-codex-client: 'true'
    spec:
      serviceAccountName: devfeed
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: exporter
        # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
        image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.0.44@sha256:1c9907b72e3b0d025262e141c32b6d4421c0061a4d1a9219461d30d9544d97f7
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9100
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 384Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: devfeed-telemetry
        - configMapRef:
            name: devfeed
        - secretRef:
            name: devfeed-database
        - configMapRef:
            name: devfeed-automation
        - secretRef:
            name: devfeed-codex
        env:
        - name: DEVFEED_DATABASE_POOL_ENABLED
          value: 'false'
        - name: DEVFEED_CODEX_APP_SERVER_URL
          value: wss://devfeed-codex.devfeed.svc.cluster.local:4501
        - name: SSL_CERT_FILE
          value: /run/ca/ca-bundle.crt
        volumeMounts:
        - name: ca-bundle
          mountPath: /run/ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        command:
        - python
        - -m
        - devfeed_core.observability_exporter
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: codex-ca
        secret:
          secretName: devfeed-codex-tls
          items:
          - key: ca.crt
            path: ca.crt
      - name: ca-bundle
        emptyDir: {}
      initContainers:
      - name: trust-codex-ca
        # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
        image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.0.44@sha256:1c9907b72e3b0d025262e141c32b6d4421c0061a4d1a9219461d30d9544d97f7
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: codex-ca
          mountPath: /run/codex-ca
          readOnly: true
        - name: ca-bundle
          mountPath: /run/ca
        command:
        - python
        - -c
        - from pathlib import Path; Path('/run/ca/ca-bundle.crt').write_bytes(Path('/etc/ssl/certs/ca-certificates.crt').read_bytes()+b'\n'+Path('/run/codex-ca/ca.crt').read_bytes())
      - name: wait-for-schema
        # renovate: datasource=docker depName=ghcr.io/abhi1693/devfeed.tech/backend
        image: registry.home/ghcr.io/abhi1693/devfeed.tech/backend:0.0.44@sha256:1c9907b72e3b0d025262e141c32b6d4421c0061a4d1a9219461d30d9544d97f7
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        envFrom:
        - configMapRef:
            name: devfeed
        - secretRef:
            name: devfeed-database
        env:
        - name: DEVFEED_DATABASE_POOL_ENABLED
          value: 'false'
        command:
        - python
        - -c
        - "import time\nfrom sqlalchemy import text\nfrom devfeed_core.db import get_engine\nfrom devfeed_core.version\
          \ import SCHEMA_REVISION\nfor attempt in range(180):\n    try:\n        with get_engine().connect() as\
          \ connection:\n            if connection.execute(text(\"SELECT version_num FROM alembic_version\")).scalar()\
          \ == SCHEMA_REVISION:\n                print(\"Database schema ready\", flush=True)\n                break\n\
          \    except Exception:\n        pass\n    time.sleep(5)\nelse:\n    raise SystemExit(\"Timed out waiting\
          \ for release schema\")\n"
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: devfeed-observability-exporter
            app.kubernetes.io/part-of: devfeed
