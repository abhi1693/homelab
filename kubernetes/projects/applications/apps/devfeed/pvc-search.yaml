---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devfeed-search-data
  namespace: devfeed
  labels:
    app.kubernetes.io/part-of: devfeed
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
