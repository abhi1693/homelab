---
apiVersion: batch/v1
kind: Job
metadata:
  name: hyperlocal-kitchen-migrate-168f2c8
  namespace: hyperlocal-kitchen
  labels:
    app.kubernetes.io/part-of: hyperlocal-kitchen
spec:
  suspend: true
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: hyperlocal-kitchen
        app.kubernetes.io/name: hyperlocal-kitchen-migrate-168f2c8
        hyperlocal-kitchen-database-client: 'true'
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      restartPolicy: Never
      containers:
        - name: migrate
          # renovate: datasource=docker depName=ghcr.io/abhi1693/hyperlocal-kitchen/backend
          image: registry.home/ghcr.io/abhi1693/hyperlocal-kitchen/backend:sha-168f2c82c842f2a368b35bd796c3f240c3b1170e@sha256:dc9b981addbaab540b7ad76b57760c9b571099ced8219ef1d7f00317d166b56c
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: hyperlocal-kitchen
            - secretRef:
                name: hyperlocal-kitchen
          env:
            - name: KITCHEN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hyperlocal-kitchen
                  key: KITCHEN_DIRECT_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
