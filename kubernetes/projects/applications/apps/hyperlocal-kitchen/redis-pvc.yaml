---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hyperlocal-kitchen-redis
  namespace: hyperlocal-kitchen
  labels:
    app.kubernetes.io/part-of: hyperlocal-kitchen
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
