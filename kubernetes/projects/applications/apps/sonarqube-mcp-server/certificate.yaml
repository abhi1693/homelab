---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sonarqube-mcp-server-home
  namespace: devfeed
spec:
  secretName: sonarqube-mcp-server-home-tls
  dnsNames:
    - sonar.mcp.home
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: home-local-ca
    kind: ClusterIssuer
    group: cert-manager.io
