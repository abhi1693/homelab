apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardn-ai-whatsapp-bridge
  namespace: wardn
  labels:
    app.kubernetes.io/name: wardn-ai-whatsapp-bridge
    app.kubernetes.io/component: whatsapp-bridge
    app.kubernetes.io/part-of: wardn-ai
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wardn-ai-whatsapp-bridge
      app.kubernetes.io/component: whatsapp-bridge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wardn-ai-whatsapp-bridge
        app.kubernetes.io/component: whatsapp-bridge
        app.kubernetes.io/part-of: wardn-ai
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whatsapp-bridge
          # renovate: datasource=git-refs depName=https://github.com/abhi1693/wardn-ai currentValue=master
          image: registry.home/ghcr.io/abhi1693/wardn-ai-whatsapp-bridge:12b8f664b80a28656b7fa86ac191e29c3f734ae7
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIR
              value: /data/whatsapp
            - name: PORT
              value: "8090"
            - name: SESSION_UNLOAD_GRACE
              value: 24h
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          resources:
            requests:
              cpu: 30m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /data/whatsapp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wardn-ai-whatsapp-bridge-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
