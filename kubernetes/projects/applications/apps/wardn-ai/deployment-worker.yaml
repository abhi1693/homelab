apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardn-ai-worker
  namespace: wardn
  labels:
    app.kubernetes.io/name: wardn-ai-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: wardn-ai
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wardn-ai-worker
      app.kubernetes.io/component: worker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        home-lab.io/config-revision: "wardn-ai-0-0-37"
      labels:
        app.kubernetes.io/name: wardn-ai-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: wardn-ai
        wardn-ai-psql-client: "true"
    spec:
      serviceAccountName: wardn-ai-api
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: worker
          # renovate: datasource=git-refs depName=github.com/abhi1693/wardn-ai currentValue=master
          image: registry.home/ghcr.io/abhi1693/wardn-ai-worker:0.0.37
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: wardn-ai-api
            - secretRef:
                name: wardn-ai
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wardn-ai-postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wardn-ai-postgresql
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: wardn-ai-postgresql
                  key: dbname
            - name: WARDN_DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql-pooler-wardn-ai-rw.postgresql.svc.cluster.local:5432/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: kubernetes-service-account
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wardn-ai-data-nfs
        - name: kubernetes-service-account
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
