---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardn-license-api
  namespace: wardn
  labels:
    app.kubernetes.io/name: wardn-license-server
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: wardn
spec:
  revisionHistoryLimit: 2
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wardn-license-server
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        home-lab.io/config-revision: "2026-09-04-debug"
        home-lab.io/secret-revision: "2026-09-04-initial"
      labels:
        app.kubernetes.io/name: wardn-license-server
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: wardn
        wardn-license-psql-client: "true"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: wardn-license-server
                    app.kubernetes.io/component: api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          # renovate: datasource=github-releases depName=abhi1693/wardn-license-server
          image: registry.home/ghcr.io/abhi1693/wardn-license-server-backend:0.1.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: wardn-license-server
            - secretRef:
                name: wardn-license-server
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardn-license-frontend
  namespace: wardn
  labels:
    app.kubernetes.io/name: wardn-license-server
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: wardn
spec:
  revisionHistoryLimit: 2
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wardn-license-server
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        home-lab.io/config-revision: "2026-09-04-debug"
      labels:
        app.kubernetes.io/name: wardn-license-server
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: wardn
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: wardn-license-server
                    app.kubernetes.io/component: frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          # renovate: datasource=github-releases depName=abhi1693/wardn-license-server
          image: registry.home/ghcr.io/abhi1693/wardn-license-server-frontend:0.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: LICENSE_SERVER_API_URL
              value: http://wardn-license-api.wardn.svc.cluster.local:8000
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 448Mi
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
