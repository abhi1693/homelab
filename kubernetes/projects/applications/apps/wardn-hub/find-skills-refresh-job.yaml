apiVersion: batch/v1
kind: Job
metadata:
  name: wardn-hub-find-skills-refresh
  namespace: wardn
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "20"
  labels:
    app.kubernetes.io/name: wardn-hub-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: wardn-hub
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wardn-hub-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: wardn-hub
        wardn-hub-api-client: "true"
        wardn-hub-api-rollout-waiter: "true"
        wardn-hub-psql-client: "true"
    spec:
      automountServiceAccountToken: false
      serviceAccountName: wardn-hub-api-rollout-waiter
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-api-rollout
          # renovate: datasource=github-releases depName=abhi1693/wardn-hub
          image: registry.home/ghcr.io/abhi1693/wardn-hub-backend:0.2.179
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/wardn/wait-for-api-rollout.py
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
          volumeMounts:
            - name: api-rollout-script
              mountPath: /opt/wardn/wait-for-api-rollout.py
              subPath: wait-for-api-rollout.py
              readOnly: true
            - name: api-rollout-token
              mountPath: /var/run/secrets/wardn-hub-api-rollout
              readOnly: true
          envFrom:
            - secretRef:
                name: wardn-hub-github
      containers:
        - name: refresh-find-skills
          # renovate: datasource=github-releases depName=abhi1693/wardn-hub
          image: registry.home/ghcr.io/abhi1693/wardn-hub-backend:0.2.179
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - app.manage
            - skills
            - import-github
            - --repo
            - abhi1693/wardn-hub
            - --subfolder
            - skills/find-skills
            - --output
            - text
          envFrom:
            - configMapRef:
                name: wardn-hub
            - secretRef:
                name: wardn-hub
            - secretRef:
                name: wardn-hub-github
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wardn-hub-github
                  key: GITHUB_TOKEN
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wardn-hub-postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wardn-hub-postgresql
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: wardn-hub-postgresql
                  key: dbname
            - name: WARDN_HUB_DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql-pooler-wardn-hub-rw.postgresql.svc.cluster.local:5432/$(POSTGRES_DB)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WARDN_HUB_OTEL_SERVICE_NAME
              value: wardn-hub-find-skills-refresh
            - name: WARDN_HUB_OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=wardn-hub,deployment.environment.name=production,service.instance.id=$(POD_NAME),k8s.namespace.name=wardn,k8s.job.name=wardn-hub-find-skills-refresh,k8s.pod.name=$(POD_NAME),k8s.container.name=refresh-find-skills
          resources:
            requests:
              cpu: 370m
              memory: 1200Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
      volumes:
        - name: api-rollout-script
          configMap:
            name: wardn-hub-api-rollout-waiter
            defaultMode: 0444
        - name: api-rollout-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 1800
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
