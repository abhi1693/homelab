apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-blog
  namespace: personal-blog
  labels:
    app.kubernetes.io/name: personal-blog
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: personal-blog
spec:
  revisionHistoryLimit: 2
  replicas: 1
  minReadySeconds: 15
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-blog
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        home-lab.io/credential-revision: "1858798b831040729b8e83c97cbab71e"
      labels:
        app.kubernetes.io/name: personal-blog
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: personal-blog
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: personal-blog
                    app.kubernetes.io/component: web
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: personal-blog
              app.kubernetes.io/component: web
      containers:
        - name: web
          # renovate: datasource=docker depName=ghcr.io/abhi1693/personal-blog
          image: registry.home/ghcr.io/abhi1693/personal-blog:0.3.19@sha256:ef1bf496bcb009521b3d3f0675c58b624f85d0344e265f81e998415314f8a8db
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: personal-blog
            - configMapRef:
                name: personal-blog
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1152Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
