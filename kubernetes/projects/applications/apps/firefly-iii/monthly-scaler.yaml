---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-monthly-start
  namespace: finance
  labels:
    app.kubernetes.io/name: firefly-iii
    app.kubernetes.io/component: monthly-scaler
    app.kubernetes.io/part-of: firefly-iii
    home-lab.io/project-slug: applications
spec:
  schedule: "15 2 1 * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: firefly-iii
        app.kubernetes.io/component: monthly-scaler
        app.kubernetes.io/part-of: firefly-iii
        home-lab.io/project-slug: applications
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: firefly-iii
            app.kubernetes.io/component: monthly-scaler
            app.kubernetes.io/part-of: firefly-iii
            home-lab.io/project-slug: applications
        spec:
          serviceAccountName: firefly-monthly-scaler
          automountServiceAccountToken: true
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: arm64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: start-pooler
              # renovate: datasource=docker depName=rancher/kubectl
              image: registry.home/docker.io/rancher/kubectl:v1.36.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/kubectl"]
              args:
                - --namespace=postgresql
                - patch
                - pooler/postgresql-pooler-firefly-iii-rw
                - --type=merge
                - --patch={"spec":{"instances":1}}
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
            - name: wait-for-pooler-scale
              # renovate: datasource=docker depName=rancher/kubectl
              image: registry.home/docker.io/rancher/kubectl:v1.36.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/kubectl"]
              args:
                - --namespace=postgresql
                - wait
                - --for=jsonpath='{.spec.replicas}'=1
                - --timeout=10m
                - deployment/postgresql-pooler-firefly-iii-rw
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
            - name: wait-for-pooler
              # renovate: datasource=docker depName=rancher/kubectl
              image: registry.home/docker.io/rancher/kubectl:v1.36.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/kubectl"]
              args:
                - --namespace=postgresql
                - rollout
                - status
                - deployment/postgresql-pooler-firefly-iii-rw
                - --timeout=10m
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
            - name: start-firefly
              # renovate: datasource=docker depName=rancher/kubectl
              image: registry.home/docker.io/rancher/kubectl:v1.36.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/kubectl"]
              args:
                - --namespace=finance
                - scale
                - deployment/firefly-iii
                - --replicas=1
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
            - name: wait-for-firefly
              # renovate: datasource=docker depName=rancher/kubectl
              image: registry.home/docker.io/rancher/kubectl:v1.36.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/kubectl"]
              args:
                - --namespace=finance
                - rollout
                - status
                - deployment/firefly-iii
                - --timeout=10m
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
            - name: resume-firefly-cron
              # renovate: datasource=docker depName=rancher/kubectl
              image: registry.home/docker.io/rancher/kubectl:v1.36.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/kubectl"]
              args:
                - --namespace=finance
                - patch
                - cronjob/firefly-iii-cron
                - --type=merge
                - --patch={"spec":{"suspend":false}}
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          containers:
            - name: verify-firefly
              # renovate: datasource=docker depName=rancher/kubectl
              image: registry.home/docker.io/rancher/kubectl:v1.36.2
              imagePullPolicy: IfNotPresent
              command: ["/bin/kubectl"]
              args:
                - --namespace=finance
                - get
                - deployment/firefly-iii
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
---
