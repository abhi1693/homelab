---
name: firefly-iii
defaultNamespace: finance
labels:
  app.kubernetes.io/part-of: firefly-iii
  home-lab.io/project-slug: applications
dependsOn:
  - name: rancher-project-applications
  - name: firefly-iii-storage
  - name: postgresql
  - name: postgresql-networkpolicy
  - name: postgresql-pooler-pdb
diff:
  comparePatches:
    - apiVersion: apps/v1
      kind: Deployment
      name: firefly-iii
      namespace: finance
      jsonPointers:
        - /spec/replicas
    - apiVersion: batch/v1
      kind: CronJob
      name: firefly-iii-cron
      namespace: finance
      jsonPointers:
        - /spec/suspend
helm:
  takeOwnership: true
