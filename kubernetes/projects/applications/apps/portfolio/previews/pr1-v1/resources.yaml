---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yashika-preview-pr1-v1
  namespace: portfolio
  labels:
    app.kubernetes.io/name: yashika-preview-pr1-v1
    app.kubernetes.io/part-of: yashika-preview
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: yashika-preview-pr1-v1
      app.kubernetes.io/part-of: yashika-preview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yashika-preview-pr1-v1
        app.kubernetes.io/part-of: yashika-preview
      annotations:
        preview.home-lab.io/source: https://github.com/yashikavarshney/yashikavarshneyy/pull/1
        preview.home-lab.io/commit: e6dcf46fa4ab47014b2910aae8949f0a42f8b72f
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # renovate: datasource=docker depName=registry.home/home/yashika-preview
          image: registry.home/home/yashika-preview:pr1-v5-node-e6dcf46fa4ab47014b2910aae8949f0a42f8b72f@sha256:d4cc3308b4aaa59ee1eed0693b3c037bcd20dcecdff96a7476bb287686c3f552
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: yashika-preview-pr1-v1
  namespace: portfolio
  labels:
    app.kubernetes.io/name: yashika-preview-pr1-v1
    app.kubernetes.io/part-of: yashika-preview
spec:
  selector:
    app.kubernetes.io/name: yashika-preview-pr1-v1
    app.kubernetes.io/part-of: yashika-preview
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yashika-preview-pr1-v1
  namespace: portfolio
  labels:
    app.kubernetes.io/name: yashika-preview-pr1-v1
    app.kubernetes.io/part-of: yashika-preview
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: preview-pr1-v1-e6dcf46fa4ab47014b2910aae8949f0a42f8b72f.abhimanyu-saharan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yashika-preview-pr1-v1
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yashika-preview-pr1-v1
  namespace: portfolio
  labels:
    app.kubernetes.io/name: yashika-preview-pr1-v1
    app.kubernetes.io/part-of: yashika-preview
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: yashika-preview-pr1-v1
      app.kubernetes.io/part-of: yashika-preview
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
          podSelector:
            matchLabels:
              app: controlled-cloudflared-connector
      ports:
        - protocol: TCP
          port: 8080
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yashika-preview-pr1-v1-egress
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: yashika-preview-pr1-v1
    app.kubernetes.io/part-of: yashika-preview
spec:
  podSelector:
    matchLabels:
      app: controlled-cloudflared-connector
      strrl.dev/cloudflare-tunnel-ingress-controller: controlled-cloudflared-connector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portfolio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: yashika-preview-pr1-v1
              app.kubernetes.io/part-of: yashika-preview
      ports:
        - protocol: TCP
          port: 8080
