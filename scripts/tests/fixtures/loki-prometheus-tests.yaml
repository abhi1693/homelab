---
rule_files:
- rules.yml
evaluation_interval: 1m
tests:
- name: traffic without WAL progress persists beyond hold time
  interval: 1m
  input_series:
  - series: loki_distributor_lines_received_total{namespace="cattle-monitoring-system"}
    values: 0+100x30
  - series: loki_ingester_wal_records_logged_total{namespace="cattle-monitoring-system"}
    values: 100+0x30
  alert_rule_test:
  - eval_time: 4m
    alertname: LokiWALWritesStalled
    exp_alerts: []
  - eval_time: 15m
    alertname: LokiWALWritesStalled
    exp_alerts:
    - exp_labels: &id001
        severity: critical
        namespace: cattle-monitoring-system
        incident: log-delivery
      exp_annotations: &id002
        summary: Loki receives logs but makes no WAL progress
        description: Incoming logs persist while the rolling 10-minute successful WAL-record increase stays
          zero. Readiness and received-line counters do not prove durable ingestion; inspect WAL errors and
          query fresh logs before recovery.
        runbook_url: https://github.com/abhi1693/home-lab/blob/master/docs/runbooks/loki-stale-nfs-wal.md
- name: healthy ingestion advances WAL
  interval: 1m
  input_series:
  - series: loki_distributor_lines_received_total{namespace="cattle-monitoring-system"}
    values: 0+100x30
  - series: loki_ingester_wal_records_logged_total{namespace="cattle-monitoring-system"}
    values: 0+10x30
  alert_rule_test:
  - eval_time: 20m
    alertname: LokiWALWritesStalled
    exp_alerts: []
- name: idle ingestion does not page
  interval: 1m
  input_series:
  - series: loki_distributor_lines_received_total{namespace="cattle-monitoring-system"}
    values: 100+0x30
  - series: loki_ingester_wal_records_logged_total{namespace="cattle-monitoring-system"}
    values: 100+0x30
  alert_rule_test:
  - eval_time: 20m
    alertname: LokiWALWritesStalled
    exp_alerts: []
- name: missing WAL telemetry is not reported as zero progress
  interval: 1m
  input_series:
  - series: loki_distributor_lines_received_total{namespace="cattle-monitoring-system"}
    values: 0+100x30
  alert_rule_test:
  - eval_time: 20m
    alertname: LokiWALWritesStalled
    exp_alerts: []
- name: WAL resumes and alert recovers
  interval: 1m
  input_series:
  - series: loki_distributor_lines_received_total{namespace="cattle-monitoring-system"}
    values: 0+100x40
  - series: loki_ingester_wal_records_logged_total{namespace="cattle-monitoring-system"}
    values: 100+0x15 110+10x24
  alert_rule_test:
  - eval_time: 15m
    alertname: LokiWALWritesStalled
    exp_alerts:
    - exp_labels: *id001
      exp_annotations: *id002
  - eval_time: 26m
    alertname: LokiWALWritesStalled
    exp_alerts: []
- name: WAL counter reset with new writes remains healthy
  interval: 1m
  input_series:
  - series: loki_distributor_lines_received_total{namespace="cattle-monitoring-system"}
    values: 0+100x10 0+100x20
  - series: loki_ingester_wal_records_logged_total{namespace="cattle-monitoring-system"}
    values: 0+10x10 0+10x20
  alert_rule_test:
  - eval_time: 20m
    alertname: LokiWALWritesStalled
    exp_alerts: []
- name: unrelated namespace traffic does not page
  interval: 1m
  input_series:
  - series: loki_distributor_lines_received_total{namespace="other"}
    values: 0+100x30
  - series: loki_ingester_wal_records_logged_total{namespace="cattle-monitoring-system"}
    values: 100+0x30
  alert_rule_test:
  - eval_time: 20m
    alertname: LokiWALWritesStalled
    exp_alerts: []
- name: non-retryable queue drops remain visible with reason and namespace
  interval: 1m
  input_series:
  - series: loki_write_dropped_entries_total{namespace="cattle-monitoring-system",pod="alloy-node-logs-test",reason="queue_is_full"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 10m
    alertname: AlloyLogEntriesDropped
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: cattle-monitoring-system
        incident: log-delivery
        data_loss: permanent
        pod: alloy-node-logs-test
        reason: queue_is_full
      exp_annotations:
        summary: Alloy permanently discarded log entries
        description: 'Last positive 10m window: alloy-node-logs-test permanently lost ~10 entries (reason=queue_is_full).
          Check collector HTTP errors, Loki rejections, and queue pressure. Drops can follow non-retryable
          errors or exhausted retries. Held firing for 10m after positive evaluations stop; resolved means
          no recent drops, not recovery. Verify fresh logs after repair.'
        runbook_url: https://github.com/abhi1693/home-lab/blob/master/kubernetes/projects/system/apps/loki/README.md#delivery-headroom-and-alerts
- name: generic ingester errors are not described as retry exhaustion
  interval: 1m
  input_series:
  - series: loki_write_dropped_entries_total{namespace="cattle-monitoring-system",pod="alloy-faro-test",reason="ingester_error"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 10m
    alertname: AlloyLogEntriesDropped
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: cattle-monitoring-system
        incident: log-delivery
        data_loss: permanent
        pod: alloy-faro-test
