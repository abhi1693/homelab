          pipeline-stage counts must not be added.'
        runbook_url: https://github.com/abhi1693/home-lab/blob/master/kubernetes/projects/system/apps/loki/README.md#delivery-headroom-and-alerts
- name: unrelated namespace drops and rejections do not alert
  interval: 1m
  input_series:
  - series: loki_write_dropped_entries_total{namespace="other",pod="alloy-other",reason="ingester_error"}
    values: 0+100x30
  - series: loki_discarded_samples_total{namespace="other",reason="too_far_behind"}
    values: 0+100x30
  alert_rule_test:
  - eval_time: 20m
    alertname: AlloyLogEntriesDropped
    exp_alerts: []
  - eval_time: 20m
    alertname: LokiLogEntriesRejected
    exp_alerts: []
