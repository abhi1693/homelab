          no recent drops, not recovery. Verify fresh logs after repair.'
        runbook_url: https://github.com/abhi1693/home-lab/blob/master/kubernetes/projects/system/apps/loki/README.md#delivery-headroom-and-alerts
- name: historical drops and new retries without new drops do not alert
  interval: 1m
  input_series:
  - series: loki_write_dropped_entries_total{namespace="cattle-monitoring-system",pod="alloy-healthy",reason="ingester_error"}
    values: 1000+0x30
  - series: loki_write_batch_retries_total{namespace="cattle-monitoring-system",pod="alloy-healthy"}
    values: 0+100x30
  alert_rule_test:
  - eval_time: 20m
    alertname: AlloyLogEntriesDropped
    exp_alerts: []
- name: Loki rejections preserve reason namespace hold time and recovery
  interval: 1m
  input_series:
  - series: loki_discarded_samples_total{namespace="cattle-monitoring-system",reason="too_far_behind"}
    values: 0+1x10 10+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: LokiLogEntriesRejected
    exp_alerts: []
  - eval_time: 10m
    alertname: LokiLogEntriesRejected
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: cattle-monitoring-system
        incident: log-delivery
        reason: too_far_behind
      exp_annotations:
        summary: Loki is rejecting log entries
        description: 'Loki rejected ~10 entries in 10m (reason=too_far_behind). Check Loki validation errors:
          too_far_behind needs producer timestamp/ordering checks; rate limits need ingestion-budget/burst
          checks. The rolling increase has stayed positive for 5m. Compare Alloy permanent drops separately;
          pipeline-stage counts must not be added.'
        runbook_url: https://github.com/abhi1693/home-lab/blob/master/kubernetes/projects/system/apps/loki/README.md#delivery-headroom-and-alerts
  - eval_time: 22m
    alertname: LokiLogEntriesRejected
    exp_alerts: []
- name: Loki rejection without a reason remains visible
  interval: 1m
  input_series:
  - series: loki_discarded_samples_total{namespace="cattle-monitoring-system"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 10m
    alertname: LokiLogEntriesRejected
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: cattle-monitoring-system
        incident: log-delivery
      exp_annotations:
        summary: Loki is rejecting log entries
        description: 'Loki rejected ~10 entries in 10m (reason=unspecified). Check Loki validation errors:
          too_far_behind needs producer timestamp/ordering checks; rate limits need ingestion-budget/burst
