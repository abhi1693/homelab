---
rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  - name: small table below trigger
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuple_ratio{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 0.1128+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 80+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_vacuum_trigger_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 120.9+0x40
      - series: cnpg_pg_replication_in_recovery{namespace="postgresql",pod="postgresql-1"}
        values: 0+0x40
    alert_rule_test:
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioCritical
        exp_alerts: []
  - name: exact trigger does not fire
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuple_ratio{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 0.17+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 121+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_vacuum_trigger_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 121+0x40
      - series: cnpg_pg_replication_in_recovery{namespace="postgresql",pod="postgresql-1"}
        values: 0+0x40
    alert_rule_test:
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioCritical
        exp_alerts: []
  - name: primary above trigger warns
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuple_ratio{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 0.13+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 130+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_vacuum_trigger_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 120.9+0x40
      - series: cnpg_pg_replication_in_recovery{namespace="postgresql",pod="postgresql-1"}
        values: 0+0x40
    alert_rule_test:
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioHigh
        exp_alerts:
          - exp_labels:
              datname: harbor
              schemaname: public
              relname: tag
              severity: warning
            exp_annotations:
              summary: PostgreSQL table remains above its autovacuum threshold
              description: harbor.public.tag has exceeded its effective autovacuum trigger and an 8% dead-tuple
                ratio for 15 minutes; inspect autovacuum progress.
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioCritical
        exp_alerts: []
  - name: primary sustained excess is critical
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuple_ratio{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 0.2+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 200+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_vacuum_trigger_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 120.9+0x40
      - series: cnpg_pg_replication_in_recovery{namespace="postgresql",pod="postgresql-1"}
        values: 0+0x40
    alert_rule_test:
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioHigh
        exp_alerts:
          - exp_labels:
              datname: harbor
              schemaname: public
              relname: tag
              severity: warning
            exp_annotations:
              summary: PostgreSQL table remains above its autovacuum threshold
              description: harbor.public.tag has exceeded its effective autovacuum trigger and an 8% dead-tuple
                ratio for 15 minutes; inspect autovacuum progress.
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioCritical
        exp_alerts:
          - exp_labels:
              datname: harbor
              schemaname: public
              relname: tag
              severity: critical
            exp_annotations:
              summary: PostgreSQL table has excessive dead tuples
              description: harbor.public.tag has exceeded its effective autovacuum trigger and a 15% dead-tuple
                ratio for 30 minutes; inspect autovacuum progress and table churn.
  - name: standby never alerts
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuple_ratio{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 0.2+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 200+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_vacuum_trigger_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 120.9+0x40
      - series: cnpg_pg_replication_in_recovery{namespace="postgresql",pod="postgresql-1"}
        values: 1+0x40
    alert_rule_test:
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioCritical
        exp_alerts: []
  - name: table override controls trigger
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuple_ratio{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 0.1128+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_dead_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 80+0x40
      - series: cnpg_pg_stat_user_tables_autovacuum_vacuum_trigger_tuples{namespace="postgresql",pod="postgresql-1",datname="harbor",schemaname="public",relname="tag"}
        values: 64.18+0x40
      - series: cnpg_pg_replication_in_recovery{namespace="postgresql",pod="postgresql-1"}
        values: 0+0x40
    alert_rule_test:
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioHigh
        exp_alerts:
          - exp_labels:
              datname: harbor
              schemaname: public
              relname: tag
              severity: warning
            exp_annotations:
              summary: PostgreSQL table remains above its autovacuum threshold
              description: harbor.public.tag has exceeded its effective autovacuum trigger and an 8% dead-tuple
                ratio for 15 minutes; inspect autovacuum progress.
      - eval_time: 40m
        alertname: PostgreSQLDeadTupleRatioCritical
        exp_alerts: []
  - name: physical critical exact threshold does not fire
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_lag{namespace="postgresql",pod="postgresql-2"}
        values: 15+0x8
    alert_rule_test:
      - eval_time: 8m
        alertname: CNPGClusterPhysicalReplicationLagCritical
        exp_alerts: []
  - name: physical critical retains five minute hold and seconds
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_lag{namespace="postgresql",pod="postgresql-2"}
        values: 16+0x8
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterPhysicalReplicationLagCritical
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationLagCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: postgresql
              cnpg_cluster: postgresql
            exp_annotations:
              summary: CNPG Cluster very high physical replication lag
              description: |-
                CloudNativePG Cluster "postgresql/postgresql" is experiencing a very high physical replication lag of 16s.

                High replication lag indicates network issues, busy instances, slow queries or suboptimal configuration.
              runbook_url: https://github.com/cloudnative-pg/charts/blob/main/charts/cluster/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
  - name: physical critical excludes pooler pods
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_lag{namespace="postgresql",pod="postgresql-pooler-netbox-rw-1"}
        values: 999+0x8
    alert_rule_test:
      - eval_time: 8m
        alertname: CNPGClusterPhysicalReplicationLagCritical
        exp_alerts: []
