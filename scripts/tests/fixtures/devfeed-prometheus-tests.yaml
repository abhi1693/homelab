---
evaluation_interval: 30s
tests:
- name: no traffic is not an SLO burn
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{telemetry="devfeed-application",devfeed_request_kind="request",namespace="devfeed",service="api",http_response_status_code="200"}
    values: 0+0x400
  alert_rule_test:
  - eval_time: 7h
    alertname: DevFeedAvailabilityFastBurn
    exp_alerts: []
  - eval_time: 7h
    alertname: DevFeedAvailabilitySlowBurn
    exp_alerts: []
- name: sustained 5xx burns budget
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{telemetry="devfeed-application",devfeed_request_kind="request",namespace="devfeed",service="api",http_response_status_code="200"}
    values: 0+95x400
  - series: http_server_request_duration_seconds_count{telemetry="devfeed-application",devfeed_request_kind="request",namespace="devfeed",service="api",http_response_status_code="503"}
    values: 0+5x400
  alert_rule_test:
  - eval_time: 6h
    alertname: DevFeedAvailabilityFastBurn
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: devfeed
        app: devfeed
        service: api
      exp_annotations:
        summary: DevFeed availability is burning its error budget quickly
        description: Both the 1h and 5m windows exceed the 99.9% SLO fast-burn threshold, with at least 100 requests in 1h.
          Inspect 5xx routes, recent releases, readiness, database and dependency panels.
        runbook_url: https://github.com/abhi1693/devfeed.tech/blob/v0.0.45/packages/core/OBSERVABILITY.md
        dashboard_url: http://grafana.home/d/devfeed-operations
  - eval_time: 6h
    alertname: DevFeedAvailabilitySlowBurn
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: devfeed
        app: devfeed
        service: api
      exp_annotations:
        summary: DevFeed availability has sustained error-budget burn
        description: Both 6h and 30m exceed the slower burn threshold. Low traffic alone does not trigger a burn alert; deployment
          and synthetic availability checks cover total outages.
        runbook_url: https://github.com/abhi1693/devfeed.tech/blob/v0.0.45/packages/core/OBSERVABILITY.md
        dashboard_url: http://grafana.home/d/devfeed-operations
- name: short error burst does not trigger long-window burn
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{telemetry="devfeed-application",devfeed_request_kind="request",namespace="devfeed",service="api",http_response_status_code="200"}
    values: 0+100x358 35900 36000
  - series: http_server_request_duration_seconds_count{telemetry="devfeed-application",devfeed_request_kind="request",namespace="devfeed",service="api",http_response_status_code="503"}
    values: 0+0x358 100 100
  alert_rule_test:
  - eval_time: 6h
    alertname: DevFeedAvailabilityFastBurn
    exp_alerts: []
  - eval_time: 6h
    alertname: DevFeedAvailabilitySlowBurn
    exp_alerts: []
- name: probe outage is detected independently of traffic
  interval: 1m
  input_series:
  - series: probe_success{namespace="devfeed",job="devfeed-http-probes",instance="https://devfeed.tech/"}
    values: 0+0x30
  alert_rule_test:
  - eval_time: 20m
    alertname: DevFeedHTTPProbeFailed
    exp_alerts:
    - exp_labels:
        severity: critical
        namespace: devfeed
        app: devfeed
        job: devfeed-http-probes
        instance: https://devfeed.tech/
      exp_annotations:
        summary: A DevFeed HTTP availability probe is failing
        description: Public reader HTTPS or an internal service readiness/login probe failed. Inspect the instance URL, probe
          HTTP status/TLS/DNS and corresponding deployment. No authenticated account action is performed.
        runbook_url: https://github.com/abhi1693/devfeed.tech/blob/v0.0.45/packages/core/OBSERVABILITY.md
        dashboard_url: http://grafana.home/d/devfeed-operations
- name: application pool timeouts are visible independently of SQL execution errors
  interval: 1m
  input_series:
  - series: db_client_connection_wait_time_seconds_count{namespace="devfeed",service="api",outcome="timeout"}
    values: 0 0 1 1 1 1
  alert_rule_test:
  - eval_time: 4m
    alertname: DevFeedDatabasePoolTimeout
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: devfeed
        app: devfeed
        service: api
      exp_annotations:
        summary: DevFeed exhausted an application database pool
        description: Check pool checkout and hold time before increasing connections. PgBouncer readiness does not prove local
          pool capacity.
        dashboard_url: http://grafana.home/d/devfeed-diagnostics
- name: normalize native and Node histograms while excluding notification streams
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{namespace="devfeed",telemetry="devfeed-application",service="api",http_response_status_code="200",devfeed_request_kind="request"}
    values: 100+0x10
  - series: http_server_request_duration_seconds_bucket{namespace="devfeed",telemetry="devfeed-application",service="api",http_response_status_code="200",devfeed_request_kind="request",le="+Inf"}
    values: 100+0x10
  - series: http_server_request_duration_seconds_count{namespace="devfeed",telemetry="devfeed-application",service="api",http_response_status_code="503",devfeed_request_kind="stream"}
    values: 1000+0x10
  - series: http_server_request_duration_seconds_bucket{namespace="devfeed",telemetry="devfeed-application",service="api",http_response_status_code="503",devfeed_request_kind="stream",le="+Inf"}
    values: 1000+0x10
  - series: devfeed_http_request_duration_seconds_count{namespace="devfeed",telemetry="devfeed-application",service="web",status="200",route="/latest"}
    values: 50+0x10
  - series: devfeed_http_request_duration_seconds_bucket{namespace="devfeed",telemetry="devfeed-application",service="web",status="200",route="/latest",le="+Inf"}
    values: 50+0x10
  promql_expr_test:
  - expr: sum by (service) (devfeed:http_duration_seconds_count)
    eval_time: 5m
    exp_samples:
    - labels: '{service="api"}'
      value: 100
    - labels: '{service="web"}'
      value: 50
  - expr: sum by (service) (devfeed:http_duration_seconds_bucket{le="+Inf"})
    eval_time: 5m
    exp_samples:
    - labels: '{service="api"}'
      value: 100
    - labels: '{service="web"}'
      value: 50
