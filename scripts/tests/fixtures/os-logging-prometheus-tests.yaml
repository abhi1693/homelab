    values: 100+0x30
  - series: otelcol_exporter_queue_capacity{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-2",component_id="otelcol.exporter.otlphttp.os",exporter="otlp_http/otelcol.exporter.otlphttp.os",data_type="logs"}
    values: 100+0x30
  - series: otelcol_exporter_queue_size{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-2",component_id="otelcol.exporter.otlphttp.loki",exporter="otlp_http/otelcol.exporter.otlphttp.loki",data_type="logs"}
    values: 10+0x30
