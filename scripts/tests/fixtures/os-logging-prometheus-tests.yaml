---
rule_files:
- rules.yml
evaluation_interval: 1m
tests:
- name: all eight expected nodes deliver and healthy queues do not alert
  interval: 1m
  input_series:
  - series: kube_daemonset_status_number_available{namespace="cattle-monitoring-system",daemonset="alloy-node-logs"}
    values: 8+0x30
  - series: kube_daemonset_status_desired_number_scheduled{namespace="cattle-monitoring-system",daemonset="alloy-node-logs"}
    values: 8+0x30
  - series: up{namespace="cattle-monitoring-system",job="alloy-os-log-monitor",pod="checker-a"}
    values: 1+0x30
  - series: os_log_monitor_query_success{namespace="cattle-monitoring-system",job="alloy-os-log-monitor",pod="checker-a"}
    values: 1+0x30
  - series: kube_node_info{node="k8s-rpi1"}
    values: 1+0x30
  - series: os_log_canary_recent_records{namespace="cattle-monitoring-system",node="k8s-rpi1"}
    values: 5+0x30
  - series: up{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-1"}
    values: 1+0x30
  - series: otelcol_exporter_queue_capacity{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-1",component_id="otelcol.exporter.otlphttp.loki",exporter="otlp_http/otelcol.exporter.otlphttp.loki",data_type="logs"}
    values: 100+0x30
  - series: otelcol_exporter_queue_capacity{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-1",component_id="otelcol.exporter.otlphttp.os",exporter="otlp_http/otelcol.exporter.otlphttp.os",data_type="logs"}
    values: 100+0x30
  - series: otelcol_exporter_queue_size{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-1",component_id="otelcol.exporter.otlphttp.loki",exporter="otlp_http/otelcol.exporter.otlphttp.loki",data_type="logs"}
    values: 10+0x30
  - series: kube_node_info{node="k8s-rpi2"}
    values: 1+0x30
  - series: os_log_canary_recent_records{namespace="cattle-monitoring-system",node="k8s-rpi2"}
    values: 5+0x30
