    alertname: AlloyNodeOTelLogQueueHigh
    exp_alerts: []
  - eval_time: 6m
    alertname: AlloyNodeOTelLogQueueHigh
    exp_alerts:
    - exp_labels:
        namespace: cattle-monitoring-system
        job: alloy-node-logs
        pod: collector-a
        component_id: otelcol.exporter.otlphttp.os
        exporter: otlp_http/otelcol.exporter.otlphttp.os
        data_type: logs
        severity: warning
        incident: log-delivery
      exp_annotations:
        summary: A node persistent log queue is above 80 percent
        description: Inspect Loki availability, permanent rejections and local disk pressure on collector-a. Queue
