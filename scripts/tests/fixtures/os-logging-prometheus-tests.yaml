- name: 'OS exporter: sustained log byte queue pressure alerts after five minutes'
  interval: 1m
  input_series:
  - series: otelcol_exporter_queue_size{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-a",component_id="otelcol.exporter.otlphttp.os",exporter="otlp_http/otelcol.exporter.otlphttp.os",data_type="logs"}
    values: 90+0x20
  - series: otelcol_exporter_queue_capacity{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-a",component_id="otelcol.exporter.otlphttp.os",exporter="otlp_http/otelcol.exporter.otlphttp.os",data_type="logs"}
    values: 100+0x20
  alert_rule_test:
