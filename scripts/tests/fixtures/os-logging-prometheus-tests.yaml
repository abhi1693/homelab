  - series: otelcol_exporter_send_failed_log_records_total{namespace="other",job="alloy-node-logs",pod="collector-a",component_id="otelcol.exporter.otlphttp.loki",exporter="otlp_http/otelcol.exporter.otlphttp.loki"}
    values: 0 9+0x20
  alert_rule_test:
  - eval_time: 1m
    alertname: AlloyNodeOTelLogExportFailed
    exp_alerts: []

