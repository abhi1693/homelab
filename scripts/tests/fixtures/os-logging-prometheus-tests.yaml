  - series: otelcol_exporter_queue_capacity{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-4",component_id="otelcol.exporter.otlphttp.loki",exporter="otlp_http/otelcol.exporter.otlphttp.loki",data_type="logs"}
    values: 100+0x30
  - series: otelcol_exporter_queue_capacity{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-4",component_id="otelcol.exporter.otlphttp.os",exporter="otlp_http/otelcol.exporter.otlphttp.os",data_type="logs"}
    values: 100+0x30
  - series: otelcol_exporter_queue_size{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-4",component_id="otelcol.exporter.otlphttp.loki",exporter="otlp_http/otelcol.exporter.otlphttp.loki",data_type="logs"}
    values: 10+0x30
  - series: kube_node_info{node="k8s-rpi5"}
    values: 1+0x30
  - series: os_log_canary_recent_records{namespace="cattle-monitoring-system",node="k8s-rpi5"}
    values: 5+0x30
  - series: up{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-5"}
    values: 1+0x30
  - series: otelcol_exporter_queue_capacity{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-5",component_id="otelcol.exporter.otlphttp.loki",exporter="otlp_http/otelcol.exporter.otlphttp.loki",data_type="logs"}
    values: 100+0x30
  - series: otelcol_exporter_queue_capacity{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-5",component_id="otelcol.exporter.otlphttp.os",exporter="otlp_http/otelcol.exporter.otlphttp.os",data_type="logs"}
    values: 100+0x30
  - series: otelcol_exporter_queue_size{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-5",component_id="otelcol.exporter.otlphttp.loki",exporter="otlp_http/otelcol.exporter.otlphttp.loki",data_type="logs"}
    values: 10+0x30
  - series: kube_node_info{node="k8s-rpi6"}
    values: 1+0x30
  - series: os_log_canary_recent_records{namespace="cattle-monitoring-system",node="k8s-rpi6"}
    values: 5+0x30
  - series: up{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-6"}
