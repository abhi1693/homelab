        runbook_url: https://github.com/abhi1693/home-lab/blob/master/docs/runbooks/incident-coverage.md
- name: 'OS exporter: final send failure alerts immediately with permanent-loss semantics and holds recovery'
  interval: 1m
  input_series:
  - series: otelcol_exporter_send_failed_log_records_total{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-a",component_id="otelcol.exporter.otlphttp.os",exporter="otlp_http/otelcol.exporter.otlphttp.os",error_permanent="true",error_type="InvalidArgument"}
    values: 0 5+0x30
  alert_rule_test:
  - eval_time: 0m
    alertname: AlloyNodeOTelLogExportFailed
    exp_alerts: []
  - eval_time: 1m
    alertname: AlloyNodeOTelLogExportFailed
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: cattle-monitoring-system
        incident: log-delivery
        pod: collector-a
        exporter: otlp_http/otelcol.exporter.otlphttp.os
        data_loss: permanent
      exp_annotations:
        summary: A node OTel exporter failed final log delivery
        description: Exporter otlp_http/otelcol.exporter.otlphttp.os on collector-a reported ~5 failed log records
          in 10m after its retry handler returned. Check permanent HTTP errors, shutdown and cancellation. Retryable
          backend outages remain queued; Loki partial rejections are monitored separately. Do not sum these counters
          with Loki rejection counts.
        runbook_url: https://github.com/abhi1693/home-lab/blob/master/docs/runbooks/incident-coverage.md
  - eval_time: 19m
    alertname: AlloyNodeOTelLogExportFailed
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: cattle-monitoring-system
        incident: log-delivery
        pod: collector-a
        exporter: otlp_http/otelcol.exporter.otlphttp.os
        data_loss: permanent
      exp_annotations:
        summary: A node OTel exporter failed final log delivery
        description: Exporter otlp_http/otelcol.exporter.otlphttp.os on collector-a reported ~5 failed log records
          in 10m after its retry handler returned. Check permanent HTTP errors, shutdown and cancellation. Retryable
          backend outages remain queued; Loki partial rejections are monitored separately. Do not sum these counters
          with Loki rejection counts.
        runbook_url: https://github.com/abhi1693/home-lab/blob/master/docs/runbooks/incident-coverage.md
  - eval_time: 21m
    alertname: AlloyNodeOTelLogExportFailed
    exp_alerts: []
- name: 'OS exporter: enqueue failure warns without asserting permanent delivery loss'
  interval: 1m
  input_series:
  - series: otelcol_exporter_enqueue_failed_log_records_total{namespace="cattle-monitoring-system",job="alloy-node-logs",pod="collector-a",component_id="otelcol.exporter.otlphttp.os",exporter="otlp_http/otelcol.exporter.otlphttp.os"}
    values: 0 3+0x20
  alert_rule_test:
  - eval_time: 1m
    alertname: AlloyNodeOTelLogEnqueueFailed
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: cattle-monitoring-system
        incident: log-delivery
        pod: collector-a
        exporter: otlp_http/otelcol.exporter.otlphttp.os
      exp_annotations:
        summary: Node log payloads could not enter the persistent queue
        description: Check the bounded queue filesystem, permissions, I/O errors and queue capacity on collector-a.
          This failure precedes exporter retries. Some sources can retry; the journal bridge cannot acknowledge
          a durable enqueue, so evidence may have been lost.
        runbook_url: https://github.com/abhi1693/home-lab/blob/master/docs/runbooks/incident-coverage.md
  - eval_time: 1m
    alertname: AlloyNodeOTelLogExportFailed
    exp_alerts: []

